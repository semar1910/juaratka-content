<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>text{font-family:Poppins,"Segoe UI",Arial,sans-serif;font-weight:700;fill:#111827}
.kini{animation:muncul .7s ease-out both}
@keyframes muncul{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}</style>
<path d="M80 130 H524" stroke="#EF6C00" stroke-width="10" stroke-linecap="round"/>
<path d="M524 130 H820" stroke="#8D6E63" stroke-width="10" stroke-linecap="round"/>
<text x="302" y="62" font-size="26" text-anchor="middle" style="fill:#EF6C00">240 km</text>
<text x="302" y="95" font-size="24" text-anchor="middle" style="fill:#EF6C00">1 jam maju 120 km</text>
<text x="672" y="95" font-size="24" text-anchor="middle" style="fill:#8D6E63">1 jam maju 80 km</text>
<circle cx="80" cy="130" r="24" fill="#1E88E5" stroke="#fff" stroke-width="4"/><text x="80" y="140" font-size="26" text-anchor="middle" style="fill:#fff">P</text><circle cx="524" cy="130" r="24" fill="#EF6C00" stroke="#fff" stroke-width="4"/><text x="524" y="140" font-size="26" text-anchor="middle" style="fill:#fff">Q</text><circle cx="820" cy="130" r="24" fill="#8D6E63" stroke="#fff" stroke-width="4"/><text x="820" y="140" font-size="26" text-anchor="middle" style="fill:#fff">R</text>
<rect x="15" y="170" width="130" height="40" rx="20" fill="#1E88E5"/><text x="80" y="198" font-size="24" text-anchor="middle" style="fill:#fff">18.30</text>
<g id="tahap1"><text x="672" y="62" font-size="26" text-anchor="middle" style="fill:#8D6E63">160 km</text><rect x="755" y="170" width="130" height="40" rx="20" fill="#2E7D32"/><text x="820" y="198" font-size="24" text-anchor="middle" style="fill:#fff">22.30</text><rect x="40" y="290" width="820" height="42" rx="14" fill="#8D6E63" fill-opacity=".14"/><rect x="40" y="290" width="10" height="42" rx="5" fill="#8D6E63"/><text x="66" y="319" font-size="23">Sisa jalan</text><text x="850" y="319" font-size="23" text-anchor="end" style="fill:#8D6E63">400 − 240 = 160 km</text><rect x="40" y="338" width="820" height="42" rx="14" fill="#EF6C00" fill-opacity=".14"/><rect x="40" y="338" width="10" height="42" rx="5" fill="#EF6C00"/><text x="66" y="367" font-size="23">Bagian 1 (P ke Q)</text><text x="850" y="367" font-size="23" text-anchor="end" style="fill:#EF6C00">240 ÷ 120 = 2 jam</text><rect x="40" y="386" width="820" height="42" rx="14" fill="#8D6E63" fill-opacity=".14"/><rect x="40" y="386" width="10" height="42" rx="5" fill="#8D6E63"/><text x="66" y="415" font-size="23">Bagian 2 (Q ke R)</text><text x="850" y="415" font-size="23" text-anchor="end" style="fill:#8D6E63">160 ÷ 80 = 2 jam</text><rect x="40" y="434" width="820" height="42" rx="14" fill="#2E7D32" fill-opacity=".14"/><rect x="40" y="434" width="10" height="42" rx="5" fill="#2E7D32"/><text x="66" y="463" font-size="23">Jam tiba di R</text><text x="850" y="463" font-size="23" text-anchor="end" style="fill:#2E7D32">18.30 + 4 jam = 22.30</text></g>
<g id="tahap2"><rect x="459" y="170" width="130" height="40" rx="20" fill="#2E7D32"/><text x="524" y="198" font-size="24" text-anchor="middle" style="fill:#fff">20.30</text><rect x="40" y="482" width="820" height="42" rx="14" fill="#EF6C00" fill-opacity=".14"/><rect x="40" y="482" width="10" height="42" rx="5" fill="#EF6C00"/><text x="66" y="511" font-size="23">Jam tiba di Q</text><text x="850" y="511" font-size="23" text-anchor="end" style="fill:#EF6C00">18.30 + 2 jam = 20.30</text></g>
<g id="tahap3"><path d="M80 224 v14 H820 v-14" stroke="#2E7D32" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="274" font-size="30" text-anchor="middle" style="fill:#2E7D32">4 jam</text><rect x="40" y="530" width="820" height="42" rx="14" fill="#2E7D32" fill-opacity=".14"/><rect x="40" y="530" width="10" height="42" rx="5" fill="#2E7D32"/><text x="66" y="559" font-size="23">Jalan P ke R</text><text x="850" y="559" font-size="23" text-anchor="end" style="fill:#2E7D32">2 jam + 2 jam = 4 jam</text></g>
</svg>