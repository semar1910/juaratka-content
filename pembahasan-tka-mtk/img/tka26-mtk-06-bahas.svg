#8D6E63">28.000 cm³</text><text x="668" y="288" font-size="28" font-weight="700" fill="#EF6C00">(4 bagian)</text></g><g class="fx pop" style="animation-delay:2.00s"><text class="fx sorot" style="animation-delay:2.60s" x="450" y="497" text-anchor="middle" font-size="42" font-weight="700" fill="#2E7D32">28.000 ÷ 4 = 7.000 cm³</text></g><g class="fx pop" style="animation-delay:2.35s"><text x="340.0" y="280.1" text-anchor="middle" font-size="28" font-weight="700" fill="#5D4037">7.000</text></g><g class="fx pop" style="animation-delay:2.47s"><text x="340.0" y="310.5" text-anchor="middle" font-size="28" font-weight="700" fill="#5D4037">7.000</text></g><g class="fx pop" style="animation-delay:2.59s"><text x="340.0" y="340.9" text-anchor="middle" font-size="28" font-weight="700" fill="#5D4037">7.000</text></g><g class="fx pop" style="animation-delay:2.71s"><text x="340.0" y="371.3" text-anchor="middle" font-size="28" font-weight="700" fill="#5D4037">7.000</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="308.0" y="9" width="246.4" height="90" rx="45" fill="none" stroke="#EF6C00" stroke-width="5"/><path class="alir" d="M431.2 96 V112 H480 V240" fill="none" stroke="#EF6C00" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="431.2" cy="96" r="9" fill="#EF6C00"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="480" cy="240" r="12" fill="#EF6C00" stroke="#fff" stroke-width="3"/></g></g><g class="fx muncul" style="animation-delay:0.20s"><rect x="152" y="227.0" width="376" height="28.4" fill="#FFE082" stroke="#EF6C00" stroke-width="1.5"/><polygon points="532,225.0 638,167.0 638,197.4 532,255.4" fill="#FFCA28" stroke="#EF6C00" stroke-width="1.5"/></g><g class="fx pop" style="animation-delay:0.60s"><text x="340.0" y="249.7" text-anchor="middle" font-size="28" font-weight="700" fill="#5D4037">7.000</text></g><g class="fx pop" style="animation-delay:1.20s"><text class="fx sorot" style="animation-delay:1.80s" x="450" y="555" text-anchor="middle" font-size="42" font-weight="700" fill="#2E7D32">7.000 × 5 = 35.000 cm³</text></g></g><g id="tahap4"><text x="450" y="615" text-anchor="middle" font-size="38" font-weight="700" fill="#6B7280"><tspan fill="#2E7D32">35.000</tspan> = <tspan fill="#1E88E5">50</tspan> × lebar × <tspan fill="#1E88E5">20</tspan></text></g><g id="tahap5"><g class="penunjuk"><rect class="fx cincin" x="73.0" y="9" width="233.0" height="90" rx="45" fill="none" stroke="#1E88E5" stroke-width="5"/><path class="alir" d="M189.5 96 V112 H12 V431 H276" fill="none" stroke="#1E88E5" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="189.5" cy="96" r="9" fill="#1E88E5"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="276" cy="431" r="12" fill="#1E88E5" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.40s"><text x="450" y="675" text-anchor="middle" font-size="40" font-weight="700" fill="#1E88E5">50 × 20 = 1.000</text></g><path class="garis" style="animation-delay:0.90s" d="M538 387 L648 329" fill="none" stroke="#2E7D32" stroke-width="5" stroke-linecap="round"/><g class="fx pop" style="animation-delay:1.40s"><text x="668" y="363" font-size="30" font-weight="700" fill="#2E7D32">lebar 35 cm</text></g><g class="fx pop" style="animation-delay:1.70s"><text class="fx sorot" style="animation-delay:2.30s" x="450" y="737" text-anchor="middle" font-size="46" font-weight="700" fill="#2E7D32">35.000 ÷ 1.000 = 35 cm</text></g></g></svg>