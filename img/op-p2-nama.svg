<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .op-frac-t { font-size: 36px; font-weight: 800; fill: #334155; text-anchor: middle; }
    .op-grp { transform-box: fill-box; transform-origin: 50% 50%; }
    .op-f1 { animation: op-muncul .4s ease-out .3s both; }
    .op-f2 { animation: op-muncul .4s ease-out 1s both; }
    .op-dan { font-size: 14px; font-weight: 600; fill: #64748B; text-anchor: middle; animation: op-muncul .4s ease-out 1s both; }
    .op-pny { animation: op-jadi-a .3s ease-out 1.8s both, op-kedut .4s ease-in-out 2.1s 3; }
    .op-pbl { animation: op-jadi-b .3s ease-out 3.4s both, op-kedut .4s ease-in-out 3.7s 3; }
    .op-lbl { font-size: 13px; font-weight: 700; text-anchor: middle; }
    .op-lbl-a { fill: #EA580C; animation: op-muncul .4s ease-out 1.8s both; }
    .op-lbl-b { fill: #2563EB; animation: op-muncul .4s ease-out 3.4s both; }
    .op-total { animation: op-muncul .4s ease-out 5s both; }
    .op-cap { font-size: 11px; font-weight: 600; fill: #64748B; text-anchor: middle; }
    .op-eq { font-size: 20px; font-weight: 800; text-anchor: middle; }
    .op-eq-a { fill: #EA580C; }
    .op-eq-b { fill: #2563EB; }
    .op-eq-t { fill: #334155; font-size: 22px; font-weight: 800; text-anchor: middle; }
    @keyframes op-muncul {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes op-jadi-a {
      from { fill: #334155; }
      to { fill: #EA580C; }
    }
    @keyframes op-jadi-b {
      from { fill: #334155; }
      to { fill: #2563EB; }
    }
    @keyframes op-kedut {
      0%, 100% { transform: scale(1) rotate(0); }
      35% { transform: scale(1.3) rotate(-6deg); }
      65% { transform: scale(1.15) rotate(5deg); }
    }
    @media (prefers-reduced-motion: reduce){
      [class*="op-"] { animation: none !important; }
      .op-pny { fill: #EA580C; }
      .op-pbl { fill: #2563EB; }
    }
  </style>

  <rect width="360" height="250" fill="#FFFFFF"/>

  <!-- 2/9 -->
  <g class="op-f1">
    <text x="105" y="62" class="op-frac-t op-grp op-pbl">2</text>
    <line x1="83" y1="70" x2="127" y2="70" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <text x="105" y="106" class="op-frac-t op-grp op-pny">9</text>
  </g>

  <text x="180" y="92" class="op-dan">dan</text>

  <!-- 4/9 -->
  <g class="op-f2">
    <text x="255" y="62" class="op-frac-t op-grp op-pbl">4</text>
    <line x1="233" y1="70" x2="277" y2="70" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <text x="255" y="106" class="op-frac-t op-grp op-pny">9</text>
  </g>

  <text x="180" y="138" class="op-lbl op-lbl-a">Penyebut = ukuran potongan</text>
  <text x="180" y="156" class="op-lbl op-lbl-b">Pembilang = banyak potongan</text>

  <!-- Hasil -->
  <g class="op-total">
    <rect x="40" y="166" width="280" height="78" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="180" y="184" class="op-cap">pembilang dijumlah, penyebut tetap</text>

    <text x="110" y="208" class="op-eq op-eq-b">2</text>
    <line x1="97" y1="214" x2="123" y2="214" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <text x="110" y="234" class="op-eq op-eq-a">9</text>

    <text x="145" y="221" class="op-eq-t">+</text>

    <text x="180" y="208" class="op-eq op-eq-b">4</text>
    <line x1="167" y1="214" x2="193" y2="214" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <text x="180" y="234" class="op-eq op-eq-a">9</text>

    <text x="215" y="221" class="op-eq-t">=</text>

    <text x="250" y="208" class="op-eq op-eq-b">6</text>
    <line x1="237" y1="214" x2="263" y2="214" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <text x="250" y="234" class="op-eq op-eq-a">9</text>
  </g>
</svg>
