<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 204" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sd-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes sd-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes sd-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes sd-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes sd-tampak { from{opacity:0} to{opacity:1} }
@keyframes sd-hilang { to{opacity:0} }
@keyframes sd-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes sd-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="sd-"] { animation:none !important; } }
</style>
<rect width="360" height="204" fill="#FFFFFF"/>
<text class="" x="180" y="18" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#64748B;">data kelas 6A: jalan 7, sepeda 5, motor 6, angkot 2</text><g style="animation:sd-muncul 0.4s ease-out 0.4s both;"><rect x="14" y="30" width="332" height="38" rx="11" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/><g class="sd-pop" style="animation:sd-zoom .45s ease-out 0.9s both, sd-kedut .5s ease-in-out 1.4s 1;"><circle cx="42" cy="49" r="13" fill="#16A34A"/><path d="M34 51 l6 6 l11 -13" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><text class="" x="64" y="54" text-anchor="start" style="font-size:12px;font-weight:700;fill:#334155;">Paling banyak siswa jalan kaki.</text></g><g style="animation:sd-muncul 0.4s ease-out 1.4s both;"><rect x="14" y="76" width="332" height="38" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/><g class="sd-pop" style="animation:sd-zoom .45s ease-out 1.9s both, sd-kedut .5s ease-in-out 2.4s 1;"><circle cx="42" cy="95" r="13" fill="#DC2626"/><path d="M36 89 l12 12 M48 89 l-12 12" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></g><text class="" x="64" y="100" text-anchor="start" style="font-size:12px;font-weight:700;fill:#334155;">Selisih motor dan sepeda adalah 2 siswa.</text></g><g style="animation:sd-muncul 0.4s ease-out 2.4s both;"><rect x="14" y="122" width="332" height="38" rx="11" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/><g class="sd-pop" style="animation:sd-zoom .45s ease-out 2.9s both, sd-kedut .5s ease-in-out 3.4s 1;"><circle cx="42" cy="141" r="13" fill="#16A34A"/><path d="M34 143 l6 6 l11 -13" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><text class="" x="64" y="146" text-anchor="start" style="font-size:12px;font-weight:700;fill:#334155;">Urutan: jalan kaki, motor, sepeda, angkot.</text></g><text class="" x="180" y="190" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#EA580C;animation:sd-muncul 0.4s ease-out 3.4s both;">cek setiap pernyataan satu per satu ke datanya</text>
</svg>