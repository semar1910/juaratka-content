<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="360" height="230" fill="#FFFFFF"/>
<style>
@keyframes pdp-kedut{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.3) rotate(-6deg)}65%{transform:scale(1.15) rotate(5deg)}}
@keyframes pdp-zoom{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes pdp-muncul{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pdp-kosong{fill:#E2E8F0}
.pdp-isi{fill:#0D9488}
.pdp-t{font-size:15px;font-weight:700;fill:#334155;text-anchor:middle}
.pdp-p{font-size:18px;font-weight:700;fill:#334155}
.pdp-n{font-size:11px;fill:#64748B}
.pdp-o{fill:#EA580C}
.pdp-bl{font-size:12px;font-weight:700;fill:#2563EB;text-anchor:middle}
.pdp-a{animation:pdp-muncul .4s ease-out .5s both}
.pdp-b{animation:pdp-muncul .4s ease-out 2s both}
.pdp-c{animation:pdp-muncul .4s ease-out 3s both}
.pdp-d{animation:pdp-zoom .5s ease-out 4s both,pdp-kedut .6s ease-in-out 4.6s 1;transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){ [class*="pdp-"] { animation:none !important; } }
</style>
<defs>
<rect id="pdp-k" width="14" height="14" rx="2"/>
<g id="pdp-r"><use href="#pdp-k"/><use href="#pdp-k" x="16"/><use href="#pdp-k" x="32"/><use href="#pdp-k" x="48"/><use href="#pdp-k" x="64"/><use href="#pdp-k" x="80"/><use href="#pdp-k" x="96"/><use href="#pdp-k" x="112"/><use href="#pdp-k" x="128"/><use href="#pdp-k" x="144"/></g>
<g id="pdp-s"><use href="#pdp-k"/><use href="#pdp-k" x="16"/><use href="#pdp-k" x="32"/><use href="#pdp-k" x="48"/><use href="#pdp-k" x="64"/></g>
<marker id="pdp-ah" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748B"/></marker>
<marker id="pdp-ab" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563EB"/></marker>
</defs>
<text x="180" y="24" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Persen menjadi pecahan</text>
<g transform="translate(12,40)">
<g class="pdp-kosong"><use href="#pdp-r"/><use href="#pdp-r" y="16"/><use href="#pdp-r" y="32"/><use href="#pdp-r" y="48"/><use href="#pdp-r" y="64"/><use href="#pdp-r" y="80"/><use href="#pdp-r" y="96"/><use href="#pdp-r" y="112"/><use href="#pdp-r" y="128"/><use href="#pdp-r" y="144"/></g>
<g class="pdp-isi pdp-a"><use href="#pdp-r"/><use href="#pdp-r" y="16"/><use href="#pdp-r" y="32"/><use href="#pdp-r" y="48"/><use href="#pdp-r" y="64"/><use href="#pdp-s" y="80"/></g>
</g>
<text class="pdp-n pdp-a" x="91" y="218" text-anchor="middle">55 dari 100 kotak</text>
<text class="pdp-p pdp-a" x="180" y="118">55%</text>
<g class="pdp-b">
<line x1="226" y1="112" x2="243" y2="112" stroke="#64748B" stroke-width="1.5" marker-end="url(#pdp-ah)"/>
<text class="pdp-t" x="262" y="108">55</text>
<line x1="247" y1="114" x2="277" y2="114" stroke="#334155" stroke-width="2"/>
<text class="pdp-t" x="262" y="131">100</text>
</g>
<g class="pdp-c">
<path d="M262 92Q297 74 332 92" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#pdp-ab)"/>
<text class="pdp-bl" x="297" y="70">÷ 5</text>
<path d="M262 142Q297 160 332 142" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#pdp-ab)"/>
<text class="pdp-bl" x="297" y="172">÷ 5</text>
<text class="pdp-n" x="180" y="200">55 ÷ 5 = 11 dan 100 ÷ 5 = 20</text>
</g>
<g class="pdp-d">
<text class="pdp-t pdp-o" x="332" y="108">11</text>
<line x1="321" y1="114" x2="343" y2="114" stroke="#EA580C" stroke-width="2"/>
<text class="pdp-t pdp-o" x="332" y="131">20</text>
</g>
</svg>
