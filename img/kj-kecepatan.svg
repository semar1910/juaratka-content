<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.kj-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes kj-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes kj-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes kj-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes kj-tampak { from{opacity:0} to{opacity:1} }
@keyframes kj-hilang { to{opacity:0} }
@keyframes kj-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes kj-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="kj-"] { animation:none !important; } }
</style>
<rect width="360" height="228" fill="#FFFFFF"/>
<rect x="30" y="54" width="300" height="26" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text class="" x="180" y="42" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;">84 km dalam 3 jam</text><line x1="130" y1="48" x2="130" y2="86" stroke="#334155" stroke-width="2.5" style="--p:38;stroke-dasharray:38;animation:kj-garis .4s linear 1.1s both"/><line x1="230" y1="48" x2="230" y2="86" stroke="#334155" stroke-width="2.5" style="--p:38;stroke-dasharray:38;animation:kj-garis .4s linear 1.6s both"/><text class="" x="80" y="72" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#166534;animation:kj-muncul 0.4s ease-out 2.0s both;">28 km</text><text class="" x="80" y="104" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#64748B;animation:kj-muncul 0.4s ease-out 2.0s both;">jam ke-1</text><text class="" x="180" y="72" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#166534;animation:kj-muncul 0.4s ease-out 2.25s both;">28 km</text><text class="" x="180" y="104" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#64748B;animation:kj-muncul 0.4s ease-out 2.25s both;">jam ke-2</text><text class="" x="280" y="72" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#166534;animation:kj-muncul 0.4s ease-out 2.5s both;">28 km</text><text class="" x="280" y="104" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#64748B;animation:kj-muncul 0.4s ease-out 2.5s both;">jam ke-3</text><text class="" x="180" y="140" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#64748B;animation:kj-muncul 0.4s ease-out 3s both;">jarak dibagi rata ke tiap jam</text><text class="" x="180" y="166" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#334155;animation:kj-muncul 0.4s ease-out 3.5s both;">84 ÷ 3 = 28 km/jam</text><g class="kj-pop" style="animation:kj-zoom .45s ease-out 4.1s both, kj-kedut .5s ease-in-out 4.6s 1;"><rect x="40" y="180" width="280" height="36" rx="12" fill="#F0FDF4" stroke="#16A34A"/><text class="" x="180" y="204" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#16A34A;">kecepatan = jarak ÷ waktu</text></g>
</svg>