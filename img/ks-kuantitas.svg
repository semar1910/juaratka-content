="#92400E" stroke-width=".7"/><text x="80" y="130" style="font-size:13px;font-weight:700;fill:#64748B">1 gross</text><text x="80" y="154" class="ks-pop" style="font-size:17px;font-weight:800;fill:#EA580C;animation:ks-kedut .5s ease-in-out 2.0s 1;">= 144</text></g><g class="ks-pop" style="animation:ks-zoom 0.4s ease-out 2.0999999999999996s both;"><rect x="186" y="100" width="156" height="72" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/><rect x="200" y="114" width="34" height="5" fill="#FFFFFF" stroke="#64748B"/><rect x="200" y="118" width="34" height="5" fill="#FFFFFF" stroke="#64748B"/><rect x="200" y="122" width="34" height="5" fill="#FFFFFF" stroke="#64748B"/><rect x="200" y="126" width="34" height="5" fill="#FFFFFF" stroke="#64748B"/><rect x="200" y="130" width="34" height="5" fill="#FFFFFF" stroke="#64748B"/><text x="248" y="130" style="font-size:13px;font-weight:700;fill:#64748B">1 rim kertas</text><text x="248" y="154" class="ks-pop" style="font-size:17px;font-weight:800;fill:#EA580C;animation:ks-kedut .5s ease-in-out 2.5999999999999996s 1;">= 500 lbr</text></g><text x="180" y="200" class="ks-ket" style="animation:ks-muncul 0.4s ease-out 3s both;">ini hafalan, bukan tangga</text>
