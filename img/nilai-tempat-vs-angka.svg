<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.nt-sel { fill:none; stroke:#CBD5E1; stroke-width:1.5; }
.nt-dig { font-size:30px; font-weight:800; fill:#334155; text-anchor:middle; }
.nt-lbl { font-size:10px; font-weight:600; fill:#64748B; text-anchor:middle; }
.nt-ket { font-size:12px; font-weight:600; fill:#64748B; }
.nt-pop { transform-box:fill-box; transform-origin:50% 50%; }
.nt-o { fill:#EA580C; } .nt-b { fill:#2563EB; }
@keyframes nt-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.35) rotate(-6deg)} 65%{transform:scale(1.2) rotate(5deg)} }
@keyframes nt-zoom { 0%{opacity:0;transform:scale(.6)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes nt-muncul { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
@media (prefers-reduced-motion: reduce){ [class*="nt-"] { animation:none !important; opacity:1 !important; } }

.nt-kol-a { fill:#FED7AA; }
.nt-ka { animation:nt-kedut .55s ease-in-out .4s 2; }
.nt-c1 { opacity:0; animation:nt-muncul .45s ease-out 1.4s forwards; }
.nt-c2 { opacity:0; animation:nt-muncul .45s ease-out 2.4s forwards; }
.nt-cj { font-size:13px; font-weight:600; fill:#475569; }
.nt-cv { font-size:15px; font-weight:800; }
</style>
<rect width="360" height="200" fill="#FFFFFF"/>

<rect class="nt-kol-a" x="30" y="14" width="50" height="94" rx="6"/>
<rect class="nt-sel" x="30" y="24" width="50" height="50"/><rect class="nt-sel" x="80" y="24" width="50" height="50"/><rect class="nt-sel" x="130" y="24" width="50" height="50"/><rect class="nt-sel" x="180" y="24" width="50" height="50"/><rect class="nt-sel" x="230" y="24" width="50" height="50"/><rect class="nt-sel" x="280" y="24" width="50" height="50"/><line x1="180" y1="20" x2="180" y2="78" stroke="#94A3B8" stroke-width="3"/>
<text class="nt-dig nt-pop nt-o nt-ka" x="55.0" y="60">3</text><text class="nt-dig nt-pop " x="105.0" y="60">0</text><text class="nt-dig nt-pop " x="155.0" y="60">0</text><text class="nt-dig nt-pop " x="205.0" y="60">0</text><text class="nt-dig nt-pop " x="255.0" y="60">0</text><text class="nt-dig nt-pop " x="305.0" y="60">0</text>
<text class="nt-lbl" x="55.0" y="92" ><tspan x="55.0">ratus</tspan><tspan x="55.0" dy="12">ribuan</tspan></text><text class="nt-lbl" x="105.0" y="92" ><tspan x="105.0">puluh</tspan><tspan x="105.0" dy="12">ribuan</tspan></text><text class="nt-lbl" x="155.0" y="98" >ribuan</text><text class="nt-lbl" x="205.0" y="98" >ratusan</text><text class="nt-lbl" x="255.0" y="98" >puluhan</text><text class="nt-lbl" x="305.0" y="98" >satuan</text>
<g class="nt-c1">
  <path d="M55 118 V140 H70" fill="none" stroke="#EA580C" stroke-width="2"/>
  <text class="nt-cj" x="76" y="145">Nilai tempat</text>
  <text class="nt-cv nt-o" x="330" y="145" text-anchor="end">ratus ribuan</text>
</g>
<g class="nt-c2">
  <path d="M55 140 V176 H70" fill="none" stroke="#EA580C" stroke-width="2"/>
  <text class="nt-cj" x="76" y="181">Nilai angka</text>
  <text class="nt-cv nt-o" x="330" y="181" text-anchor="end">300.000</text>
</g>

</svg>