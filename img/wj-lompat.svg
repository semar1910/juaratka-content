<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 212" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.wj-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes wj-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes wj-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes wj-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes wj-tampak { from{opacity:0} to{opacity:1} }
@keyframes wj-hilang { to{opacity:0} }
@keyframes wj-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes wj-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="wj-"] { animation:none !important; } }
</style>
<rect width="360" height="212" fill="#FFFFFF"/>
<line x1="20" y1="110" x2="340" y2="110" stroke="#CBD5E1" stroke-width="3"/><circle cx="30" cy="110" r="6" fill="#334155"/><text class="" x="30" y="134" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#334155;">07.55</text><circle cx="80" cy="110" r="6" fill="#334155"/><text class="" x="80" y="134" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#334155;">08.00</text><circle cx="280" cy="110" r="6" fill="#334155"/><text class="" x="280" y="134" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#334155;">10.00</text><circle cx="330" cy="110" r="6" fill="#334155"/><text class="" x="330" y="134" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#334155;">10.05</text><path d="M30 110 Q55.0 62.0 80 110" fill="none" stroke="#EA580C" stroke-width="3" style="--p:70;stroke-dasharray:70;animation:wj-garis .6s ease-out 0.5s both"/><text class="wj-pop" x="55.0" y="78.0" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#EA580C;animation:wj-zoom .45s ease-out 1.0s both, wj-kedut .5s ease-in-out 1.5s 1;">5 menit</text><path d="M80 110 Q180.0 -2.0 280 110" fill="none" stroke="#2563EB" stroke-width="3" style="--p:280;stroke-dasharray:280;animation:wj-garis .6s ease-out 1.5s both"/><text class="wj-pop" x="180.0" y="46.0" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#2563EB;animation:wj-zoom .45s ease-out 2.0s both, wj-kedut .5s ease-in-out 2.5s 1;">2 jam</text><path d="M280 110 Q305.0 62.0 330 110" fill="none" stroke="#EA580C" stroke-width="3" style="--p:70;stroke-dasharray:70;animation:wj-garis .6s ease-out 2.5s both"/><text class="wj-pop" x="305.0" y="78.0" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#EA580C;animation:wj-zoom .45s ease-out 3.0s both, wj-kedut .5s ease-in-out 3.5s 1;">5 menit</text><text class="" x="180" y="172" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#334155;animation:wj-muncul 0.4s ease-out 3.4s both;">5 menit + 2 jam + 5 menit</text><text class="wj-pop" x="180" y="198" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#16A34A;animation:wj-zoom .45s ease-out 4s both, wj-kedut .5s ease-in-out 4.5s 1;">= 2 jam 10 menit</text>
</svg>