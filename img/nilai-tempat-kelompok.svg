<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.nt-sel { fill:none; stroke:#CBD5E1; stroke-width:1.5; }
.nt-dig { font-size:30px; font-weight:800; fill:#334155; text-anchor:middle; }
.nt-lbl { font-size:10px; font-weight:600; fill:#64748B; text-anchor:middle; }
.nt-ket { font-size:12px; font-weight:600; fill:#64748B; }
.nt-pop { transform-box:fill-box; transform-origin:50% 50%; }
.nt-o { fill:#EA580C; } .nt-b { fill:#2563EB; }
@keyframes nt-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.35) rotate(-6deg)} 65%{transform:scale(1.2) rotate(5deg)} }
@keyframes nt-zoom { 0%{opacity:0;transform:scale(.6)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes nt-muncul { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
@media (prefers-reduced-motion: reduce){ [class*="nt-"] { animation:none !important; opacity:1 !important; } }

.nt-big { font-size:48px; font-weight:800; }
.nt-g1 { opacity:0; animation:nt-muncul .45s ease-out .4s forwards; }
.nt-g2 { opacity:0; animation:nt-muncul .45s ease-out 1.6s forwards; }
.nt-g3 { opacity:0; animation:nt-muncul .45s ease-out 2.8s forwards; }
.nt-rb { transform-box:fill-box; transform-origin:50% 50%; animation:nt-kedut .55s ease-in-out 1.1s 2; }
.nt-bc { font-size:14px; font-weight:700; text-anchor:middle; }
</style>
<rect width="360" height="200" fill="#FFFFFF"/>

<text class="nt-big nt-o" x="168" y="78" text-anchor="end">300</text>
<text class="nt-big" x="180" y="78" text-anchor="middle" fill="#334155">.</text>
<text class="nt-big nt-b" x="192" y="78">300</text>
<g class="nt-g1">
  <path d="M74 92 v8 h92 v-8" fill="none" stroke="#EA580C" stroke-width="2.5"/>
  <text class="nt-bc nt-o" x="120" y="122">tiga ratus</text>
</g>
<text class="nt-bc nt-g1" x="180" y="122" fill="#334155"><tspan class="nt-rb">ribu</tspan></text>
<g class="nt-g2">
  <path d="M194 92 v8 h92 v-8" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <text class="nt-bc nt-b" x="240" y="122">tiga ratus</text>
</g>
<g class="nt-g3">
  <rect x="30" y="146" width="300" height="40" rx="10" fill="#F1F5F9"/>
  <text x="180" y="171" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:#334155">tiga ratus ribu tiga ratus</text>
</g>

</svg>