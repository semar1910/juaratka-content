155;">Jum</text><rect class="" x="68.0" y="94.0" width="36" height="70.0" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" style=""/><rect class="" x="122.4" y="52.0" width="36" height="112.0" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" style=""/><rect class="" x="285.6" y="38.0" width="36" height="126.0" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" style=""/><rect class="" x="231.2" y="80.0" width="36" height="84.0" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5" style=""/><rect class="" x="176.8" y="122.0" width="36" height="42.0" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5" style=""/><rect class="md-salin" x="176.8" y="122.0" width="36" height="42.0" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="4 2"/><rect x="231.2" y="122.0" width="36" height="42.0" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5" style="animation:md-tampak 0.3s ease-out 2.2s both;"/><text class="" x="249.2" y="72.0" text-anchor="middle" style="font-size:11.5px;font-weight:800;fill:#16A34A;animation:md-muncul 0.4s ease-out 2.8s both;">sama tinggi!</text><text class="" x="180" y="200" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#334155;animation:md-muncul 0.4s ease-out 3.2s both;">Rabu 15 digandakan: 15 + 15 = 30</text><text class="" x="180" y="222" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#16A34A;animation:md-muncul 0.4s ease-out 3.8s both;">Kamis (30) = 2 kali lipat Rabu ✓</text>
