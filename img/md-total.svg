<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 214" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.md-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes md-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes md-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes md-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes md-tampak { from{opacity:0} to{opacity:1} }
@keyframes md-hilang { to{opacity:0} }
@keyframes md-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes md-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="md-"] { animation:none !important; } }
.md-t0 { animation: md-t0 1s ease-in-out 0.6s both; }
@keyframes md-t0 { from{transform:translate(0,0)} to{transform:translate(268.0px,0.0px)} }
.md-t1 { animation: md-t1 1s ease-in-out 1.1s both; }
@keyframes md-t1 { from{transform:translate(0,0)} to{transform:translate(218.0px,-30.0px)} }
.md-t2 { animation: md-t2 1s ease-in-out 1.6s both; }
@keyframes md-t2 { from{transform:translate(0,0)} to{transform:translate(168.0px,-78.0px)} }
.md-t3 { animation: md-t3 1s ease-in-out 2.1s both; }
@keyframes md-t3 { from{transform:translate(0,0)} to{transform:translate(118.0px,-96.0px)} }
.md-t4 { animation: md-t4 1s ease-in-out 2.6s both; }
@keyframes md-t4 { from{transform:translate(0,0)} to{transform:translate(68.0px,-132.0px)} }
</style>
<rect width="360" height="214" fill="#FFFFFF"/>
<g class="md-t0"><rect x="24" y="160.0" width="30" height="30.0" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5"/><text class="" x="39" y="179.0" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#334155;">25</text></g><text class="" x="39" y="206" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#64748B;">Sen</text><g class="md-t1"><rect x="74" y="142.0" width="30" height="48.0" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/><text class="" x="89" y="170.0" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#334155;">40</text></g><text class="" x="89" y="206" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#64748B;">Sel</text><g class="md-t2"><rect x="124" y="172.0" width="30" height="18.0" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5"/><text class="" x="139" y="185.0" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#334155;">15</text></g><text class="" x="139" y="206" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#64748B;">Rab</text><g class="md-t3"><rect x="174" y="154.0" width="30" height="36.0" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1.5"/><text class="" x="189" y="176.0" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#334155;">30</text></g><text class="" x="189" y="206" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#64748B;">Kam</text><g class="md-t4"><rect x="224" y="136.0" width="30" height="54.0" fill="#FDE68A" stroke="#CA8A04" stroke-width="1.5"/><text class="" x="239" y="167.0" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#334155;">45</text></g><text class="" x="239" y="206" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#64748B;">Jum</text><text class="md-pop" x="307" y="-4.0" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#EA580C;animation:md-zoom .45s ease-out 3.4s both, md-kedut .5s ease-in-out 3.9s 2;">155</text><text class="" x="150" y="30" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#334155;animation:md-muncul 0.4s ease-out 0.3s both;">tumpuk semua batang</text><text class="" x="150" y="50" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#64748B;animation:md-muncul 0.4s ease-out 3.2s both;">25 + 40 + 15 + 30 + 45</text><text class="" x="150" y="70" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#EA580C;animation:md-muncul 0.4s ease-out 3.6s both;">= 155 kg</text>
</svg>