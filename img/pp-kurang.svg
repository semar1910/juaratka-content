<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.pp-pop { transform-box:fill-box; transform-origin:50% 50%; }
.pp-dig { font-size:30px; font-weight:800; fill:#334155; text-anchor:middle; }
.pp-ket { font-size:13px; font-weight:600; fill:#64748B; text-anchor:middle; }
.pp-koin-t { font-size:8.5px; font-weight:700; fill:#475569; text-anchor:middle; }
.pp-o { fill:#EA580C; } .pp-b { fill:#2563EB; } .pp-r { fill:#DC2626; }
@keyframes pp-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes pp-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes pp-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes pp-lebur { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(.3)} }
@keyframes pp-redup { to{opacity:.18} }
@keyframes pp-coret { from{stroke-dashoffset:40} to{stroke-dashoffset:0} }
.pp-h { opacity:0; }
@media (prefers-reduced-motion: reduce){ [class*="pp-"] { animation:none !important; } .pp-h { opacity:1 !important; } .pp-hilang { opacity:0 !important; } }

.pp-tanya { animation:pp-kedut .6s ease-in-out .6s 3; }
.pp-kurang { animation:pp-muncul .45s ease-out 2.4s both; }
</style>
<rect width="360" height="210" fill="#FFFFFF"/>
