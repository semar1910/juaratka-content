/text><circle cx="213" cy="148" r="13" fill="none" stroke="#EA580C" stroke-width="2" stroke-dasharray="4 3"/><text class="pp-koin-t" x="213" y="151" style="fill:#EA580C">100</text><text x="300" y="112" class="pp-dig pp-o pp-pop pp-tanya" style="font-size:54px">?</text><g class="pp-kurang"><text x="180" y="196" class="pp-ket" style="fill:#DC2626;font-weight:700">Koinnya cuma 2, padahal perlu 7!</text></g>
