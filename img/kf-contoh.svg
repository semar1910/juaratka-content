<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.kf-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes kf-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes kf-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes kf-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes kf-tampak { from{opacity:0} to{opacity:1} }
@keyframes kf-hilang { to{opacity:0} }
@keyframes kf-garis { from{stroke-dashoffset:200} to{stroke-dashoffset:0} }
@media (prefers-reduced-motion: reduce){ [class*="kf-"] { animation:none !important; } }
#tahap1 > *, #tahap2 > *, #tahap3 > * { animation:kf-muncul .4s ease-out both; }
</style>
<rect width="360" height="280" fill="#FFFFFF"/>
<rect x="30" y="8" width="130" height="32" rx="10" fill="#FFF7ED" stroke="#EA580C"/><text x="95" y="29" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#EA580C;">28 buku</text><rect x="200" y="8" width="130" height="32" rx="10" fill="#EFF6FF" stroke="#2563EB"/><text x="265" y="29" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#2563EB;">42 pensil</text><g id="tahap1"><rect x="60" y="48" width="240" height="28" rx="14" fill="#F0FDF4" stroke="#16A34A"/><text x="180" y="67" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#166534;">sebanyak-banyaknya → FPB</text></g><g id="tahap2"><text x="95" y="102" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#EA580C;">28 = 2 × 2 × 7</text><text x="265" y="102" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#2563EB;">42 = 2 × 3 × 7</text></g><g id="tahap3"><g><g transform="translate(40 108) scale(.78)"><circle cx="130" cy="92" r="72" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5" fill-opacity=".8"/><circle cx="230" cy="92" r="72" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5" fill-opacity=".6"/><text x="84" y="30" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#EA580C;">28</text><text x="276" y="30" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#2563EB;">42</text><path d="M180 40.2 A72 72 0 0 1 180 143.8 A72 72 0 0 1 180 40.2 Z" fill="#BBF7D0" style="animation:kf-tampak 0.4s ease-out 0s both;"/><text x="100" y="90" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#334155;animation:kf-muncul 0.4s ease-out 0.0s both;">2</text><text x="180" y="76" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#166534;animation:kf-muncul 0.4s ease-out 0.6s both;">2</text><text x="180" y="104" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#166534;animation:kf-muncul 0.4s ease-out 0.8s both;">7</text><text x="260" y="90" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#334155;animation:kf-muncul 0.4s ease-out 1.0s both;">3</text></g></g><rect x="96" y="240" width="168" height="30" rx="10" fill="#F0FDF4" stroke="#16A34A"/><text x="180" y="261" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#166534;">FPB = 2 × 7 = <tspan fill="#EA580C">?</tspan></text></g>
</svg>