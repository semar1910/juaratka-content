<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 232" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sd-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes sd-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes sd-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes sd-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes sd-tampak { from{opacity:0} to{opacity:1} }
@keyframes sd-hilang { to{opacity:0} }
@keyframes sd-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes sd-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="sd-"] { animation:none !important; } }
</style>
<rect width="360" height="232" fill="#FFFFFF"/>
<g class="sd-pop" style="animation:sd-zoom .45s ease-out 0.3s both, sd-kedut .5s ease-in-out 0.8s 2;"><rect x="220" y="10" width="126" height="30" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><g style=""><circle cx="239" cy="18" r="5" fill="#334155"/><path d="M232 37 v-8 q0 -6 7 -6 q7 0 7 6 v8 z" fill="#334155"/></g><text class="" x="292" y="30" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#EA580C;">= 2 siswa</text></g><text class="" x="14" y="69" text-anchor="start" style="font-size:11.5px;font-weight:800;fill:#EA580C;">jalan kaki (7)</text><g style="animation:sd-zoom 0.3s ease-out 1.0s both;"><circle cx="129" cy="57" r="5" fill="#EA580C"/><path d="M122 76 v-8 q0 -6 7 -6 q7 0 7 6 v8 z" fill="#EA580C"/></g><g style="animation:sd-zoom 0.3s ease-out 1.12s both;"><circle cx="153" cy="57" r="5" fill="#EA580C"/><path d="M146 76 v-8 q0 -6 7 -6 q7 0 7 6 v8 z" fill="#EA580C"/></g><g style="animation:sd-zoom 0.3s ease-out 1.2400000000000002s both;"><circle cx="177" cy="57" r="5" fill="#EA580C"/><path d="M170 76 v-8 q0 -6 7 -6 q7 0 7 6 v8 z" fill="#EA580C"/></g><g style="animation:sd-zoom 0.3s ease-out 1.3600000000000003s both;"><defs><clipPath id="sd-c0"><rect x="191" y="51" width="10" height="27"/></clipPath></defs><g clip-path="url(#sd-c0)"><circle cx="201" cy="57" r="5" fill="#EA580C"/><path d="M194 76 v-8 q0 -6 7 -6 q7 0 7 6 v8 z" fill="#EA580C"/></g><path d="M201 52 v24" stroke="#EA580C" stroke-dasharray="2 2"/></g><text class="" x="300" y="69" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#64748B;animation:sd-muncul 0.4s ease-out 1.4800000000000004s both;">7 ÷ 2 = 3,5</text><text class="" x="14" y="103" text-anchor="start" style="font-size:11.5px;font-weight:800;fill:#2563EB;">sepeda (5)</text><g style="animation:sd-zoom 0.3s ease-out 1.4800000000000004s both;"><circle cx="129" cy="91" r="5" fill="#2563EB"/><path d="M122 110 v-8 q0 -6 7 -6 q7 0 7 6 v8 z" fill="#2563EB"/></g><g style="animation:sd-zoom 0.3s ease-out 1.6000000000000005s both;"><circle cx="153" cy="91" r="5" fill="#2563EB"/><path d="M146 110 v-8 q0 -6 7 -6 q7 0 7 6 v8 z" fill="#2563EB"/></g><g style="animation:sd-zoom 0.3s ease-out 1.7200000000000006s both;"><defs><clipPath id="sd-c1"><rect x="167" y="85" width="10" height="27"/></clipPath></defs><g clip-path="url(#sd-c1)"><circle cx="177" cy="91" r="5" fill="#2563EB"/><path d="M170 110 v-8 q0 -6 7 -6 q7 0 7 6 v8 z" fill="#2563EB"/></g><path d="M177 86 v24" stroke="#2563EB" stroke-dasharray="2 2"/></g><text class="" x="300" y="103" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#64748B;animation:sd-muncul 0.4s ease-out 1.8400000000000007s both;">5 ÷ 2 = 2,5</text><text class="" x="14" y="137" text-anchor="start" style="font-size:11.5px;font-weight:800;fill:#16A34A;">motor (6)</text><g style="animation:sd-zoom 0.3s ease-out 1.8400000000000007s both;"><circle cx="129" cy="125" r="5" fill="#16A34A"/><path d="M122 144 v-8 q0 -6 7 -6 q7 0 7 6 v8 z" fill="#16A34A"/></g><g style="animation:sd-zoom 0.3s ease-out 1.9600000000000009s both;"><circle cx="153" cy="125" r="5" fill="#16A34A"/><path d="M146 144 v-8 q0 -6 7 -6 q7 0 7 6 v8 z" fill="#16A34A"/></g><g style="animation:sd-zoom 0.3s ease-out 2.080000000000001s both;"><circle cx="177" cy="125" r="5" fill="#16A34A"/><path d="M170 144 v-8 q0 -6 7 -6 q7 0 7 6 v8 z" fill="#16A34A"/></g><text class="" x="300" y="137" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#64748B;animation:sd-muncul 0.4s ease-out 2.200000000000001s both;">6 ÷ 2 = 3</text><text class="" x="14" y="171" text-anchor="start" style="font-size:11.5px;font-weight:800;fill:#7C3AED;">angkot (2)</text><g style="animation:sd-zoom 0.3s ease-out 2.200000000000001s both;"><circle cx="129" cy="159" r="5" fill="#7C3AED"/><path d="M122 178 v-8 q0 -6 7 -6 q7 0 7 6 v8 z" fill="#7C3AED"/></g><text class="" x="300" y="171" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#64748B;animation:sd-muncul 0.4s ease-out 2.320000000000001s both;">2 ÷ 2 = 1</text><text class="" x="180" y="200" text-anchor="middle" style="font-size:13.5px;font-weight:800;fill:#EA580C;animation:sd-muncul 0.4s ease-out 2.720000000000001s both;">banyak ikon = jumlah ÷ nilai 1 ikon</text><text class="" x="180" y="220" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#64748B;animation:sd-muncul 0.4s ease-out 3.120000000000001s both;">sisa setengah → gambar setengah ikon</text>
</svg>