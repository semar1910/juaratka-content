<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.kj-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes kj-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes kj-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes kj-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes kj-tampak { from{opacity:0} to{opacity:1} }
@keyframes kj-hilang { to{opacity:0} }
@keyframes kj-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes kj-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="kj-"] { animation:none !important; } }
</style>
<rect width="360" height="228" fill="#FFFFFF"/>
<rect x="30" y="54" width="300" height="26" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="2"/><text class="" x="180" y="42" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;">jarak 126 km</text><rect class="kj-pop" x="32" y="56" width="96" height="22" rx="4" fill="#93C5FD" style="animation:kj-zoom 0.4s ease-out 0.6s both;"/><text class="" x="80" y="72" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#1E3A8A;animation:kj-muncul 0.4s ease-out 0.8s both;">42 km</text><text class="" x="80" y="104" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#2563EB;animation:kj-muncul 0.4s ease-out 0.9s both;">1 jam</text><rect class="kj-pop" x="132" y="56" width="96" height="22" rx="4" fill="#2563EB" style="animation:kj-zoom 0.4s ease-out 1.5s both;"/><text class="" x="180" y="72" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#fff;animation:kj-muncul 0.4s ease-out 1.7000000000000002s both;">42 km</text><text class="" x="180" y="104" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#2563EB;animation:kj-muncul 0.4s ease-out 1.8s both;">2 jam</text><rect class="kj-pop" x="232" y="56" width="96" height="22" rx="4" fill="#93C5FD" style="animation:kj-zoom 0.4s ease-out 2.4s both;"/><text class="" x="280" y="72" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#1E3A8A;animation:kj-muncul 0.4s ease-out 2.6s both;">42 km</text><text class="" x="280" y="104" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#2563EB;animation:kj-muncul 0.4s ease-out 2.7s both;">3 jam</text><text class="" x="180" y="140" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#64748B;animation:kj-muncul 0.4s ease-out 3.4s both;">berapa blok 42 km yang muat?</text><text class="" x="180" y="166" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#334155;animation:kj-muncul 0.4s ease-out 3.8s both;">126 ÷ 42 = 3 jam</text><g class="kj-pop" style="animation:kj-zoom .45s ease-out 4.4s both, kj-kedut .5s ease-in-out 4.9s 1;"><rect x="40" y="180" width="280" height="36" rx="12" fill="#EFF6FF" stroke="#2563EB"/><text class="" x="180" y="204" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#2563EB;">waktu = jarak ÷ kecepatan</text></g>
</svg>