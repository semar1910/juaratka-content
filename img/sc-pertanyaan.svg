<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 238" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sc-pop { transform-box:fill-box; transform-origin:50% 50%; }
.sc-teks { font-family:ui-monospace, 'Roboto Mono', 'Droid Sans Mono', 'DejaVu Sans Mono', 'Courier New', monospace; font-size:13px; fill:#334155; white-space:pre; }
.sc-sorot { transform-box:fill-box; transform-origin:0 50%; }
@keyframes sc-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes sc-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes sc-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes sc-stabilo { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@keyframes sc-garis { from{stroke-dashoffset:300} to{stroke-dashoffset:0} }
@keyframes sc-alir { from{stroke-dashoffset:24} to{stroke-dashoffset:0} }
@keyframes sc-redup { to{opacity:.35} }
@media (prefers-reduced-motion: reduce){ [class*="sc-"] { animation:none !important; } }
</style>
<rect width="360" height="238" fill="#FFFFFF"/>
<rect x="10" y="10" width="340" height="136" rx="12" fill="#FFFDF5" stroke="#E2E8F0" stroke-width="1.5"/><rect class="sc-sorot" x="20.0" y="106" width="292.6" height="19" rx="4" fill="#FED7AA" style="animation:sc-stabilo .45s ease-out 0.6s both;"/><text class="sc-teks" x="22" y="36">Untuk acara kelas, Bu Rina membeli 7</text><text class="sc-teks" x="22" y="57">dus donat. Tiap dus berisi 12 donat.</text><text class="sc-teks" x="22" y="78">Harga satu dus Rp38.000. Ternyata 6</text><text class="sc-teks" x="22" y="99">donat jatuh dan tidak bisa dimakan.</text><text class="sc-teks" x="22" y="120">Berapa donat yang masih bisa dimakan?</text><g class="sc-pop" style="animation:sc-zoom .45s ease-out 1.4s both, sc-kedut .5s ease-in-out 1.9s 1;"><rect x="20" y="158" width="320" height="46" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="36" y="176" style="font-size:10.5px;font-weight:700;fill:#EA580C">YANG DITANYA</text><text x="36" y="195" style="font-size:13px;font-weight:800;fill:#334155">Berapa donat yang masih bisa dimakan?</text></g><text x="180" y="226" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#64748B;animation:sc-muncul 0.4s ease-out 2.4s both;">Baca kalimat tanyanya duluan!</text>
</svg>