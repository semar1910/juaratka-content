<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .op-head { font-size: 12px; font-weight: 700; fill: #64748B; }
    .op-hl { font-size: 11px; font-weight: 700; }
    .op-r1 { animation: op-muncul .4s ease-out .3s both; }
    .op-r2 { animation: op-muncul .4s ease-out .9s both; }
    .op-r3 { animation: op-muncul .4s ease-out 1.5s both; }
    .op-p1 { animation: op-muncul .3s ease-out .9s both; }
    .op-p2 { animation: op-muncul .3s ease-out 1.5s both; }
    .op-box1 { animation: op-muncul .4s ease-out 2.3s both; }
    .op-grp { transform-box: fill-box; transform-origin: 50% 50%; }
    .op-kd1 { animation: op-kedut .3s ease-in-out 2.7s 3; }
    .op-box2 { animation: op-muncul .4s ease-out 3.7s both; }
    .op-kd2 { animation: op-kedut .3s ease-in-out 4.1s 3; }
    .op-hasil { animation: op-muncul .4s ease-out 5.0s both; }
    .op-n { font-size: 15px; font-weight: 800; text-anchor: middle; }
    .op-n2 { font-size: 18px; font-weight: 800; text-anchor: middle; }
    .op-c-a { fill: #EA580C; }
    .op-c-b { fill: #2563EB; }
    .op-c-t { fill: #334155; }
    .op-sym { font-size: 18px; font-weight: 800; fill: #334155; text-anchor: middle; }
    .op-sym-k { font-size: 14px; font-weight: 800; fill: #334155; text-anchor: middle; }
    @keyframes op-muncul { from { opacity: 0; } to { opacity: 1; } }
    @keyframes op-kedut {
      0%, 100% { transform: scale(1) rotate(0); }
      35% { transform: scale(1.15) rotate(-3deg); }
      65% { transform: scale(1.08) rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce){ [class*="op-"] { animation: none !important; } }
  </style>

  <rect width="360" height="260" fill="#FFFFFF"/>

  <text x="30" y="26" class="op-head">3 hiasan, tiap hiasan 2/7 meter</text>

  <g class="op-r1">
    <text x="30" y="58" class="op-hl op-c-a">Hiasan 1</text>
    <rect x="90" y="40" width="210" height="28" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <rect x="90" y="40" width="60" height="28" fill="#FDBA74" stroke="#EA580C" stroke-width="2"/>
    <line x1="120" y1="40" x2="120" y2="68" stroke="#EA580C" stroke-width="1.5"/><line x1="150" y1="40" x2="150" y2="68" stroke="#EA580C" stroke-width="1.5"/><line x1="180" y1="40" x2="180" y2="68" stroke="#EA580C" stroke-width="1.5"/><line x1="210" y1="40" x2="210" y2="68" stroke="#EA580C" stroke-width="1.5"/><line x1="240" y1="40" x2="240" y2="68" stroke="#EA580C" stroke-width="1.5"/><line x1="270" y1="40" x2="270" y2="68" stroke="#EA580C" stroke-width="1.5"/>
  </g>
  <text x="195" y="78" class="op-sym-k op-p1">+</text>
  <g class="op-r2">
    <text x="30" y="98" class="op-hl op-c-b">Hiasan 2</text>
    <rect x="90" y="80" width="210" height="28" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <rect x="90" y="80" width="60" height="28" fill="#93C5FD" stroke="#2563EB" stroke-width="2"/>
    <line x1="120" y1="80" x2="120" y2="108" stroke="#2563EB" stroke-width="1.5"/><line x1="150" y1="80" x2="150" y2="108" stroke="#2563EB" stroke-width="1.5"/><line x1="180" y1="80" x2="180" y2="108" stroke="#2563EB" stroke-width="1.5"/><line x1="210" y1="80" x2="210" y2="108" stroke="#2563EB" stroke-width="1.5"/><line x1="240" y1="80" x2="240" y2="108" stroke="#2563EB" stroke-width="1.5"/><line x1="270" y1="80" x2="270" y2="108" stroke="#2563EB" stroke-width="1.5"/>
  </g>
  <text x="195" y="118" class="op-sym-k op-p2">+</text>
  <g class="op-r3">
    <text x="30" y="138" class="op-hl op-c-a">Hiasan 3</text>
    <rect x="90" y="120" width="210" height="28" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <rect x="90" y="120" width="60" height="28" fill="#FDBA74" stroke="#EA580C" stroke-width="2"/>
    <line x1="120" y1="120" x2="120" y2="148" stroke="#EA580C" stroke-width="1.5"/><line x1="150" y1="120" x2="150" y2="148" stroke="#EA580C" stroke-width="1.5"/><line x1="180" y1="120" x2="180" y2="148" stroke="#EA580C" stroke-width="1.5"/><line x1="210" y1="120" x2="210" y2="148" stroke="#EA580C" stroke-width="1.5"/><line x1="240" y1="120" x2="240" y2="148" stroke="#EA580C" stroke-width="1.5"/><line x1="270" y1="120" x2="270" y2="148" stroke="#EA580C" stroke-width="1.5"/>
  </g>

  <!-- 2/7 + 2/7 + 2/7 -->
  <g class="op-box1">
    <rect x="40" y="158" width="280" height="44" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <g class="op-grp op-kd1">
      <text x="110" y="178" class="op-n op-c-a">2</text><line x1="102" y1="183" x2="118" y2="183" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="110" y="196" class="op-n op-c-t">7</text>
      <text x="145" y="192" class="op-sym">+</text>
      <text x="180" y="178" class="op-n op-c-b">2</text><line x1="172" y1="183" x2="188" y2="183" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="180" y="196" class="op-n op-c-t">7</text>
      <text x="215" y="192" class="op-sym">+</text>
      <text x="250" y="178" class="op-n op-c-a">2</text><line x1="242" y1="183" x2="258" y2="183" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="250" y="196" class="op-n op-c-t">7</text>
    </g>
  </g>

  <!-- 2/7 × 3 = 6/7 -->
  <g class="op-box2">
    <rect x="40" y="208" width="280" height="48" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="115" y="227" class="op-n2 op-c-t">2</text><line x1="106" y1="232" x2="124" y2="232" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><text x="115" y="249" class="op-n2 op-c-t">7</text>
    <g class="op-grp op-kd2">
      <text x="150" y="245" class="op-sym">×</text>
      <text x="178" y="245" class="op-sym op-c-b">3</text>
    </g>
    <text x="212" y="245" class="op-sym op-hasil">=</text>
    <g class="op-hasil">
      <text x="255" y="227" class="op-n2 op-c-t">6</text><line x1="246" y1="232" x2="264" y2="232" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><text x="255" y="249" class="op-n2 op-c-t">7</text>
    </g>
  </g>
</svg>
