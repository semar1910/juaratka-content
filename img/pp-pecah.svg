<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 205" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.pp-pop { transform-box:fill-box; transform-origin:50% 50%; }
.pp-dig { font-size:30px; font-weight:800; fill:#334155; text-anchor:middle; }
.pp-ket { font-size:13px; font-weight:600; fill:#64748B; text-anchor:middle; }
.pp-koin-t { font-size:8.5px; font-weight:700; fill:#475569; text-anchor:middle; }
.pp-o { fill:#EA580C; } .pp-b { fill:#2563EB; } .pp-r { fill:#DC2626; }
@keyframes pp-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes pp-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes pp-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes pp-lebur { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(.3)} }
@keyframes pp-redup { to{opacity:.18} }
@keyframes pp-coret { from{stroke-dashoffset:40} to{stroke-dashoffset:0} }
.pp-h { opacity:0; }
@media (prefers-reduced-motion: reduce){ [class*="pp-"] { animation:none !important; } .pp-h { opacity:1 !important; } .pp-hilang { opacity:0 !important; } }

.pp-lbr { animation:pp-kedut .5s ease-in-out .4s 2, pp-lebur .5s ease-in 1.4s forwards; }
.pp-baru { animation:pp-zoom .4s ease-out both; }
.pp-bayar { animation:pp-redup .5s ease-out 3.6s forwards; }
.pp-cap1 { animation:pp-muncul .4s ease-out 2.6s both; }
.pp-cap2 { animation:pp-muncul .4s ease-out 4.2s both; }
</style>
<rect width="360" height="205" fill="#FFFFFF"/>
<g class="pp-pop pp-lbr" style=""><rect x="137" y="16" width="86" height="42" rx="5" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5"/><rect x="142" y="21" width="76" height="32" rx="3" fill="none" stroke="#16A34A" stroke-dasharray="3 2"/><text x="148" y="35" style="font-size:9px;font-weight:700;fill:#166534">Rp</text><text x="148" y="48" style="font-size:11px;font-weight:700;fill:#166534">1.000</text><circle cx="205" cy="37.0" r="8" fill="#DCFCE7" stroke="#16A34A"/></g><g class="pp-bayar"><g class="pp-pop pp-baru" style="animation-delay:1.80s"><circle cx="40" cy="88" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="40" y="91">100</text></g></g><g class="pp-bayar"><g class="pp-pop pp-baru" style="animation-delay:1.87s"><circle cx="96" cy="88" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="96" y="91">100</text></g></g><g class="pp-bayar"><g class="pp-pop pp-baru" style="animation-delay:1.94s"><circle cx="152" cy="88" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="152" y="91">100</text></g></g><g class="pp-bayar"><g class="pp-pop pp-baru" style="animation-delay:2.01s"><circle cx="208" cy="88" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="208" y="91">100</text></g></g><g class="pp-bayar"><g class="pp-pop pp-baru" style="animation-delay:2.08s"><circle cx="264" cy="88" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="264" y="91">100</text></g></g><g class="pp-bayar"><g class="pp-pop pp-baru" style="animation-delay:2.15s"><circle cx="320" cy="88" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="320" y="91">100</text></g></g><g class="pp-bayar"><g class="pp-pop pp-baru" style="animation-delay:2.22s"><circle cx="40" cy="124" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="40" y="127">100</text></g></g><g class="pp-pop pp-baru" style="animation-delay:2.29s"><circle cx="96" cy="124" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="96" y="127">100</text></g><g class="pp-pop pp-baru" style="animation-delay:2.36s"><circle cx="152" cy="124" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="152" y="127">100</text></g><g class="pp-pop pp-baru" style="animation-delay:2.43s"><circle cx="208" cy="124" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="208" y="127">100</text></g><g class="pp-pop " style=""><circle cx="264" cy="124" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="264" y="127">100</text></g><g class="pp-pop " style=""><circle cx="320" cy="124" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="320" y="127">100</text></g><text x="180" y="166" class="pp-ket pp-cap1" style="font-size:13px">1 lembar dipecah → 10 koin, sekarang 12 koin</text><text x="180" y="190" class="pp-ket pp-cap2" style="fill:#EA580C;font-weight:700">bayar 7, sisa 5 koin</text>
</svg>