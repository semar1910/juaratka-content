<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .op-grp { transform-box: fill-box; transform-origin: 50% 50%; }
    .op-lbl { font-size: 12px; font-weight: 700; }
    .op-lbl-g { fill: #64748B; animation: op-muncul .4s ease-out 0s both; }
    .op-base { animation: op-muncul .4s ease-out 0s both; }
    .op-fill { animation: op-muncul .3s ease-out both; }
    .op-fr9 { animation: op-muncul .3s ease-out 1.2s both, op-kedut .3s ease-in-out 1.5s 3; }
    .op-fr { font-size: 14px; font-weight: 800; fill: #EA580C; text-anchor: middle; }
    .op-v1 { animation: op-hilang .3s ease-out 2.6s both; }
    .op-v2 { animation: op-hilang .3s ease-out 2.9s both; }
    .op-v3 { animation: op-hilang .3s ease-out 3.2s both; }
    .op-brk1 { animation: op-muncul .3s ease-out 2.9s both; }
    .op-brk2 { animation: op-muncul .3s ease-out 3.2s both; }
    .op-brk3 { animation: op-muncul .3s ease-out 3.5s both; }
    .op-jadi { font-size: 11px; font-weight: 700; fill: #64748B; text-anchor: middle; }
    .op-box { animation: op-muncul .4s ease-out 4.2s both; }
    .op-cap { font-size: 12px; font-weight: 700; fill: #334155; text-anchor: middle; }
    .op-hasil { animation: op-muncul .4s ease-out 4.2s both, op-kedut .3s ease-in-out 4.7s 3; }
    .op-n { font-size: 20px; font-weight: 800; text-anchor: middle; }
    .op-c-a { fill: #EA580C; }
    .op-c-t { fill: #334155; }
    .op-sym { font-size: 20px; font-weight: 800; fill: #334155; text-anchor: middle; }
    @keyframes op-muncul {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes op-hilang {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    @keyframes op-kedut {
      0%, 100% { transform: scale(1) rotate(0); }
      35% { transform: scale(1.12) rotate(-3deg); }
      65% { transform: scale(1.06) rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce){ [class*="op-"] { animation: none !important; } }
  </style>

  <rect width="360" height="260" fill="#FFFFFF"/>

  <!-- Label -->
  <text x="30" y="42" class="op-lbl op-lbl-g">6 dari 9 potong diambil</text>

  <!-- Pecahan 6/9 -->
  <g class="op-grp op-fr9">
    <text x="310" y="26" class="op-fr">6</text>
    <line x1="302" y1="31" x2="318" y2="31" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <text x="310" y="47" class="op-fr">9</text>
  </g>

  <!-- Pita: 9 potong sama besar -->
  <rect class="op-base" x="30" y="54" width="300" height="44" fill="#FFF7ED"/>

  <!-- 6 potong diwarnai satu per satu -->
  <rect class="op-fill" style="animation-delay:.5s" x="30"     y="54" width="33.4" height="44" fill="#FDBA74"/>
  <rect class="op-fill" style="animation-delay:.6s" x="63.33"  y="54" width="33.4" height="44" fill="#FDBA74"/>
  <rect class="op-fill" style="animation-delay:.7s" x="96.67"  y="54" width="33.4" height="44" fill="#FDBA74"/>
  <rect class="op-fill" style="animation-delay:.8s" x="130"    y="54" width="33.4" height="44" fill="#FDBA74"/>
  <rect class="op-fill" style="animation-delay:.9s" x="163.33" y="54" width="33.4" height="44" fill="#FDBA74"/>
  <rect class="op-fill" style="animation-delay:1s"  x="196.67" y="54" width="33.4" height="44" fill="#FDBA74"/>

  <!-- Garis potong kecil (akan dihapus per kelompok 3) -->
  <g class="op-v1">
    <line x1="63.33" y1="54" x2="63.33" y2="98" stroke="#EA580C" stroke-width="1.5"/>
    <line x1="96.67" y1="54" x2="96.67" y2="98" stroke="#EA580C" stroke-width="1.5"/>
  </g>
  <g class="op-v2">
    <line x1="163.33" y1="54" x2="163.33" y2="98" stroke="#EA580C" stroke-width="1.5"/>
    <line x1="196.67" y1="54" x2="196.67" y2="98" stroke="#EA580C" stroke-width="1.5"/>
  </g>
  <g class="op-v3">
    <line x1="263.33" y1="54" x2="263.33" y2="98" stroke="#FDBA74" stroke-width="1.5"/>
    <line x1="296.67" y1="54" x2="296.67" y2="98" stroke="#FDBA74" stroke-width="1.5"/>
  </g>

  <!-- Garis potong besar (tetap) dan bingkai -->
  <line x1="130" y1="54" x2="130" y2="98" stroke="#EA580C" stroke-width="2"/>
  <line x1="230" y1="54" x2="230" y2="98" stroke="#EA580C" stroke-width="2"/>
  <rect x="30" y="54" width="300" height="44" fill="none" stroke="#EA580C" stroke-width="2"/>

  <!-- 3 potong kecil jadi 1 potong besar -->
  <g class="op-brk1">
    <path d="M33 104 v6 h94 v-6" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="128" class="op-jadi">3 jadi 1</text>
  </g>
  <g class="op-brk2">
    <path d="M133 104 v6 h94 v-6" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="128" class="op-jadi">3 jadi 1</text>
  </g>
  <g class="op-brk3">
    <path d="M233 104 v6 h94 v-6" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="280" y="128" class="op-jadi">3 jadi 1</text>
  </g>

  <!-- Hasil: 6/9 = 2/3 -->
  <g class="op-box">
    <rect x="40" y="146" width="280" height="108" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="180" y="172" class="op-cap">Nilainya sama, tapi lebih sederhana</text>

    <text x="135" y="206" class="op-n op-c-t">6</text>
    <line x1="123" y1="212" x2="147" y2="212" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <text x="135" y="236" class="op-n op-c-t">9</text>

    <text x="180" y="219" class="op-sym">=</text>
  </g>
  <g class="op-grp op-hasil">
    <text x="225" y="206" class="op-n op-c-a">2</text>
    <line x1="213" y1="212" x2="237" y2="212" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <text x="225" y="236" class="op-n op-c-a">3</text>
  </g>
</svg>
