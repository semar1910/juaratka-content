<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 212" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sc-pop { transform-box:fill-box; transform-origin:50% 50%; }
.sc-teks { font-family:ui-monospace, 'Roboto Mono', 'Droid Sans Mono', 'DejaVu Sans Mono', 'Courier New', monospace; font-size:13px; fill:#334155; white-space:pre; }
.sc-sorot { transform-box:fill-box; transform-origin:0 50%; }
@keyframes sc-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes sc-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes sc-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes sc-stabilo { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@keyframes sc-garis { from{stroke-dashoffset:300} to{stroke-dashoffset:0} }
@keyframes sc-alir { from{stroke-dashoffset:24} to{stroke-dashoffset:0} }
@keyframes sc-redup { to{opacity:.35} }
@media (prefers-reduced-motion: reduce){ [class*="sc-"] { animation:none !important; } }
#tahap1 .sc-sorot, #tahap2 .sc-sorot { animation:sc-stabilo .45s ease-out both; }
#tahap2 line { stroke-dasharray:300; animation:sc-garis .6s ease-out .4s both; }
#tahap3 > * { animation:sc-muncul .4s ease-out both; }
</style>
<rect width="360" height="212" fill="#FFFFFF"/>
<rect x="10" y="10" width="340" height="136" rx="12" fill="#FFFDF5" stroke="#E2E8F0" stroke-width="1.5"/><g id="tahap1"><rect class="sc-sorot" x="20.0" y="106" width="245.8" height="19" rx="4" fill="#FED7AA" style="animation:sc-stabilo .45s ease-out 0s both;"/></g><g id="tahap2"><rect class="sc-sorot" x="152.6" y="22" width="66.4" height="19" rx="4" fill="#BFDBFE" style="animation:sc-stabilo .45s ease-out 0s both;"/><rect class="sc-sorot" x="183.8" y="43" width="43.0" height="19" rx="4" fill="#BFDBFE" style="animation:sc-stabilo .45s ease-out 0s both;"/><rect class="sc-sorot" x="246.2" y="64" width="43.0" height="19" rx="4" fill="#BFDBFE" style="animation:sc-stabilo .45s ease-out 0s both;"/><line x1="65.8" y1="74" x2="165.4" y2="74" stroke="#64748B" stroke-width="2.5" style="stroke-dasharray:300;animation:sc-garis .6s ease-out 0s both;"/></g><g id="tahap3"><rect x="16" y="160" width="328" height="40" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="180" y="187" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#334155">7 × 16 = <tspan fill="#EA580C">□</tspan>  →  <tspan fill="#EA580C">□</tspan> − 14 = <tspan fill="#EA580C">?</tspan></text></g><text class="sc-teks" x="22" y="36">Pak Dedi memanen 7 karung kentang.</text><text class="sc-teks" x="22" y="57">Tiap karung beratnya 16 kg. Pak Dedi</text><text class="sc-teks" x="22" y="78">punya 3 orang anak. Sebanyak 14 kg</text><text class="sc-teks" x="22" y="99">kentang dijual ke tetangga.</text><text class="sc-teks" x="22" y="120">Berapa kg kentang yang tersisa?</text>
</svg>