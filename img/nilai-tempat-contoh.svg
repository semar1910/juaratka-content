<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 215" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.nt-sel { fill:none; stroke:#CBD5E1; stroke-width:1.5; }
.nt-dig { font-size:30px; font-weight:800; fill:#334155; text-anchor:middle; }
.nt-lbl { font-size:10px; font-weight:600; fill:#64748B; text-anchor:middle; }
.nt-ket { font-size:12px; font-weight:600; fill:#64748B; }
.nt-pop { transform-box:fill-box; transform-origin:50% 50%; }
.nt-o { fill:#EA580C; } .nt-b { fill:#2563EB; }
@keyframes nt-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.35) rotate(-6deg)} 65%{transform:scale(1.2) rotate(5deg)} }
@keyframes nt-zoom { 0%{opacity:0;transform:scale(.6)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes nt-muncul { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
@media (prefers-reduced-motion: reduce){ [class*="nt-"] { animation:none !important; opacity:1 !important; } }

.nt-kol-c { fill:#FED7AA; transform-box:fill-box; transform-origin:50% 50%; animation:nt-zoom .6s ease-out .2s both; }
.nt-kc { animation:nt-kedut .55s ease-in-out .8s 2; }
#tahap1 .nt-dig { animation:nt-muncul .4s ease-out both; }
.nt-tanya { font-size:20px; font-weight:800; fill:#334155; text-anchor:middle; }
</style>
