<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="360" height="220" fill="#FFFFFF"/>
<style>
@keyframes pdp-kedut{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.3) rotate(-6deg)}65%{transform:scale(1.15) rotate(5deg)}}
@keyframes pdp-zoom{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes pdp-muncul{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pdp-hilang{to{opacity:0}}
@keyframes pdp-warna{from{fill:#E2E8F0}to{fill:#EA580C}}
@keyframes pdp-teks{from{fill:#334155}to{fill:#FFFFFF}}
.pdp-j{font-size:13px;font-weight:700;fill:#334155;text-anchor:middle}
.pdp-blok{fill:#E2E8F0}
.pdp-lb{font-size:11px;font-weight:600;fill:#334155;text-anchor:middle}
.pdp-n{font-size:11px;fill:#64748B;text-anchor:middle}
.pdp-r{font-size:16px;font-weight:700;fill:#334155;text-anchor:middle}
.pdp-u{animation:pdp-muncul .4s ease-out .5s both,pdp-hilang .3s ease-in 1.3s forwards}
.pdp-b{animation:pdp-zoom .5s ease-out 1.3s both;transform-box:fill-box;transform-origin:50% 50%}
.pdp-e{animation:pdp-muncul .4s ease-out 1.6s both}
.pdp-o{animation:pdp-warna .4s ease-out 2.3s both}
.pdp-lo{animation:pdp-teks .4s ease-out 2.3s both}
.pdp-c{animation:pdp-muncul .4s ease-out 2.3s both}
.pdp-d{animation:pdp-zoom .5s ease-out 3.5s both;transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){ [class*="pdp-"] { animation:none !important; } .pdp-u{display:none} }
</style>
<defs>
<rect id="pdp-k" width="60" height="34" rx="6"/>
</defs>
<text class="pdp-j" x="180" y="22">Diskon 30% dari Rp120.000</text>
<g class="pdp-u">
<rect x="22" y="58" width="316" height="74" rx="8" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/>
<text x="180" y="103" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">Rp120.000</text>
</g>
<g class="pdp-b">
<g class="pdp-blok">
<use href="#pdp-k" class="pdp-o" x="22" y="58"/><use href="#pdp-k" class="pdp-o" x="86" y="58"/><use href="#pdp-k" class="pdp-o" x="150" y="58"/><use href="#pdp-k" x="214" y="58"/><use href="#pdp-k" x="278" y="58"/>
<use href="#pdp-k" x="22" y="98"/><use href="#pdp-k" x="86" y="98"/><use href="#pdp-k" x="150" y="98"/><use href="#pdp-k" x="214" y="98"/><use href="#pdp-k" x="278" y="98"/>
</g>
<text class="pdp-lb pdp-lo" x="52" y="79">Rp12.000</text><text class="pdp-lb pdp-lo" x="116" y="79">Rp12.000</text><text class="pdp-lb pdp-lo" x="180" y="79">Rp12.000</text><text class="pdp-lb" x="244" y="79">Rp12.000</text><text class="pdp-lb" x="308" y="79">Rp12.000</text>
<text class="pdp-lb" x="52" y="119">Rp12.000</text><text class="pdp-lb" x="116" y="119">Rp12.000</text><text class="pdp-lb" x="180" y="119">Rp12.000</text><text class="pdp-lb" x="244" y="119">Rp12.000</text><text class="pdp-lb" x="308" y="119">Rp12.000</text>
</g>
<text class="pdp-n pdp-e" x="180" y="152">Rp120.000 ÷ 10 = Rp12.000 tiap blok</text>
<g class="pdp-c">
<path d="M22 54V50H210V54" fill="none" stroke="#EA580C" stroke-width="2" stroke-linejoin="round"/>
<text x="116" y="44" font-size="13" font-weight="700" fill="#EA580C" text-anchor="middle">3 × 10%</text>
</g>
<text class="pdp-r pdp-d" x="180" y="190">Rp12.000 × 3 = <tspan fill="#EA580C">Rp36.000</tspan></text>
</svg>
