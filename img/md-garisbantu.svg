155;">Jum</text><rect class="" x="68.0" y="94.0" width="36" height="70.0" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5" style=""/><rect class="" x="122.4" y="52.0" width="36" height="112.0" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5" style=""/><rect class="" x="176.8" y="122.0" width="36" height="42.0" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5" style=""/><rect class="" x="231.2" y="80.0" width="36" height="84.0" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5" style=""/><rect class="" x="285.6" y="38.0" width="36" height="126.0" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5" style=""/><line x1="122.4" y1="52.0" x2="56" y2="52.0" stroke="#EA580C" stroke-width="2" stroke-dasharray="4 3" style="animation:md-tampak 0.4s ease-out 0.5s both;"/><circle cx="56" cy="52.0" r="4" fill="#EA580C" style="animation:md-tampak 0.2s ease-out 0.8s both;"/><text class="md-pop" x="140.4" y="46.0" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C;animation:md-zoom .45s ease-out 0.9s both, md-kedut .5s ease-in-out 1.4s 1;">40</text><line x1="68.0" y1="94.0" x2="56" y2="94.0" stroke="#EA580C" stroke-width="2" stroke-dasharray="4 3" style="animation:md-tampak 0.4s ease-out 1.8s both;"/><circle cx="56" cy="94.0" r="4" fill="#EA580C" style="animation:md-tampak 0.2s ease-out 2.1s both;"/><text class="md-pop" x="86.0" y="88.0" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C;animation:md-zoom .45s ease-out 2.2s both, md-kedut .5s ease-in-out 2.7s 1;">25</text><line x1="176.8" y1="122.0" x2="56" y2="122.0" stroke="#EA580C" stroke-width="2" stroke-dasharray="4 3" style="animation:md-tampak 0.4s ease-out 3.1s both;"/><circle cx="56" cy="122.0" r="4" fill="#EA580C" style="animation:md-tampak 0.2s ease-out 3.4s both;"/><text class="md-pop" x="194.8" y="116.0" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C;animation:md-zoom .45s ease-out 3.5s both, md-kedut .5s ease-in-out 4.0s 1;">15</text><text class="" 