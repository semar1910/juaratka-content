<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.kj-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes kj-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes kj-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes kj-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes kj-tampak { from{opacity:0} to{opacity:1} }
@keyframes kj-hilang { to{opacity:0} }
@keyframes kj-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes kj-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="kj-"] { animation:none !important; } }
</style>
<rect width="360" height="210" fill="#FFFFFF"/>
<polygon points="62,20 10,106 114,106" fill="#F8FAFC" stroke="#334155" stroke-width="2"/><line x1="32" y1="68" x2="92" y2="68" stroke="#334155" stroke-width="2"/><line x1="62" y1="68" x2="62" y2="106" stroke="#334155" stroke-width="2"/><text class="" x="62" y="58" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#16A34A;">J</text><text class="" x="42" y="96" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#EA580C;">K</text><text class="" x="82" y="96" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#2563EB;">W</text><rect class="kj-pop" x="44" y="36" width="36" height="30" rx="6" fill="#334155" style="animation:kj-zoom 0.4s ease-out 0.5s both;"/><text class="" x="62.0" y="57" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#fff;animation:kj-muncul 0.4s ease-out 0.7s both;">?</text><text class="" x="62" y="138" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#64748B;animation:kj-muncul 0.4s ease-out 0.5s both;">cari J</text><text class="kj-pop" x="62" y="160" text-anchor="middle" style="font-size:13.5px;font-weight:800;fill:#16A34A;animation:kj-zoom .45s ease-out 1.0s both, kj-kedut .5s ease-in-out 1.5s 1;">J = K × W</text><polygon points="180,20 128,106 232,106" fill="#F8FAFC" stroke="#334155" stroke-width="2"/><line x1="150" y1="68" x2="210" y2="68" stroke="#334155" stroke-width="2"/><line x1="180" y1="68" x2="180" y2="106" stroke="#334155" stroke-width="2"/><text class="" x="180" y="58" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#16A34A;">J</text><text class="" x="160" y="96" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#EA580C;">K</text><text class="" x="200" y="96" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#2563EB;">W</text><rect class="kj-pop" x="144" y="74" width="34" height="30" rx="6" fill="#334155" style="animation:kj-zoom 0.4s ease-out 1.7s both;"/><text class="" x="161.0" y="95" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#fff;animation:kj-muncul 0.4s ease-out 1.9s both;">?</text><text class="" x="180" y="138" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#64748B;animation:kj-muncul 0.4s ease-out 1.7s both;">cari K</text><text class="kj-pop" x="180" y="160" text-anchor="middle" style="font-size:13.5px;font-weight:800;fill:#EA580C;animation:kj-zoom .45s ease-out 2.2s both, kj-kedut .5s ease-in-out 2.7s 1;">K = J ÷ W</text><polygon points="298,20 246,106 350,106" fill="#F8FAFC" stroke="#334155" stroke-width="2"/><line x1="268" y1="68" x2="328" y2="68" stroke="#334155" stroke-width="2"/><line x1="298" y1="68" x2="298" y2="106" stroke="#334155" stroke-width="2"/><text class="" x="298" y="58" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#16A34A;">J</text><text class="" x="278" y="96" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#EA580C;">K</text><text class="" x="318" y="96" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#2563EB;">W</text><rect class="kj-pop" x="300" y="74" width="34" height="30" rx="6" fill="#334155" style="animation:kj-zoom 0.4s ease-out 2.9s both;"/><text class="" x="317.0" y="95" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#fff;animation:kj-muncul 0.4s ease-out 3.1s both;">?</text><text class="" x="298" y="138" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#64748B;animation:kj-muncul 0.4s ease-out 2.9s both;">cari W</text><text class="kj-pop" x="298" y="160" text-anchor="middle" style="font-size:13.5px;font-weight:800;fill:#2563EB;animation:kj-zoom .45s ease-out 3.4s both, kj-kedut .5s ease-in-out 3.9s 1;">W = J ÷ K</text><text class="" x="180" y="196" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;animation:kj-muncul 0.4s ease-out 4.2s both;">tutup yang dicari, sisanya jadi rumus</text>
</svg>