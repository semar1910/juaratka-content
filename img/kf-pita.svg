6A34A" stroke-width="2.5"/><text x="180" y="140" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#16A34A;">potong 4 cm? ✓ pas di dua-duanya</text></g><text x="180" y="172" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#64748B;animation:kf-muncul 0.4s ease-out 4.2s both;">lebih dari 4 cm tidak ada yang pas di keduanya</text>
