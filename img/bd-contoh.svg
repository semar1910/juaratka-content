<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 285" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bd-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes bd-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes bd-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes bd-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes bd-tampak { from{opacity:0} to{opacity:1} }
@keyframes bd-redup { to{opacity:.12} }
@keyframes bd-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@media (prefers-reduced-motion: reduce){ [class*="bd-"] { animation:none !important; } }
#tahap1 > *, #tahap2 > *, #tahap3 > * { animation:bd-muncul .4s ease-out both; }
#tahap2 .bd-pop { animation:bd-zoom .45s ease-out both, bd-kedut .5s ease-in-out .5s 2; }
</style>
<rect width="360" height="285" fill="#FFFFFF"/>
<polygon points="60,24 196,24 196,92 281,92 281,177 60,177" fill="#F0FDF4" stroke="#334155" stroke-width="2.5"/><text class="" x="128" y="17" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;">8 m</text><text class="" x="170.5" y="195" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;">13 m</text><text class="" x="52" y="105.5" text-anchor="end" style="font-size:13px;font-weight:800;fill:#334155;">9 m</text><text class="" x="289" y="139.5" text-anchor="start" style="font-size:13px;font-weight:800;fill:#334155;">5 m</text><g id="tahap1"><rect x="80" y="207" width="200" height="28" rx="14" fill="#FFF7ED" stroke="#EA580C"/><text class="" x="180" y="226" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C;">dipagari → keliling</text></g><g id="tahap2"><text class="bd-pop" x="238.5" y="85" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C;">5 m</text><text class="bd-pop" x="204" y="63" text-anchor="start" style="font-size:13px;font-weight:800;fill:#EA580C;">4 m</text></g><g id="tahap3"><polygon points="60,24 196,24 196,92 281,92 281,177 60,177" fill="none" stroke="#EA580C" stroke-width="4"/><rect x="30" y="243" width="300" height="32" rx="10" fill="#FFF7ED" stroke="#EA580C"/><text class="" x="180" y="264" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#334155;">13 + 5 + 5 + 4 + 8 + 9 = <tspan fill="#EA580C">?</tspan></text></g>
</svg>