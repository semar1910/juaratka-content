<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 202" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sc-pop { transform-box:fill-box; transform-origin:50% 50%; }
.sc-teks { font-family:ui-monospace, 'Roboto Mono', 'Droid Sans Mono', 'DejaVu Sans Mono', 'Courier New', monospace; font-size:13px; fill:#334155; white-space:pre; }
.sc-sorot { transform-box:fill-box; transform-origin:0 50%; }
@keyframes sc-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes sc-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes sc-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes sc-stabilo { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@keyframes sc-garis { from{stroke-dashoffset:300} to{stroke-dashoffset:0} }
@keyframes sc-alir { from{stroke-dashoffset:24} to{stroke-dashoffset:0} }
@keyframes sc-redup { to{opacity:.35} }
@media (prefers-reduced-motion: reduce){ [class*="sc-"] { animation:none !important; } }
</style>
<rect width="360" height="202" fill="#FFFFFF"/>
<g style="animation:sc-muncul 0.4s ease-out 0.4s both;"><rect x="16" y="14" width="328" height="42" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/><g class="sc-pop" style="animation:sc-zoom .45s ease-out 0.8s both, sc-kedut .5s ease-in-out 1.3s 1;"><circle cx="43" cy="35" r="15" fill="#16A34A"/><path d="M34 37 l7 7 l13 -15" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="40" style="font-size:12.5px;font-weight:700;fill:#334155">78 &lt; 84 semula → masuk akal</text></g><g style="animation:sc-muncul 0.4s ease-out 1.4s both;"><rect x="16" y="66" width="328" height="42" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/><g class="sc-pop" style="animation:sc-zoom .45s ease-out 1.7999999999999998s both, sc-kedut .5s ease-in-out 2.3s 1;"><circle cx="43" cy="87" r="15" fill="#16A34A"/><path d="M34 89 l7 7 l13 -15" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="92" style="font-size:12.5px;font-weight:700;fill:#334155">Satuannya donat → sesuai yang ditanya</text></g><g style="animation:sc-muncul 0.4s ease-out 2.4s both;"><rect x="16" y="118" width="328" height="42" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/><g class="sc-pop" style="animation:sc-zoom .45s ease-out 2.8s both, sc-kedut .5s ease-in-out 3.3s 1;"><circle cx="43" cy="139" r="15" fill="#DC2626"/><path d="M36 132 l14 14 M50 132 l-14 14" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g><text x="68" y="144" style="font-size:12.5px;font-weight:700;fill:#334155">Dapat 90? Lebih dari 84 → pasti salah</text></g><text x="180" y="188" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C;animation:sc-muncul 0.4s ease-out 3.4s both;">Selalu periksa sebelum menjawab!</text>
</svg>