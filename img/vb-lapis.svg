<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 246" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.vb-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes vb-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes vb-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes vb-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes vb-jatuh { from{opacity:0;transform:translateY(-26px)} to{opacity:1;transform:none} }
@keyframes vb-tampak { from{opacity:0} to{opacity:1} }
@media (prefers-reduced-motion: reduce){ [class*="vb-"] { animation:none !important; } }
.vb-l1 { animation: vb-l1 1s ease-in-out 1s both; }
@keyframes vb-l1 { to { transform: translateY(-26px); } }
.vb-l2 { animation: vb-l2 1s ease-in-out 1s both; }
@keyframes vb-l2 { to { transform: translateY(-52px); } }
</style>
