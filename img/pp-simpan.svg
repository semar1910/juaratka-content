<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 206" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.pp-pop { transform-box:fill-box; transform-origin:50% 50%; }
.pp-dig { font-size:30px; font-weight:800; fill:#334155; text-anchor:middle; }
.pp-ket { font-size:13px; font-weight:600; fill:#64748B; text-anchor:middle; }
.pp-koin-t { font-size:8.5px; font-weight:700; fill:#475569; text-anchor:middle; }
.pp-o { fill:#EA580C; } .pp-b { fill:#2563EB; } .pp-r { fill:#DC2626; }
@keyframes pp-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes pp-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes pp-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes pp-lebur { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(.3)} }
@keyframes pp-redup { to{opacity:.18} }
@keyframes pp-coret { from{stroke-dashoffset:40} to{stroke-dashoffset:0} }
.pp-h { opacity:0; }
@media (prefers-reduced-motion: reduce){ [class*="pp-"] { animation:none !important; } .pp-h { opacity:1 !important; } .pp-hilang { opacity:0 !important; } }

.pp-s1 { animation:pp-muncul .4s ease-out .5s both; }
.pp-s2 { animation:pp-muncul .4s ease-out 1s both; }
.pp-bub { animation:pp-zoom .5s ease-out 1.6s both; }
.pp-s3 { animation:pp-muncul .4s ease-out 2.4s both; }
.pp-terbang { animation:pp-terbang .8s ease-in-out 2.9s both; }
@keyframes pp-terbang { 0%{opacity:0;transform:translate(50px,40px) scale(1.4)} 30%{opacity:1} 100%{opacity:1;transform:none} }
.pp-terbang-k { animation:pp-kedut .5s ease-in-out 3.8s 2; }
.pp-s4 { animation:pp-muncul .4s ease-out 4.8s both; }
</style>
<rect width="360" height="206" fill="#FFFFFF"/>
<rect x="106" y="14" width="48" height="162" rx="8" fill="#F1F5F9"/><rect x="156" y="14" width="48" height="162" rx="8" fill="#F8FAFC"/><rect x="206" y="14" width="48" height="162" rx="8" fill="#F1F5F9"/><rect x="256" y="14" width="48" height="162" rx="8" fill="#F8FAFC"/><text x="130" y="196" style="font-size:10px;font-weight:600;fill:#94A3B8" text-anchor="middle">ribuan</text><text x="180" y="196" style="font-size:10px;font-weight:600;fill:#94A3B8" text-anchor="middle">ratusan</text><text x="230" y="196" style="font-size:10px;font-weight:600;fill:#94A3B8" text-anchor="middle">puluhan</text><text x="280" y="196" style="font-size:10px;font-weight:600;fill:#94A3B8" text-anchor="middle">satuan</text><text x="130" y="40" class="pp-dig pp-o pp-terbang pp-pop" style="font-size:18px"><tspan class="pp-terbang-k">1</tspan></text><text class="pp-dig " x="180" y="76">4</text><text class="pp-dig " x="230" y="76">0</text><text class="pp-dig " x="280" y="76">0</text><text x="86" y="114" class="pp-dig">+</text><text class="pp-dig " x="180" y="114">8</text><text class="pp-dig " x="230" y="114">0</text><text class="pp-dig " x="280" y="114">0</text><line x1="96" y1="126" x2="310" y2="126" stroke="#334155" stroke-width="2.5"/><text class="pp-dig pp-s1" x="280" y="162">0</text><text class="pp-dig pp-s2" x="230" y="162">0</text><g class="pp-bub pp-pop"><rect x="4" y="54" width="72" height="30" rx="15" fill="#FFF7ED" stroke="#EA580C"/><text x="40" y="74" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C">4+8=12</text></g><text class="pp-dig pp-o pp-s3" x="180" y="162">2</text><text class="pp-dig pp-o pp-s4" x="130" y="162">1</text>
</svg>