<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.kb-pop { transform-box:fill-box; transform-origin:50% 50%; }
.kb-dig { font-size:28px; font-weight:800; fill:#334155; text-anchor:middle; }
.kb-sm { font-size:15px; font-weight:800; text-anchor:middle; }
.kb-ket { font-size:13px; font-weight:600; fill:#64748B; text-anchor:middle; }
.kb-o { fill:#EA580C; } .kb-b { fill:#2563EB; } .kb-g { fill:#CBD5E1; }
@keyframes kb-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes kb-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes kb-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes kb-turun { from{opacity:0;transform:translateY(-60px)} to{opacity:1;transform:none} }
@keyframes kb-garis { from{stroke-dashoffset:120} to{stroke-dashoffset:0} }
@keyframes kb-lebur { to{opacity:0;transform:scale(.3)} }
@keyframes kb-hilang { to{opacity:0} }
@media (prefers-reduced-motion: reduce){ [class*="kb-"] { animation:none !important; } }
</style>
<rect width="360" height="228" fill="#FFFFFF"/>
<path d="M212 48 q 12 20 0 40" fill="none" stroke="#334155" stroke-width="2.5"/><line x1="212" y1="48" x2="298" y2="48" stroke="#334155" stroke-width="2.5"/><text class="kb-dig" x="188" y="78" style="">4</text><text class="kb-dig" x="236" y="78" style="">9</text><text class="kb-dig" x="272" y="78" style="">2</text><g class="kb-pop" style="animation:kb-zoom .45s ease-out 0.5s both, kb-hilang .3s ease-in 2.9s forwards"><rect x="8" y="100" width="80" height="28" rx="14" fill="#FFF7ED" stroke="#EA580C"/><text x="48.0" y="119" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#EA580C">9 ÷ 4 = 2</text></g><text class="kb-dig kb-o kb-pop" x="236" y="40" style="animation:kb-zoom .45s ease-out 1s both, kb-kedut .5s ease-in-out 1.5s 1">2</text><g style="animation:kb-muncul 0.4s ease-out 1.9s both;"><text class="kb-dig" x="236" y="110" style="">8</text><text x="294" y="110" style="font-size:22px;font-weight:800;fill:#64748B">−</text><line x1="218" y1="118" x2="290" y2="118" stroke="#334155" stroke-width="2"/></g><text class="kb-dig" x="236" y="148" style="animation:kb-muncul 0.4s ease-out 2.5s both;">1</text><line x1="272" y1="84" x2="272" y2="128" stroke="#2563EB" stroke-width="2" style="stroke-dasharray:120;animation:kb-garis .6s ease-out 3.1s both;"/><text class="kb-dig kb-b kb-pop" x="272" y="148" style="animation:kb-turun .6s ease-out 3.4s both, kb-kedut .5s ease-in-out 4.1s 2">2</text><g class="kb-pop" style="animation:kb-zoom .45s ease-out 4.8s both"><rect x="8" y="134" width="86" height="28" rx="14" fill="#FFF7ED" stroke="#EA580C"/><text x="51.0" y="153" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#EA580C">12 ÷ 4 = 3</text></g><text class="kb-dig kb-o kb-pop" x="272" y="40" style="animation:kb-zoom .45s ease-out 5.4s both, kb-kedut .5s ease-in-out 5.9s 1">3</text><g style="animation:kb-muncul 0.4s ease-out 6.3s both;"><text class="kb-dig" x="236" y="180" style="">1</text><text class="kb-dig" x="272" y="180" style="">2</text><text x="294" y="180" style="font-size:22px;font-weight:800;fill:#64748B">−</text><line x1="218" y1="188" x2="290" y2="188" stroke="#334155" stroke-width="2"/><text class="kb-dig" x="272" y="216" style="">0</text></g>
</svg>