<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="360" height="250" fill="#FFFFFF"/>
<style>
@keyframes pdp-kedut{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.3) rotate(-6deg)}65%{transform:scale(1.15) rotate(5deg)}}
@keyframes pdp-zoom{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes pdp-muncul{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pdp-garis{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
.pdp-kosong{fill:#E2E8F0}
.pdp-isi{fill:#0D9488}
.pdp-lb{font-size:16px;font-weight:700;fill:#334155;text-anchor:middle}
.pdp-f{font-size:13px;font-weight:700;fill:#334155;text-anchor:middle}
.pdp-tl{font-size:12px;font-weight:700;fill:#0D9488}
.pdp-tf{font-size:12px;font-weight:700;fill:#0D9488;text-anchor:middle}
.pdp-n{font-size:11px;fill:#64748B;text-anchor:middle}
.pdp-w{font-size:22px;font-weight:700;fill:#334155;text-anchor:middle}
.pdp-t1{animation:pdp-muncul .4s ease-out .8s both}
.pdp-t2{animation:pdp-muncul .4s ease-out 2.2s both}
.pdp-t3{animation:pdp-muncul .4s ease-out 3.6s both}
.pdp-gr{fill:#FACC15;animation:pdp-garis .6s ease-out 4.8s both;transform-box:fill-box;transform-origin:0% 50%}
@media (prefers-reduced-motion: reduce){ [class*="pdp-"] { animation:none !important; } }
</style>
<defs>
<rect id="pdp-k" width="9" height="9" rx="1.5"/>
<g id="pdp-r"><use href="#pdp-k"/><use href="#pdp-k" x="10"/><use href="#pdp-k" x="20"/><use href="#pdp-k" x="30"/><use href="#pdp-k" x="40"/><use href="#pdp-k" x="50"/><use href="#pdp-k" x="60"/><use href="#pdp-k" x="70"/><use href="#pdp-k" x="80"/><use href="#pdp-k" x="90"/></g>
<g id="pdp-s8"><use href="#pdp-k"/><use href="#pdp-k" x="10"/><use href="#pdp-k" x="20"/><use href="#pdp-k" x="30"/><use href="#pdp-k" x="40"/><use href="#pdp-k" x="50"/><use href="#pdp-k" x="60"/><use href="#pdp-k" x="70"/></g>
<g id="pdp-s5"><use href="#pdp-k"/><use href="#pdp-k" x="10"/><use href="#pdp-k" x="20"/><use href="#pdp-k" x="30"/><use href="#pdp-k" x="40"/></g>
<g id="pdp-g"><use href="#pdp-r"/><use href="#pdp-r" y="10"/><use href="#pdp-r" y="20"/><use href="#pdp-r" y="30"/><use href="#pdp-r" y="40"/><use href="#pdp-r" y="50"/><use href="#pdp-r" y="60"/><use href="#pdp-r" y="70"/><use href="#pdp-r" y="80"/><use href="#pdp-r" y="90"/></g>
<g id="pdp-b8"><use href="#pdp-r" y="20"/><use href="#pdp-r" y="30"/><use href="#pdp-r" y="40"/><use href="#pdp-r" y="50"/><use href="#pdp-r" y="60"/><use href="#pdp-r" y="70"/><use href="#pdp-r" y="80"/><use href="#pdp-r" y="90"/></g>
</defs>
<text class="pdp-f" x="69.5" y="28">22</text>
<line x1="58" y1="31" x2="81" y2="31" stroke="#334155" stroke-width="1.5"/>
<text class="pdp-f" x="69.5" y="43">25</text>
<text class="pdp-lb" x="179.5" y="41">0,85</text>
<text class="pdp-lb" x="289.5" y="41">90%</text>
<g class="pdp-kosong"><use href="#pdp-g" x="20" y="56"/><use href="#pdp-g" x="130" y="56"/><use href="#pdp-g" x="240" y="56"/></g>
<text class="pdp-n" x="180" y="212">Urutkan dari yang terkecil:</text>
<text class="pdp-w" x="180" y="238"><tspan fill="#EA580C">?</tspan> &lt; <tspan fill="#EA580C">?</tspan> &lt; <tspan fill="#EA580C">?</tspan></text>
<g id="tahap1" class="pdp-t1">
<g class="pdp-isi" transform="translate(20,56)"><use href="#pdp-b8"/><use href="#pdp-s8" y="10"/></g>
<text class="pdp-tf" x="48" y="172">88</text>
<line x1="37" y1="175" x2="59" y2="175" stroke="#0D9488" stroke-width="1.5"/>
<text class="pdp-tf" x="48" y="186">100</text>
<text class="pdp-tl" x="65" y="180">= 88%</text>
</g>
<g id="tahap2" class="pdp-t2">
<g class="pdp-isi" transform="translate(130,56)"><use href="#pdp-b8"/><use href="#pdp-s5" y="10"/></g>
<text class="pdp-tf" x="179.5" y="180" style="font-size:14px">85%</text>
</g>
<g id="tahap3">
<g class="pdp-t3"><g class="pdp-isi" transform="translate(240,56)"><use href="#pdp-b8"/><use href="#pdp-r" y="10"/></g></g>
<rect class="pdp-gr" x="14" y="64.5" width="332" height="3" rx="1.5"/>
</g>
</svg>
