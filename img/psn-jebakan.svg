@keyframes psn-hilang { to{opacity:0} }
@keyframes psn-potong { from{stroke-dashoffset:40} to{stroke-dashoffset:0} }
@media (prefers-reduced-motion: reduce){ [class*="psn-"] { animation:none !important; } }
</style>
