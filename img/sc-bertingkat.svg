<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 252" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sc-pop { transform-box:fill-box; transform-origin:50% 50%; }
.sc-teks { font-family:ui-monospace, 'Roboto Mono', 'Droid Sans Mono', 'DejaVu Sans Mono', 'Courier New', monospace; font-size:13px; fill:#334155; white-space:pre; }
.sc-sorot { transform-box:fill-box; transform-origin:0 50%; }
@keyframes sc-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes sc-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes sc-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes sc-stabilo { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@keyframes sc-garis { from{stroke-dashoffset:300} to{stroke-dashoffset:0} }
@keyframes sc-alir { from{stroke-dashoffset:24} to{stroke-dashoffset:0} }
@keyframes sc-redup { to{opacity:.35} }
@media (prefers-reduced-motion: reduce){ [class*="sc-"] { animation:none !important; } }
</style>
<rect width="360" height="252" fill="#FFFFFF"/>
<text x="20" y="30" style="font-size:12px;font-weight:800;fill:#2563EB;animation:sc-muncul 0.4s ease-out 0.3s both;">Langkah 1 · semua donat</text><g class="sc-pop " style="animation:sc-zoom .45s ease-out 0.5s both, sc-kedut .5s ease-in-out 1.0s 1;"><rect x="60" y="40" width="240" height="46" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="180.0" y="70" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#334155">7 × 12 = <tspan fill="#EA580C">□</tspan></text></g><line x1="180" y1="92" x2="180" y2="128" stroke="#EA580C" stroke-width="3" stroke-dasharray="6 6" style="animation:sc-alir .6s linear 1.4s 4, sc-muncul .3s ease-out 1.4s both"/><path d="M172 126 l8 10 l8 -10" fill="none" stroke="#EA580C" stroke-width="3" style="animation:sc-muncul 0.4s ease-out 1.4s both;"/><text x="20" y="160" style="font-size:12px;font-weight:800;fill:#2563EB;animation:sc-muncul 0.4s ease-out 2s both;">Langkah 2 · yang masih bisa dimakan</text><g class="sc-pop " style="animation:sc-zoom .45s ease-out 2.2s both, sc-kedut .5s ease-in-out 2.7s 1;"><rect x="60" y="170" width="240" height="46" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="180.0" y="200" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#334155"><tspan fill="#EA580C">□</tspan> − 6 = <tspan fill="#EA580C">□</tspan></text></g><text x="180" y="240" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#64748B;animation:sc-muncul 0.4s ease-out 3.2s both;">hasil langkah 1 dipakai di langkah 2</text>
</svg>