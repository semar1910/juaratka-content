<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 216" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.kj-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes kj-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes kj-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes kj-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes kj-tampak { from{opacity:0} to{opacity:1} }
@keyframes kj-hilang { to{opacity:0} }
@keyframes kj-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes kj-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="kj-"] { animation:none !important; } }
.kj-jalan { animation: kj-jalan 5.2s linear .4s both; }
@keyframes kj-jalan { 0%{transform:translateX(0px)} 18%{transform:translateX(80px)} 25%{transform:translateX(80px)} 43%{transform:translateX(160px)} 50%{transform:translateX(160px)} 68%{transform:translateX(240px)} 75%{transform:translateX(240px)} 93%{transform:translateX(320px)} 100%{transform:translateX(320px)} }
</style>
<rect width="360" height="216" fill="#FFFFFF"/>
<line x1="20" y1="120" x2="340" y2="120" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round"/><line x1="20" y1="108" x2="20" y2="132" stroke="#334155" stroke-width="2"/><line x1="100" y1="108" x2="100" y2="132" stroke="#334155" stroke-width="2"/><line x1="180" y1="108" x2="180" y2="132" stroke="#334155" stroke-width="2"/><line x1="260" y1="108" x2="260" y2="132" stroke="#334155" stroke-width="2"/><line x1="340" y1="108" x2="340" y2="132" stroke="#334155" stroke-width="2"/><text class="" x="100" y="76" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#2563EB;animation:kj-muncul 0.4s ease-out 1.2359999999999998s both;">1 jam</text><text class="kj-pop" x="60.0" y="152" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#EA580C;animation:kj-zoom .45s ease-out 1.0359999999999998s both, kj-kedut .5s ease-in-out 1.5359999999999998s 1;">35 km</text><text class="" x="180" y="76" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#2563EB;animation:kj-muncul 0.4s ease-out 2.536s both;">2 jam</text><text class="kj-pop" x="140.0" y="152" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#EA580C;animation:kj-zoom .45s ease-out 2.3360000000000003s both, kj-kedut .5s ease-in-out 2.8360000000000003s 1;">35 km</text><text class="" x="260" y="76" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#2563EB;animation:kj-muncul 0.4s ease-out 3.8360000000000003s both;">3 jam</text><text class="kj-pop" x="220.0" y="152" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#EA580C;animation:kj-zoom .45s ease-out 3.6360000000000006s both, kj-kedut .5s ease-in-out 4.136000000000001s 1;">35 km</text><text class="" x="340" y="76" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#2563EB;animation:kj-muncul 0.4s ease-out 5.136000000000001s both;">4 jam</text><text class="kj-pop" x="300.0" y="152" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#EA580C;animation:kj-zoom .45s ease-out 4.936000000000001s both, kj-kedut .5s ease-in-out 5.436000000000001s 1;">35 km</text><g class="kj-jalan" style=""><rect x="6" y="100" width="28" height="10" rx="4" fill="#EA580C"/><rect x="16" y="90" width="10" height="11" rx="3" fill="#334155"/><circle cx="10" cy="112" r="5" fill="#334155"/><circle cx="30" cy="112" r="5" fill="#334155"/></g><text class="" x="20" y="176" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#64748B;">0</text><text class="" x="180" y="30" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#EA580C;">kecepatan 35 km/jam</text><text class="" x="180" y="202" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;animation:kj-muncul 0.4s ease-out 5.6s both;">artinya: tiap 1 jam maju 35 km</text>
