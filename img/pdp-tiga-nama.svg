.pdp-a,.pdp-b,.pdp-c{transform-box:fill-box;transform-origin:50% 50%;animation:pdp-muncul .4s ease-out both}
.pdp-a{animation-delay:1s}
.pdp-b{animation-delay:2s}
.pdp-c{animation-delay:3s}
.pdp-n{font-weight:700;text-anchor:middle}
.pdp-k2{font-size:11px;text-anchor:middle;fill:#64748B}
