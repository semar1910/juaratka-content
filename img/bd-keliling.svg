<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 242" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bd-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes bd-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes bd-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes bd-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes bd-tampak { from{opacity:0} to{opacity:1} }
@keyframes bd-redup { to{opacity:.12} }
@keyframes bd-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@media (prefers-reduced-motion: reduce){ [class*="bd-"] { animation:none !important; } }
</style>
<rect width="360" height="242" fill="#FFFFFF"/>
<rect x="68" y="26" width="224" height="128" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><line x1="68" y1="26" x2="292" y2="26" stroke="#EA580C" stroke-width="6" stroke-linecap="round" style="--p:224;stroke-dasharray:224;animation:bd-garis 0.5s linear 0.4s both"/><text class="bd-pop" x="180.0" y="18" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#EA580C;animation:bd-zoom .45s ease-out 0.8s both, bd-kedut .5s ease-in-out 1.3s 1;">7</text><line x1="292" y1="26" x2="292" y2="154" stroke="#EA580C" stroke-width="6" stroke-linecap="round" style="--p:128;stroke-dasharray:128;animation:bd-garis 0.5s linear 1.2000000000000002s both"/><text class="bd-pop" x="302" y="95.0" text-anchor="start" style="font-size:15px;font-weight:800;fill:#EA580C;animation:bd-zoom .45s ease-out 1.6s both, bd-kedut .5s ease-in-out 2.1s 1;">4</text><line x1="292" y1="154" x2="68" y2="154" stroke="#EA580C" stroke-width="6" stroke-linecap="round" style="--p:224;stroke-dasharray:224;animation:bd-garis 0.5s linear 2.0s both"/><text class="bd-pop" x="180.0" y="174" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#EA580C;animation:bd-zoom .45s ease-out 2.4s both, bd-kedut .5s ease-in-out 2.9s 1;">7</text><line x1="68" y1="154" x2="68" y2="26" stroke="#EA580C" stroke-width="6" stroke-linecap="round" style="--p:128;stroke-dasharray:128;animation:bd-garis 0.5s linear 2.8000000000000003s both"/><text class="bd-pop" x="58" y="95.0" text-anchor="end" style="font-size:15px;font-weight:800;fill:#EA580C;animation:bd-zoom .45s ease-out 3.2s both, bd-kedut .5s ease-in-out 3.7s 1;">4</text><text class="" x="180" y="204" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#334155;animation:bd-muncul 0.4s ease-out 3.8s both;">7 + 4 + 7 + 4 = 22 m</text><text class="" x="180" y="228" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#EA580C;animation:bd-muncul 0.4s ease-out 4.6s both;">= 2 × (7 + 4)</text>
</svg>