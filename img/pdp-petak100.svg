.pdp-hs{transform-box:fill-box;transform-origin:50% 50%;animation:pdp-muncul .4s ease-out 3.2s both}
@keyframes pdp-kedut{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.3) rotate(-6deg)}65%{transform:scale(1.15) rotate(5deg)}}
@keyframes pdp-zoom{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes pdp-muncul{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ [class*="pdp-"] { animation:none !important; } }
