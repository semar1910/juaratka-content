<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 206" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.psn-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes psn-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes psn-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes psn-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes psn-tampak { from{opacity:0} to{opacity:1} }
@keyframes psn-hilang { to{opacity:0} }
@keyframes psn-potong { from{stroke-dashoffset:40} to{stroke-dashoffset:0} }
@media (prefers-reduced-motion: reduce){ [class*="psn-"] { animation:none !important; } }
</style>
