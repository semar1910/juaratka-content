<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 206" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.md-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes md-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes md-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes md-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes md-tampak { from{opacity:0} to{opacity:1} }
@keyframes md-hilang { to{opacity:0} }
@keyframes md-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes md-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="md-"] { animation:none !important; } }
</style>
<rect width="360" height="206" fill="#FFFFFF"/>
<text class="" x="20" y="30" text-anchor="start" style="font-size:12px;font-weight:800;fill:#334155;">kertas</text><text class="" x="340" y="30" text-anchor="end" style="font-size:11px;font-weight:800;fill:#2563EB;">1 ikon = 5 kg</text><g style="animation:md-zoom 0.3s ease-out 0.3s both;"><path d="M80 45 q0 -5 5 -5 h10 q5 0 5 5 v15 q0 2 -2 2 h-16 q-2 0 -2 -2 z" fill="#BFDBFE" stroke="#78350F" stroke-width="1.2"/></g><g style="animation:md-zoom 0.3s ease-out 0.38s both;"><path d="M106 45 q0 -5 5 -5 h10 q5 0 5 5 v15 q0 2 -2 2 h-16 q-2 0 -2 -2 z" fill="#BFDBFE" stroke="#78350F" stroke-width="1.2"/></g><g style="animation:md-zoom 0.3s ease-out 0.45999999999999996s both;"><path d="M132 45 q0 -5 5 -5 h10 q5 0 5 5 v15 q0 2 -2 2 h-16 q-2 0 -2 -2 z" fill="#BFDBFE" stroke="#78350F" stroke-width="1.2"/></g><g style="animation:md-zoom 0.3s ease-out 0.54s both;"><path d="M158 45 q0 -5 5 -5 h10 q5 0 5 5 v15 q0 2 -2 2 h-16 q-2 0 -2 -2 z" fill="#BFDBFE" stroke="#78350F" stroke-width="1.2"/></g><g style="animation:md-zoom 0.3s ease-out 0.62s both;"><path d="M184 45 q0 -5 5 -5 h10 q5 0 5 5 v15 q0 2 -2 2 h-16 q-2 0 -2 -2 z" fill="#BFDBFE" stroke="#78350F" stroke-width="1.2"/></g><g style="animation:md-zoom 0.3s ease-out 0.7s both;"><path d="M210 45 q0 -5 5 -5 h10 q5 0 5 5 v15 q0 2 -2 2 h-16 q-2 0 -2 -2 z" fill="#BFDBFE" stroke="#78350F" stroke-width="1.2"/></g><text class="" x="20" y="100" text-anchor="start" style="font-size:12px;font-weight:800;fill:#334155;">plastik</text><text class="" x="340" y="100" text-anchor="end" style="font-size:11px;font-weight:800;fill:#EA580C;">1 ikon = 10 kg</text><g style="animation:md-zoom 0.3s ease-out 0.9s both;"><path d="M80 115 q0 -5 5 -5 h10 q5 0 5 5 v15 q0 2 -2 2 h-16 q-2 0 -2 -2 z" fill="#FED7AA" stroke="#78350F" stroke-width="1.2"/></g><g style="animation:md-zoom 0.3s ease-out 0.98s both;"><path d="M106 115 q0 -5 5 -5 h10 q5 0 5 5 v15 q0 2 -2 2 h-16 q-2 0 -2 -2 z" fill="#FED7AA" stroke="#78350F" stroke-width="1.2"/></g><g style="animation:md-zoom 0.3s ease-out 1.06s both;"><path d="M132 115 q0 -5 5 -5 h10 q5 0 5 5 v15 q0 2 -2 2 h-16 q-2 0 -2 -2 z" fill="#FED7AA" stroke="#78350F" stroke-width="1.2"/></g><g style="animation:md-zoom 0.3s ease-out 1.1400000000000001s both;"><path d="M158 115 q0 -5 5 -5 h10 q5 0 5 5 v15 q0 2 -2 2 h-16 q-2 0 -2 -2 z" fill="#FED7AA" stroke="#78350F" stroke-width="1.2"/></g><text class="" x="300" y="58" text-anchor="end" style="font-size:13.5px;font-weight:800;fill:#2563EB;animation:md-muncul 0.4s ease-out 1.8s both;">6 × 5 = 30</text><text class="" x="300" y="128" text-anchor="end" style="font-size:13.5px;font-weight:800;fill:#EA580C;animation:md-muncul 0.4s ease-out 2.3s both;">4 × 10 = 40</text><text class="" x="180" y="170" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#DC2626;animation:md-muncul 0.4s ease-out 3s both;">ikon lebih banyak, tapi kertas lebih sedikit!</text><text class="" x="180" y="192" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;animation:md-muncul 0.4s ease-out 3.6s both;">cek nilai ikon di tiap baris</text>
</svg>