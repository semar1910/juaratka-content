<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bd-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes bd-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes bd-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes bd-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes bd-tampak { from{opacity:0} to{opacity:1} }
@keyframes bd-redup { to{opacity:.12} }
@keyframes bd-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@media (prefers-reduced-motion: reduce){ [class*="bd-"] { animation:none !important; } }
.bd-putar { transform-box:view-box; transform-origin:180px 80px; animation: bd-putar 1.4s ease-in-out 1s both; }
@keyframes bd-putar { from{transform:rotate(180deg)} to{transform:rotate(0deg)} }
</style>
<rect width="360" height="250" fill="#FFFFFF"/>
<polygon class="bd-putar" points="320.0,24.0 152.0,24.0 208.0,136.0 292.0,136.0" fill="#BFDBFE" stroke="#2563EB" stroke-width="2.5"/><polygon points="40.0,136.0 208.0,136.0 152.0,24.0 68.0,24.0" fill="#FED7AA" stroke="#EA580C" stroke-width="2.5"/><text class="" x="124" y="154" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#EA580C;">6</text><text class="" x="110.0" y="17" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#EA580C;">3</text><text class="" x="250.0" y="154" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#2563EB;animation:bd-muncul 0.4s ease-out 2.6s both;">3</text><text class="" x="236" y="17" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#2563EB;animation:bd-muncul 0.4s ease-out 2.6s both;">6</text><line x1="68" y1="24" x2="68" y2="136" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 4"/><text class="" x="74" y="85" text-anchor="start" style="font-size:12px;font-weight:800;fill:#DC2626;">t = 4</text><g style="animation:bd-muncul 0.4s ease-out 3s both;"><path d="M40 166 h252" stroke="#16A34A" stroke-width="2.5"/><text class="" x="166.0" y="184" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#16A34A;">alas jajar genjang = 6 + 3</text></g><text class="" x="180" y="212" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#334155;animation:bd-muncul 0.4s ease-out 3.8s both;">2 trapesium = (6 + 3) × 4</text><text class="" x="180" y="236" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#EA580C;animation:bd-muncul 0.4s ease-out 4.5s both;">1 trapesium = ½ × (6 + 3) × 4</text>
</svg>