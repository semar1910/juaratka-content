<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 215" width="540" height="215" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Membandingkan sudut lancip, siku-siku, dan tumpul dengan pojok buku</title>

  <text x="270" y="20" text-anchor="middle" font-size="14" fill="#64748B">
    Garis putus-putus = pojok bukumu
  </text>

  <!-- ===================== LANCIP ===================== -->
  <g id="lancip">
    <line x1="60" y1="150" x2="60" y2="60" stroke="#CBD5E1" stroke-width="3"
          stroke-dasharray="6 6" stroke-linecap="round"/>
    <line x1="60" y1="150" x2="150" y2="150" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="150" x2="117.9" y2="81.1" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <path d="M 60 150 L 92 150 A 32 32 0 0 0 80.6 125.5 Z" fill="#E9A21B" fill-opacity="0.22"/>
    <path d="M 92 150 A 32 32 0 0 0 80.6 125.5" fill="none" stroke="#E9A21B" stroke-width="3"/>
    <circle cx="60" cy="150" r="4.5" fill="#1E293B"/>
    <text x="90" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#1E293B">Lancip</text>
    <text x="90" y="203" text-anchor="middle" font-size="13.5" fill="#64748B">lebih sempit</text>
  </g>

  <!-- ===================== SIKU-SIKU ===================== -->
  <g id="siku">
    <line x1="240" y1="150" x2="240" y2="60" stroke="#CBD5E1" stroke-width="3"
          stroke-dasharray="6 6" stroke-linecap="round"/>
    <line x1="240" y1="150" x2="330" y2="150" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <line x1="240" y1="150" x2="240" y2="60" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <path d="M 240 150 L 268 150 L 268 122 L 240 122 Z" fill="#E9A21B" fill-opacity="0.22"/>
    <path d="M 268 150 L 268 122 L 240 122" fill="none" stroke="#E9A21B" stroke-width="3"
          stroke-linejoin="round"/>
    <circle cx="240" cy="150" r="4.5" fill="#1E293B"/>
    <text x="270" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#1E293B">Siku-siku</text>
    <text x="270" y="203" text-anchor="middle" font-size="13.5" fill="#64748B">pas sama</text>
  </g>

  <!-- ===================== TUMPUL ===================== -->
  <g id="tumpul">
    <line x1="420" y1="150" x2="420" y2="60" stroke="#CBD5E1" stroke-width="3"
          stroke-dasharray="6 6" stroke-linecap="round"/>
    <line x1="420" y1="150" x2="510" y2="150" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <line x1="420" y1="150" x2="362.1" y2="81.1" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <path d="M 420 150 L 452 150 A 32 32 0 0 0 399.4 125.5 Z" fill="#E9A21B" fill-opacity="0.22"/>
    <path d="M 452 150 A 32 32 0 0 0 399.4 125.5" fill="none" stroke="#E9A21B" stroke-width="3"/>
    <circle cx="420" cy="150" r="4.5" fill="#1E293B"/>
    <text x="436" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#1E293B">Tumpul</text>
    <text x="436" y="203" text-anchor="middle" font-size="13.5" fill="#64748B">lebih lebar</text>
  </g>
</svg>
