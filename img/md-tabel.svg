t class="" x="60.0" y="137" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#334155;">Kelas 6</text><text class="" x="140.0" y="137" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#334155;">16</text><text class="" x="220.0" y="137" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#334155;">11</text><text class="" x="300.0" y="137" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#334155;">8</text><line x1="20" y1="52" x2="340" y2="52" stroke="#CBD5E1"/><line x1="20" y1="84" x2="340" y2="84" stroke="#CBD5E1"/><line x1="20" y1="116" x2="340" y2="116" stroke="#CBD5E1"/><line x1="100" y1="20" x2="100" y2="148" stroke="#CBD5E1"/><line x1="180" y1="20" x2="180" y2="148" stroke="#CBD5E1"/><line x1="260" y1="20" x2="260" y2="148" stroke="#CBD5E1"/><text class="" x="180" y="176" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#334155;animation:md-muncul 0.4s ease-out 2s both;">baris Kelas 5 × kolom Kertas</text><text class="" x="180" y="200" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#16A34A;animation:md-muncul 0.4s ease-out 2.8s both;">persilangannya: 18 kg</text>
