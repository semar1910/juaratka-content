tyle="animation:kf-zoom 0.35s ease-out 2.1999999999999997s both;"><rect x="22" y="146" width="144" height="24" rx="12" fill="#FFEDD5"/><text x="94" y="163" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#C2410C;">kapan lagi</text></g><g class="kf-pop" style="animation:kf-zoom 0.35s ease-out 2.5s both;"><rect x="194" y="146" width="144" height="24" rx="12" fill="#DCFCE7"/><text x="266" y="163" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#15803D;">dibagi rata</text></g><text x="94" y="196" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#EA580C;animation:kf-zoom .45s ease-out 3.2s both, kf-kedut .5s ease-in-out 3.7s 1;">hasil lebih BESAR</text><text x="266" y="196" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#16A34A;animation:kf-zoom .45s ease-out 3.6s both, kf-kedut .5s ease-in-out 4.1s 1;">hasil lebih KECIL</text>
