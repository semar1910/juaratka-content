<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.wj-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes wj-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes wj-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes wj-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes wj-tampak { from{opacity:0} to{opacity:1} }
@keyframes wj-hilang { to{opacity:0} }
@keyframes wj-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes wj-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="wj-"] { animation:none !important; } }
</style>
<rect width="360" height="228" fill="#FFFFFF"/>
<rect x="136" y="14" width="68" height="160" rx="10" fill="#EFF6FF"/><rect x="216" y="14" width="68" height="160" rx="10" fill="#FFF7ED"/><text class="" x="170" y="188" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#2563EB;">jam</text><text class="" x="250" y="188" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#EA580C;">menit</text><text class="" x="170" y="76" text-anchor="middle" style="font-size:28px;font-weight:800;fill:#334155;">10</text><text class="" x="250" y="76" text-anchor="middle" style="font-size:28px;font-weight:800;fill:#334155;">05</text><text class="" x="110" y="118" text-anchor="middle" style="font-size:28px;font-weight:800;fill:#334155;">−</text><text class="" x="170" y="118" text-anchor="middle" style="font-size:28px;font-weight:800;fill:#334155;">7</text><text class="" x="250" y="118" text-anchor="middle" style="font-size:28px;font-weight:800;fill:#334155;">55</text><line x1="120" y1="130" x2="290" y2="130" stroke="#334155" stroke-width="2.5"/><line x1="152" y1="80" x2="188" y2="54" stroke="#DC2626" stroke-width="2.5" style="--p:45;stroke-dasharray:45;animation:wj-garis .4s ease-out 1.2s both"/><line x1="232" y1="80" x2="268" y2="54" stroke="#DC2626" stroke-width="2.5" style="--p:45;stroke-dasharray:45;animation:wj-garis .4s ease-out 2s both"/><text class="wj-pop" x="170" y="38" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#DC2626;animation:wj-zoom .45s ease-out 1.5s both, wj-kedut .5s ease-in-out 2.0s 1;">9</text><text class="wj-pop" x="250" y="38" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#DC2626;animation:wj-zoom .45s ease-out 2.3s both, wj-kedut .5s ease-in-out 2.8s 2;">65</text><text class="" x="46" y="38" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#DC2626;animation:wj-muncul 0.4s ease-out 1.5s both;">pinjam 1 jam</text><text class="" x="46" y="54" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#DC2626;animation:wj-muncul 0.4s ease-out 1.8s both;">= 60 menit</text><text class="" x="46" y="70" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#64748B;animation:wj-muncul 0.4s ease-out 2.3s both;">5 + 60 = 65</text><text class="" x="250" y="162" text-anchor="middle" style="font-size:26px;font-weight:800;fill:#16A34A;animation:wj-muncul 0.4s ease-out 3.2s both;">10</text><text class="" x="170" y="162" text-anchor="middle" style="font-size:26px;font-weight:800;fill:#16A34A;animation:wj-muncul 0.4s ease-out 3.8s both;">2</text><text class="" x="46" y="118" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#64748B;animation:wj-muncul 0.4s ease-out 0.6s both;">5 − 55?</text><text class="" x="46" y="134" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#DC2626;animation:wj-muncul 0.4s ease-out 0.8s both;">tidak cukup!</text><text class="" x="180" y="214" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#DC2626;animation:wj-muncul 0.4s ease-out 4.4s both;">pinjam 1 jam = 60 menit, bukan 10!</text>
</svg>