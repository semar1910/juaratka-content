<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.pp-pop { transform-box:fill-box; transform-origin:50% 50%; }
.pp-dig { font-size:30px; font-weight:800; fill:#334155; text-anchor:middle; }
.pp-ket { font-size:13px; font-weight:600; fill:#64748B; text-anchor:middle; }
.pp-koin-t { font-size:8.5px; font-weight:700; fill:#475569; text-anchor:middle; }
.pp-o { fill:#EA580C; } .pp-b { fill:#2563EB; } .pp-r { fill:#DC2626; }
@keyframes pp-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes pp-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes pp-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes pp-lebur { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(.3)} }
@keyframes pp-redup { to{opacity:.18} }
@keyframes pp-coret { from{stroke-dashoffset:40} to{stroke-dashoffset:0} }
.pp-h { opacity:0; }
@media (prefers-reduced-motion: reduce){ [class*="pp-"] { animation:none !important; } .pp-h { opacity:1 !important; } .pp-hilang { opacity:0 !important; } }

.pp-g2 { animation:pp-muncul .5s ease-out .5s both; }
.pp-hasil { animation:pp-zoom .55s ease-out 1.6s both; }
.pp-hasil-t { animation:pp-kedut .55s ease-in-out 2.2s 2; }
</style>
<rect width="360" height="210" fill="#FFFFFF"/>
<g class="pp-pop " style=""><circle cx="40" cy="55" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="40" y="58">100</text></g><g class="pp-pop " style=""><circle cx="70" cy="55" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="70" y="58">100</text></g><g class="pp-pop " style=""><circle cx="40" cy="85" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="40" y="88">100</text></g><g class="pp-pop " style=""><circle cx="70" cy="85" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="70" y="88">100</text></g><text x="112" y="80" class="pp-dig" style="font-size:26px">+</text><g class="pp-g2"><g class="pp-pop " style=""><circle cx="150" cy="55" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="150" y="58">100</text></g><g class="pp-pop " style=""><circle cx="180" cy="55" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="180" y="58">100</text></g><g class="pp-pop " style=""><circle cx="210" cy="55" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="210" y="58">100</text></g><g class="pp-pop " style=""><circle cx="240" cy="55" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="240" y="58">100</text></g><g class="pp-pop " style=""><circle cx="150" cy="85" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="150" y="88">100</text></g><g class="pp-pop " style=""><circle cx="180" cy="85" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="180" y="88">100</text></g><g class="pp-pop " style=""><circle cx="210" cy="85" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="210" y="88">100</text></g><g class="pp-pop " style=""><circle cx="240" cy="85" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text class="pp-koin-t" x="240" y="88">100</text></g></g><text x="55" y="130" class="pp-ket">4 koin</text><text x="195" y="130" class="pp-ket">8 koin</text><g class="pp-hasil pp-pop"><rect x="70" y="150" width="220" height="44" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/><text x="180" y="179" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#334155">jadi <tspan class="pp-o pp-pop pp-hasil-t">12</tspan> koin seratusan</text></g>
</svg>