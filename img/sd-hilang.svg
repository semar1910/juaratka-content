<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sd-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes sd-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes sd-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes sd-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes sd-tampak { from{opacity:0} to{opacity:1} }
@keyframes sd-hilang { to{opacity:0} }
@keyframes sd-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes sd-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="sd-"] { animation:none !important; } }
</style>
<rect width="360" height="200" fill="#FFFFFF"/>
<text class="" x="180" y="20" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;">kelas 6B: total 32 siswa</text><rect x="20" y="36" width="320" height="34" rx="6" fill="#F8FAFC" stroke="#334155" stroke-width="2"/><rect class="sd-pop" x="20.0" y="36" width="100.0" height="34" fill="#FFEDD5" stroke="#EA580C" style="animation:sd-zoom 0.4s ease-out 0.4s both;"/><text class="" x="70.0" y="58" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C;animation:sd-muncul 0.4s ease-out 0.6s both;">10</text><text class="" x="70.0" y="88" text-anchor="middle" style="font-size:10.5px;font-weight:800;fill:#EA580C;animation:sd-muncul 0.4s ease-out 0.6s both;">jalan kaki</text><rect class="sd-pop" x="120.0" y="36" width="80.0" height="34" fill="#DBEAFE" stroke="#2563EB" style="animation:sd-zoom 0.4s ease-out 0.9s both;"/><text class="" x="160.0" y="58" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#2563EB;animation:sd-muncul 0.4s ease-out 1.1s both;">8</text><text class="" x="160.0" y="88" text-anchor="middle" style="font-size:10.5px;font-weight:800;fill:#2563EB;animation:sd-muncul 0.4s ease-out 1.1s both;">sepeda</text><rect class="sd-pop" x="200.0" y="36" width="50.0" height="34" fill="#EDE9FE" stroke="#7C3AED" style="animation:sd-zoom 0.4s ease-out 1.4s both;"/><text class="" x="225.0" y="58" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#7C3AED;animation:sd-muncul 0.4s ease-out 1.6s both;">5</text><text class="" x="225.0" y="88" text-anchor="middle" style="font-size:10.5px;font-weight:800;fill:#7C3AED;animation:sd-muncul 0.4s ease-out 1.6s both;">angkot</text><rect x="250.0" y="36" width="90.0" height="34" fill="#DCFCE7" stroke="#16A34A" stroke-dasharray="4 3" stroke-width="2" style="animation:sd-tampak 0.4s ease-out 2.2s both;"/><text class="sd-pop" x="295.0" y="59" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#16A34A;animation:sd-zoom .45s ease-out 2.4s both, sd-kedut .5s ease-in-out 2.9s 2;">?</text><text class="" x="295.0" y="88" text-anchor="middle" style="font-size:10.5px;font-weight:800;fill:#16A34A;animation:sd-muncul 0.4s ease-out 2.2s both;">motor</text><text class="" x="180" y="128" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#334155;animation:sd-muncul 0.4s ease-out 3.2s both;">10 + 8 + 5 = 23</text><text class="sd-pop" x="180" y="154" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#16A34A;animation:sd-zoom .45s ease-out 3.8s both, sd-kedut .5s ease-in-out 4.3s 1;">motor = 32 − 23 = 9</text><text class="" x="180" y="186" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#64748B;animation:sd-muncul 0.4s ease-out 4.5s both;">data hilang = total − yang sudah diketahui</text>
</svg>