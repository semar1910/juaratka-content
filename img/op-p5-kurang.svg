<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .op-lbl { font-size: 12px; font-weight: 700; }
    .op-lbl-a { fill: #EA580C; }
    .op-lbl-b { fill: #2563EB; }
    .op-cut { stroke-dasharray: 36; stroke-width: 1.5; animation: op-garis .25s ease-out both; }
    .op-cut-a { stroke: #EA580C; }
    .op-cut-b { stroke: #2563EB; }
    .op-grp { transform-box: fill-box; transform-origin: 50% 50%; }
    .op-kpk { font-size: 13px; font-weight: 700; fill: #334155; text-anchor: middle; animation: op-muncul .4s ease-out 2.0s both; }
    .op-eq-a { animation: op-muncul .3s ease-out 2.6s both, op-kedut .3s ease-in-out 2.9s 3; }
    .op-eq-b { animation: op-muncul .3s ease-out 3.6s both, op-kedut .3s ease-in-out 3.9s 3; }
    .op-pakai { animation: op-muncul .4s ease-out 4.8s both; }
    .op-total { animation: op-muncul .4s ease-out 5.4s both; }
    .op-n { font-size: 15px; font-weight: 800; text-anchor: middle; }
    .op-n2 { font-size: 18px; font-weight: 800; text-anchor: middle; }
    .op-c-a { fill: #EA580C; }
    .op-c-b { fill: #2563EB; }
    .op-c-t { fill: #334155; }
    .op-sym { font-size: 18px; font-weight: 800; fill: #334155; text-anchor: middle; }
    @keyframes op-muncul { from { opacity: 0; } to { opacity: 1; } }
    @keyframes op-garis { from { stroke-dashoffset: 36; } to { stroke-dashoffset: 0; } }
    @keyframes op-kedut {
      0%, 100% { transform: scale(1) rotate(0); }
      35% { transform: scale(1.08) rotate(-2deg); }
      65% { transform: scale(1.04) rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce){ [class*="op-"] { animation: none !important; } }
  </style>

  <rect width="360" height="260" fill="#FFFFFF"/>

  <!-- Pita 5/6 meter (oranye): 5 dari 6 bagian terisi -->
  <text x="30" y="30" class="op-lbl op-lbl-a">Pita ada 5/6 meter</text>
  <rect x="30" y="36" width="300" height="36" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <rect x="30" y="36" width="250" height="36" fill="#FDBA74" stroke="#EA580C" stroke-width="2"/>
  <line x1="80" y1="36" x2="80" y2="72" stroke="#EA580C" stroke-width="1.5"/>
  <line x1="130" y1="36" x2="130" y2="72" stroke="#EA580C" stroke-width="1.5"/>
  <line x1="180" y1="36" x2="180" y2="72" stroke="#EA580C" stroke-width="1.5"/>
  <line x1="230" y1="36" x2="230" y2="72" stroke="#EA580C" stroke-width="1.5"/>
  <line x1="280" y1="36" x2="280" y2="72" stroke="#FDBA74" stroke-width="2"/>

  <!-- Pita 1/4 meter (biru): 1 dari 4 bagian terisi -->
  <text x="30" y="88" class="op-lbl op-lbl-b">Dipakai 1/4 meter</text>
  <rect x="30" y="94" width="300" height="36" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <rect x="30" y="94" width="75" height="36" fill="#93C5FD" stroke="#2563EB" stroke-width="2"/>
  <line x1="180" y1="94" x2="180" y2="130" stroke="#93C5FD" stroke-width="2"/>
  <line x1="255" y1="94" x2="255" y2="130" stroke="#93C5FD" stroke-width="2"/>

  <!-- Garis potong baru, kiri ke kanan -->
  <line class="op-cut op-cut-a" style="animation-delay:0.3s" x1="55" y1="36" x2="55" y2="72"/>
  <line class="op-cut op-cut-b" style="animation-delay:0.3s" x1="55" y1="94" x2="55" y2="130"/>
  <line class="op-cut op-cut-b" style="animation-delay:0.4s" x1="80" y1="94" x2="80" y2="130"/>
  <line class="op-cut op-cut-a" style="animation-delay:0.5s" x1="105" y1="36" x2="105" y2="72"/>
  <line class="op-cut op-cut-b" style="animation-delay:0.6s" x1="130" y1="94" x2="130" y2="130"/>
  <line class="op-cut op-cut-a" style="animation-delay:0.7s" x1="155" y1="36" x2="155" y2="72"/>
  <line class="op-cut op-cut-b" style="animation-delay:0.7s" x1="155" y1="94" x2="155" y2="130"/>
  <line class="op-cut op-cut-a" style="animation-delay:0.8s" x1="205" y1="36" x2="205" y2="72"/>
  <line class="op-cut op-cut-b" style="animation-delay:0.8s" x1="205" y1="94" x2="205" y2="130"/>
  <line class="op-cut op-cut-b" style="animation-delay:0.9s" x1="230" y1="94" x2="230" y2="130"/>
  <line class="op-cut op-cut-a" style="animation-delay:1.0s" x1="255" y1="36" x2="255" y2="72"/>
  <line class="op-cut op-cut-b" style="animation-delay:1.1s" x1="280" y1="94" x2="280" y2="130"/>
  <line class="op-cut op-cut-a" style="animation-delay:1.2s" x1="305" y1="36" x2="305" y2="72"/>
  <line class="op-cut op-cut-b" style="animation-delay:1.2s" x1="305" y1="94" x2="305" y2="130"/>

  <text x="180" y="148" class="op-kpk">Keduanya dipotong jadi 12 bagian</text>

  <!-- 5/6 = 10/12 -->
  <g class="op-grp op-eq-a">
    <text x="58" y="174" class="op-n op-c-a">5</text><line x1="50" y1="179" x2="66" y2="179" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="58" y="193" class="op-n op-c-a">6</text>
    <text x="88" y="188" class="op-sym">=</text>
    <text x="120" y="174" class="op-n op-c-a">10</text><line x1="108" y1="179" x2="132" y2="179" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="120" y="193" class="op-n op-c-a">12</text>
  </g>

  <!-- 1/4 = 3/12 -->
  <g class="op-grp op-eq-b">
    <text x="232" y="174" class="op-n op-c-b">1</text><line x1="224" y1="179" x2="240" y2="179" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="232" y="193" class="op-n op-c-b">4</text>
    <text x="262" y="188" class="op-sym">=</text>
    <text x="294" y="174" class="op-n op-c-b">3</text><line x1="282" y1="179" x2="306" y2="179" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="294" y="193" class="op-n op-c-b">12</text>
  </g>

  <!-- 3 potong terakhir dari 10 diwarnai biru (dipakai) -->
  <g class="op-pakai">
    <rect x="205" y="36" width="75" height="36" fill="#93C5FD" stroke="#2563EB" stroke-width="2"/>
    <line x1="230" y1="36" x2="230" y2="72" stroke="#2563EB" stroke-width="1.5"/>
    <line x1="255" y1="36" x2="255" y2="72" stroke="#2563EB" stroke-width="1.5"/>
  </g>

  <!-- 10/12 − 3/12 = 7/12 -->
  <g class="op-total">
    <rect x="40" y="200" width="280" height="54" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="103" y="222" class="op-n2 op-c-a">10</text><line x1="90" y1="227" x2="116" y2="227" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><text x="103" y="246" class="op-n2 op-c-t">12</text>
    <text x="140" y="240" class="op-sym">−</text>
    <text x="178" y="222" class="op-n2 op-c-b">3</text><line x1="165" y1="227" x2="191" y2="227" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><text x="178" y="246" class="op-n2 op-c-t">12</text>
    <text x="216" y="240" class="op-sym">=</text>
    <text x="258" y="222" class="op-n2 op-c-t">7</text><line x1="245" y1="227" x2="271" y2="227" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><text x="258" y="246" class="op-n2 op-c-t">12</text>
  </g>
</svg>
