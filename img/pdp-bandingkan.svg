<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="360" height="250" fill="#FFFFFF"/>
<style>
@keyframes pdp-kedut{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.3) rotate(-6deg)}65%{transform:scale(1.15) rotate(5deg)}}
@keyframes pdp-zoom{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes pdp-muncul{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pdp-kilau{0%{opacity:0}40%{opacity:1}100%{opacity:.7}}
.pdp-kosong{fill:#E2E8F0}
.pdp-ka{fill:#EA580C}
.pdp-kb{fill:#7C3AED}
.pdp-l{font-size:12px;font-weight:700}
.pdp-f{font-size:11px;font-weight:700;fill:#334155;text-anchor:middle}
.pdp-n{font-size:11px;fill:#64748B;text-anchor:middle}
.pdp-h{font-size:12px;font-weight:700;fill:#334155;text-anchor:middle}
.pdp-a{animation:pdp-muncul .4s ease-out .5s both}
.pdp-c1{animation:pdp-muncul .4s ease-out 1.5s both}
.pdp-c2{animation:pdp-muncul .4s ease-out 2.1s both}
.pdp-c3{animation:pdp-muncul .4s ease-out 2.7s both}
.pdp-c4{animation:pdp-muncul .4s ease-out 3.3s both}
.pdp-e{animation:pdp-muncul .4s ease-out 3.5s both}
.pdp-z{fill:#FACC15;animation:pdp-zoom .5s ease-out 3.5s both;transform-box:fill-box;transform-origin:50% 50%}
.pdp-t{fill:none;stroke:#334155;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;animation:pdp-zoom .5s ease-out 3.5s both;transform-box:fill-box;transform-origin:50% 50%}
.pdp-kl{fill:none;stroke:#FACC15;stroke-width:3;animation:pdp-kilau .8s ease-out 3.5s both}
@media (prefers-reduced-motion: reduce){ [class*="pdp-"] { animation:none !important; } }
</style>
<defs>
<rect id="pdp-k" width="12" height="12" rx="2"/>
<g id="pdp-r"><use href="#pdp-k"/><use href="#pdp-k" x="13"/><use href="#pdp-k" x="26"/><use href="#pdp-k" x="39"/><use href="#pdp-k" x="52"/><use href="#pdp-k" x="65"/><use href="#pdp-k" x="78"/><use href="#pdp-k" x="91"/><use href="#pdp-k" x="104"/><use href="#pdp-k" x="117"/></g>
<g id="pdp-s"><use href="#pdp-k"/><use href="#pdp-k" x="13"/><use href="#pdp-k" x="26"/><use href="#pdp-k" x="39"/><use href="#pdp-k" x="52"/><use href="#pdp-k" x="65"/></g>
<g id="pdp-g"><use href="#pdp-r"/><use href="#pdp-r" y="13"/><use href="#pdp-r" y="26"/><use href="#pdp-r" y="39"/><use href="#pdp-r" y="52"/><use href="#pdp-r" y="65"/><use href="#pdp-r" y="78"/><use href="#pdp-r" y="91"/><use href="#pdp-r" y="104"/><use href="#pdp-r" y="117"/></g>
<path id="pdp-star" d="M0-8L2.2-2.2L8 0L2.2 2.2L0 8L-2.2 2.2L-8 0L-2.2-2.2Z"/>
</defs>
<g class="pdp-a">
<g class="pdp-kosong" transform="translate(36,62)"><use href="#pdp-g"/></g>
<g class="pdp-kosong" transform="translate(195,62)"><use href="#pdp-g"/></g>
<text class="pdp-l" x="36" y="40" fill="#EA580C">Toko A:</text>
<text class="pdp-f" x="94" y="34">9</text>
<line x1="86" y1="37" x2="102" y2="37" stroke="#334155" stroke-width="1.5"/>
<text class="pdp-f" x="94" y="48">25</text>
<text class="pdp-l" x="108" y="40" fill="#EA580C">= 36%</text>
<text class="pdp-l" x="195" y="40" fill="#7C3AED">Toko B: 16%</text>
<text class="pdp-n" x="100" y="212">36 dari 100 kotak</text>
<text class="pdp-n" x="259" y="212">16 dari 100 kotak</text>
</g>
<g transform="translate(36,62)" class="pdp-ka">
<g class="pdp-c1"><use href="#pdp-r"/><use href="#pdp-r" y="13"/></g>
<g class="pdp-c3"><use href="#pdp-r" y="26"/><use href="#pdp-s" y="39"/></g>
</g>
<g transform="translate(195,62)" class="pdp-kb">
<g class="pdp-c2"><use href="#pdp-r"/></g>
<g class="pdp-c4"><use href="#pdp-s" y="13"/></g>
</g>
<rect class="pdp-kl" x="32" y="58" width="137" height="137" rx="6"/>
<g transform="translate(32,58)"><use href="#pdp-star" class="pdp-z"/></g>
<g transform="translate(169,58)"><use href="#pdp-star" class="pdp-z"/></g>
<g transform="translate(169,195)"><use href="#pdp-star" class="pdp-z"/></g>
<path class="pdp-t" d="M173 111L187 127L173 143"/>
<text class="pdp-h pdp-e" x="180" y="238">36% &gt; 16%, jadi Toko A lebih besar</text>
</svg>
