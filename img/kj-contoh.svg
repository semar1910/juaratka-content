yle="font-size:12px;font-weight:800;fill:#2563EB;">243 − 144 = 99 km</text><text class="" x="266" y="203" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#2563EB;">99 ÷ 44 = 2 jam 15 menit</text></g><g id="tahap4"><text class="" x="326" y="150" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#16A34A;">?</text><rect x="60" y="212" width="240" height="30" rx="10" fill="#F0FDF4" stroke="#16A34A"/><text class="" x="180" y="232" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#166534;">08.10 + 2 jam 15 menit = <tspan fill="#EA580C">?</tspan></text></g>
