<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.kf-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes kf-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes kf-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes kf-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes kf-tampak { from{opacity:0} to{opacity:1} }
@keyframes kf-hilang { to{opacity:0} }
@keyframes kf-garis { from{stroke-dashoffset:200} to{stroke-dashoffset:0} }
@media (prefers-reduced-motion: reduce){ [class*="kf-"] { animation:none !important; } }
</style>
<rect width="360" height="262" fill="#FFFFFF"/>
<circle cx="130" cy="92" r="72" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5" fill-opacity=".8"/><circle cx="230" cy="92" r="72" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5" fill-opacity=".6"/><text x="84" y="30" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#EA580C;">12</text><text x="276" y="30" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#2563EB;">20</text><path d="M180 40.2 A72 72 0 0 1 180 143.8 A72 72 0 0 1 180 40.2 Z" fill="#BBF7D0" style="animation:kf-tampak 0.4s ease-out 1.8s both;"/><text x="100" y="90" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#334155;animation:kf-muncul 0.4s ease-out 0.3s both;">3</text><text x="180" y="76" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#166534;animation:kf-muncul 0.4s ease-out 0.8999999999999999s both;">2</text><text x="180" y="104" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#166534;animation:kf-muncul 0.4s ease-out 1.0999999999999999s both;">2</text><text x="260" y="90" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#334155;animation:kf-muncul 0.4s ease-out 1.3s both;">5</text><g class="kf-pop" style="animation:kf-zoom .45s ease-out 2.3s both, kf-kedut .5s ease-in-out 2.8s 1;"><rect x="20" y="176" width="320" height="34" rx="11" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/><text x="180" y="198" text-anchor="middle" style="font-size:13.5px;font-weight:800;fill:#166534;">FPB = yang di <tspan fill="#16A34A">tengah</tspan>: 2 × 2 = 4</text></g><circle cx="130" cy="92" r="72" fill="none" stroke="#EA580C" stroke-width="5" style="animation:kf-tampak 0.4s ease-out 3.6s both;"/><circle cx="230" cy="92" r="72" fill="none" stroke="#2563EB" stroke-width="5" style="animation:kf-tampak 0.4s ease-out 3.6s both;"/><g class="kf-pop" style="animation:kf-zoom .45s ease-out 4.1s both, kf-kedut .5s ease-in-out 4.6s 1;"><rect x="20" y="218" width="320" height="34" rx="11" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/><text x="180" y="240" text-anchor="middle" style="font-size:13.5px;font-weight:800;fill:#334155;">KPK = <tspan fill="#EA580C">semua</tspan>: 3 × 2 × 2 × 5 = 60</text></g>
</svg>