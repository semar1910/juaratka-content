<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 222" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bd-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes bd-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes bd-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes bd-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes bd-tampak { from{opacity:0} to{opacity:1} }
@keyframes bd-redup { to{opacity:.12} }
@keyframes bd-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@media (prefers-reduced-motion: reduce){ [class*="bd-"] { animation:none !important; } }
.bd-geser { animation: bd-geser 1.2s ease-in-out 1.6s both; }
@keyframes bd-geser { from{transform:none} to{transform:translateX(180px)} }
</style>
<rect width="360" height="222" fill="#FFFFFF"/>
<polygon points="94.0,132.0 220.0,132.0 274.0,24.0 94.0,24.0" fill="#BFDBFE" stroke="#2563EB" stroke-width="2"/><polygon class="bd-geser" points="40.0,132.0 94.0,132.0 94.0,24.0" fill="#FED7AA" stroke="#EA580C" stroke-width="2.5"/><line x1="94.0" y1="24" x2="94.0" y2="132" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 4" style="animation:bd-tampak 0.3s ease-out 0.6s both;"/><text class="" x="102.0" y="83.0" text-anchor="start" style="font-size:14px;font-weight:800;fill:#DC2626;animation:bd-muncul 0.4s ease-out 0.6s both;">t</text><text class="" x="157.0" y="154" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#2563EB;animation:bd-muncul 0.4s ease-out 0.3s both;">alas</text><text class="" x="180" y="182" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#64748B;animation:bd-muncul 0.4s ease-out 3s both;">potong ujungnya, geser → jadi persegi panjang</text><text class="" x="180" y="208" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#2563EB;animation:bd-muncul 0.4s ease-out 3.6s both;">luas = alas × tinggi</text>
</svg>