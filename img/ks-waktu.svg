<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 208" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.ks-pop { transform-box:fill-box; transform-origin:50% 50%; }
.ks-dig { font-size:28px; font-weight:800; fill:#334155; text-anchor:middle; }
.ks-ket { font-size:13px; font-weight:600; fill:#64748B; text-anchor:middle; }
@keyframes ks-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes ks-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes ks-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes ks-hilang { to{opacity:0} }
@media (prefers-reduced-motion: reduce){ [class*="ks-"] { animation:none !important; } }

.ks-jarum-m { transform-box:view-box; transform-origin:80px 100px; animation:ks-putar 3s linear .6s 1 both; }
.ks-jarum-j { transform-box:view-box; transform-origin:80px 100px; animation:ks-putar-j 3s linear .6s 1 both; }
@keyframes ks-putar { from{transform:rotate(0)} to{transform:rotate(360deg)} }
@keyframes ks-putar-j { from{transform:rotate(60deg)} to{transform:rotate(90deg)} }
</style>
