<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.wj-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes wj-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes wj-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes wj-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes wj-tampak { from{opacity:0} to{opacity:1} }
@keyframes wj-hilang { to{opacity:0} }
@keyframes wj-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes wj-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="wj-"] { animation:none !important; } }
</style>
<rect width="360" height="228" fill="#FFFFFF"/>
<circle cx="62" cy="70" r="44" fill="#F8FAFC" stroke="#334155" stroke-width="2"/><circle class="wj-pop" cx="62" cy="70" r="41" fill="#BFDBFE" style="animation:wj-zoom 0.5s ease-out 0.4s both;"/><circle cx="172" cy="70" r="44" fill="#F8FAFC" stroke="#334155" stroke-width="2"/><circle class="wj-pop" cx="172" cy="70" r="41" fill="#BFDBFE" style="animation:wj-zoom 0.5s ease-out 1s both;"/><circle cx="282" cy="70" r="44" fill="#F8FAFC" stroke="#334155" stroke-width="2"/><path class="wj-pop" d="M282 70 L282 29 A41 41 0 0 1 317.5 49.5 Z" fill="#FED7AA" style="animation:wj-zoom 0.5s ease-out 1.6s both;"/><text class="" x="62" y="134" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#2563EB;">1 jam</text><text class="" x="172" y="134" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#2563EB;">1 jam</text><text class="" x="282" y="134" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#EA580C;">10 menit</text><text class="" x="62" y="154" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#2563EB;animation:wj-muncul 0.4s ease-out 2.2s both;">60</text><text class="" x="117" y="154" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#334155;animation:wj-muncul 0.4s ease-out 2.2s both;">+</text><text class="" x="172" y="154" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#2563EB;animation:wj-muncul 0.4s ease-out 2.4s both;">60</text><text class="" x="227" y="154" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#334155;animation:wj-muncul 0.4s ease-out 2.4s both;">+</text><text class="" x="282" y="154" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#EA580C;animation:wj-muncul 0.4s ease-out 2.6s both;">10</text><text class="" x="180" y="190" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#334155;animation:wj-muncul 0.4s ease-out 3.2s both;">2 jam 10 menit = 2 × 60 + 10</text><text class="wj-pop" x="180" y="214" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#16A34A;animation:wj-zoom .45s ease-out 3.8s both, wj-kedut .5s ease-in-out 4.3s 1;">= 130 menit</text>
</svg>