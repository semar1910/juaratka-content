<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .op-lbl { font-size: 12px; font-weight: 700; fill: #EA580C; }
    .op-ket { font-size: 11px; font-weight: 600; fill: #64748B; text-anchor: middle; }
    .op-t1 { animation: op-muncul .4s ease-out .4s both; }
    .op-t2 { font-size: 13px; font-weight: 700; fill: #334155; text-anchor: middle; animation: op-muncul .4s ease-out 1.6s both; }
    .op-cut { stroke: #EA580C; stroke-width: 1.5; stroke-dasharray: 36; animation: op-garis .25s ease-out both; }
    .op-bagi { animation: op-muncul .3s ease-out 1.1s both; }
    .op-num { font-size: 14px; font-weight: 800; fill: #334155; text-anchor: middle; }
    .op-grp { transform-box: fill-box; transform-origin: 50% 50%; }
    .op-kali { animation: op-muncul .3s ease-out 2.9s both, op-kedut .3s ease-in-out 3.2s 3; }
    .op-kalitxt { font-size: 15px; font-weight: 800; fill: #334155; text-anchor: middle; }
    .op-hasil { animation: op-muncul .4s ease-out 4.5s both; }
    .op-n2 { font-size: 18px; font-weight: 800; text-anchor: middle; }
    .op-c-a { fill: #EA580C; }
    .op-c-b { fill: #2563EB; }
    .op-c-t { fill: #334155; }
    .op-sym { font-size: 18px; font-weight: 800; fill: #334155; text-anchor: middle; }
    @keyframes op-muncul { from { opacity: 0; } to { opacity: 1; } }
    @keyframes op-garis { from { stroke-dashoffset: 36; } to { stroke-dashoffset: 0; } }
    @keyframes op-kedut {
      0%, 100% { transform: scale(1) rotate(0); }
      35% { transform: scale(1.08) rotate(-2deg); }
      65% { transform: scale(1.04) rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce){ [class*="op-"] { animation: none !important; } }
  </style>

  <rect width="360" height="250" fill="#FFFFFF"/>

  <!-- Pita 1/3 meter: 1 dari 3 bagian -->
  <text x="30" y="30" class="op-lbl">Pita 1/3 meter</text>
  <rect x="30" y="36" width="300" height="36" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <rect x="30" y="36" width="100" height="36" fill="#FDBA74" stroke="#EA580C" stroke-width="2"/>
  <line x1="130" y1="36" x2="130" y2="72" stroke="#EA580C" stroke-width="2"/>
  <line x1="230" y1="36" x2="230" y2="72" stroke="#FDBA74" stroke-width="2"/>

  <text x="130" y="92" class="op-ket op-t1">dibagi rata untuk 2 hiasan</text>

  <!-- Potongan 1/3 dibelah dua: hiasan 1 (oranye) dan hiasan 2 (biru) -->
  <line class="op-cut" style="animation-delay:.8s" x1="80" y1="36" x2="80" y2="72"/>
  <g class="op-bagi">
    <rect x="80" y="36" width="50" height="36" fill="#93C5FD" stroke="#2563EB" stroke-width="2"/>
    <text x="55" y="59" class="op-num">1</text>
    <text x="105" y="59" class="op-num">2</text>
  </g>

  <text x="180" y="124" class="op-t2">Tiap potongan dipotong lagi jadi 2</text>
  <line class="op-cut" style="animation-delay:1.9s" x1="180" y1="36" x2="180" y2="72"/>
  <line class="op-cut" style="animation-delay:2.05s" x1="280" y1="36" x2="280" y2="72"/>

  <!-- Penyebut dikali -->
  <g class="op-grp op-kali"><text x="180" y="156" class="op-kalitxt">penyebut: 3 × 2 = 6</text></g>

  <!-- 1/3 ÷ 2 = 1/6 -->
  <g class="op-hasil">
    <rect x="40" y="184" width="280" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="100" y="208" class="op-n2 op-c-a">1</text><line x1="91" y1="214" x2="109" y2="214" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><text x="100" y="234" class="op-n2 op-c-a">3</text>
    <text x="140" y="220" class="op-sym">÷</text>
    <text x="176" y="220" class="op-sym op-c-b">2</text>
    <text x="212" y="220" class="op-sym">=</text>
    <text x="256" y="208" class="op-n2 op-c-t">1</text><line x1="247" y1="214" x2="265" y2="214" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><text x="256" y="234" class="op-n2 op-c-t">6</text>
  </g>
</svg>
