 x1="36.0" y1="100.0" x2="30.0" y2="100.0" stroke="#334155" stroke-width="2"/><text class="" x="46.0" y="104.00000000000001" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#64748B;">9</text><line x1="43.2" y1="73.0" x2="38.0" y2="70.0" stroke="#334155" stroke-width="2"/><text class="" x="51.8948822334847" y="82.0" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#64748B;">10</text><line x1="63.0" y1="53.2" x2="60.0" y2="48.0" stroke="#334155" stroke-width="2"/><text class="" x="67.99999999999997" y="65.89488223348471" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#64748B;">11</text><line class="kj-jj" x1="90" y1="100" x2="90" y2="68" stroke="#334155" stroke-width="5" stroke-linecap="round"/><line class="kj-jm" x1="90" y1="100" x2="90" y2="50" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/><circle cx="90" cy="100" r="4" fill="#334155"/><text class="" x="262" y="42" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#64748B;">berangkat</text><text class="" x="262" y="64" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#334155;">07.20</text><text class="" x="262" y="96" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C;animation:kj-muncul 0.4s ease-out 0.8s both;">+ 2 jam 30 menit</text><text class="" x="262" y="124" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#64748B;animation:kj-muncul 0.4s ease-out 4.3s both;">tiba</text><text class="kj-pop" x="262" y="148" text-anchor="middle" style="font-size:22px;font-weight:800;fill:#16A34A;animation:kj-zoom .45s ease-out 4.4s both, kj-kedut .5s ease-in-out 4.9s 2;">09.50</text><g style="animation:kj-muncul 0.4s ease-out 5.2s both;"><rect x="20" y="182" width="320" height="34" rx="11" fill="#F0FDF4" stroke="#16A34A"/><text class="" x="180" y="204" text-anchor="middle" style="font-size:13.5px;font-weight:800;fill:#166534;">waktu tiba = berangkat + lama perjalanan</text></g>
</svg>