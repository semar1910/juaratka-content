<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="360" height="200" fill="#FFFFFF"/>
<defs>
<rect id="pdp-bx" width="34" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<g id="pdp-koma"><circle r="12" fill="#FDE047" opacity=".4"/><circle r="8.5" fill="#FDE047" opacity=".6"/><circle r="5" fill="#EAB308"/><path d="M1 4Q2 11-3 15" fill="none" stroke="#EAB308" stroke-width="3.5" stroke-linecap="round"/></g>
</defs>
<style>
[class*="pdp-"]{transform-box:fill-box;transform-origin:50% 50%}
.pdp-d{font-size:34px;font-weight:700;text-anchor:middle;fill:#334155}
.pdp-pr{fill:#2563EB}
.pdp-k{font-size:11px;font-weight:600;text-anchor:middle;fill:#64748B}
.pdp-x{font-size:20px;font-weight:700;text-anchor:middle}
.pdp-o{fill:#EA580C}
.pdp-bl{fill:#2563EB}
.pdp-r1{animation:pdp-muncul .4s ease-out .5s both}
.pdp-a1{animation:pdp-muncul .4s ease-out 1.2s both}
.pdp-r2{animation:pdp-muncul .4s ease-out 3.5s both}
.pdp-a2,.pdp-c2{animation:pdp-muncul .4s ease-out 3.9s both}
.pdp-z0{animation:pdp-muncul .4s ease-out 5.3s both}
.pdp-pc{animation:pdp-zoom .4s ease-out 2.6s both}
.pdp-h1{animation:pdp-hilang .3s ease-out 2.4s both}
.pdp-h2{animation:pdp-hilang .3s ease-out 2.5s both}
.pdp-h3{animation:pdp-hilang .3s ease-out 3.9s both}
.pdp-s1{animation:pdp-geser 1.2s ease-in-out 1.2s both}
.pdp-s2{animation:pdp-geserkiri 1s ease-in-out 4.3s both}
.pdp-kd{animation:pdp-kedut .3s ease-in-out .9s 1}
@keyframes pdp-geser{from{transform:translateX(0)}to{transform:translateX(80px)}}
@keyframes pdp-geserkiri{from{transform:translateX(0)}to{transform:translateX(-80px)}}
@keyframes pdp-hilang{from{opacity:1}to{opacity:0}}
@keyframes pdp-kedut{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.3) rotate(-6deg)}65%{transform:scale(1.15) rotate(5deg)}}
@keyframes pdp-zoom{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes pdp-muncul{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ [class*="pdp-"] { animation:none !important; } .pdp-h1,.pdp-h2,.pdp-h3{display:none} .pdp-s1{transform:translateX(80px)} .pdp-s2{transform:translateX(-80px)} }
</style>
<use href="#pdp-bx" x="103" y="42"/><use href="#pdp-bx" x="143" y="42"/><use href="#pdp-bx" x="183" y="42"/><use href="#pdp-bx" x="223" y="42"/>
<use href="#pdp-bx" x="103" y="146"/><use href="#pdp-bx" x="143" y="146"/><use href="#pdp-bx" x="183" y="146"/><use href="#pdp-bx" x="223" y="146"/>
<g class="pdp-r1">
<text class="pdp-d pdp-h1" x="120" y="76">0</text>
<text class="pdp-d" x="160" y="76">1</text>
<text class="pdp-d" x="200" y="76">6</text>
</g>
<text class="pdp-d pdp-pr pdp-pc" x="240" y="76">%</text>
<g transform="translate(140 70)"><g class="pdp-h2"><g class="pdp-s1"><g class="pdp-kd"><use href="#pdp-koma"/></g></g></g></g>
<g class="pdp-a1">
<path d="M140 36Q180 12 220 36" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="221,37 211,36.3 215.6,28.5" fill="#64748B"/>
<text class="pdp-k" x="180" y="15">geser 2 kotak</text>
<text class="pdp-x pdp-o" x="305" y="76">× 100</text>
</g>
<g class="pdp-r2">
<text class="pdp-d" x="160" y="180">3</text>
<text class="pdp-d" x="200" y="180">6</text>
<text class="pdp-d pdp-pr pdp-h3" x="240" y="180">%</text>
</g>
<text class="pdp-d pdp-z0" x="120" y="180">0</text>
<g transform="translate(220 174)"><g class="pdp-c2"><g class="pdp-s2"><use href="#pdp-koma"/></g></g></g>
<g class="pdp-a2">
<path d="M220 140Q180 116 140 140" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="139,141 144.4,132.5 149,140.3" fill="#64748B"/>
<text class="pdp-k" x="180" y="116">geser 2 kotak</text>
<text class="pdp-x pdp-bl" x="305" y="180">÷ 100</text>
</g>
</svg>
