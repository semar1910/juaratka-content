<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 264" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sd-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes sd-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes sd-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes sd-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes sd-tampak { from{opacity:0} to{opacity:1} }
@keyframes sd-hilang { to{opacity:0} }
@keyframes sd-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes sd-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="sd-"] { animation:none !important; } }
#tahap1 > *, #tahap2 > *, #tahap3 > * { animation:sd-muncul .4s ease-out both; }
</style>
<rect width="360" height="264" fill="#FFFFFF"/>
<rect x="24" y="12" width="260" height="162" fill="#fff" stroke="#334155" stroke-width="1.5"/><rect x="24" y="12" width="260" height="27" fill="#F1F5F9"/><text class="" x="109.0" y="30" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#334155;">lomba</text><text class="" x="239.0" y="30" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#334155;">peserta</text><line x1="24" y1="39" x2="284" y2="39" stroke="#CBD5E1"/><text class="" x="109.0" y="57" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#334155;">balap karung</text><text class="" x="239.0" y="57" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;">18</text><line x1="24" y1="66" x2="284" y2="66" stroke="#CBD5E1"/><text class="" x="109.0" y="84" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#334155;">makan kerupuk</text><text class="" x="239.0" y="84" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;">14</text><line x1="24" y1="93" x2="284" y2="93" stroke="#CBD5E1"/><text class="" x="109.0" y="111" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#334155;">bakiak</text><text class="" x="239.0" y="111" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;">12</text><line x1="24" y1="120" x2="284" y2="120" stroke="#CBD5E1"/><text class="" x="109.0" y="138" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#334155;">tarik tambang</text><text class="" x="239.0" y="138" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#DC2626;">?</text><line x1="24" y1="147" x2="284" y2="147" stroke="#CBD5E1"/><text class="" x="109.0" y="165" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#334155;">jumlah</text><text class="" x="239.0" y="165" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;">68</text><line x1="194" y1="12" x2="194" y2="174" stroke="#CBD5E1"/><rect x="24" y="147" width="260" height="27" fill="none" stroke="#334155" stroke-width="1.5"/><rect x="296" y="60" width="58" height="60" rx="10" fill="#FFF7ED" stroke="#EA580C"/><g style=""><circle cx="325" cy="71" r="5" fill="#EA580C"/><path d="M318 90 v-8 q0 -6 7 -6 q7 0 7 6 v8 z" fill="#EA580C"/></g><text class="" x="325" y="110" text-anchor="middle" style="font-size:10px;font-weight:800;fill:#EA580C;">= 4 siswa</text><g id="tahap1"><text class="" x="180" y="194" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#334155;">yang diketahui: 18 + 14 + 12 = 44</text></g><g id="tahap2"><rect x="216" y="124" width="46" height="19" rx="5" fill="#DCFCE7" stroke="#16A34A"/><text class="" x="239.0" y="138" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#16A34A;">24</text><text class="" x="180" y="214" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#16A34A;">tarik tambang = 68 − 44 = 24</text></g><g id="tahap3"><rect x="80" y="224" width="200" height="30" rx="10" fill="#FFF7ED" stroke="#EA580C"/><text class="" x="180" y="244" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#334155;">24 ÷ 4 = <tspan fill="#EA580C">?</tspan> ikon</text></g>
