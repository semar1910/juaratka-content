<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .op-seg { animation: op-muncul .3s ease-out both; }
    .op-lbl { font-size: 12px; font-weight: 700; }
    .op-lbl-a { fill: #EA580C; animation: op-muncul .4s ease-out .5s both; }
    .op-lbl-b { fill: #2563EB; animation: op-muncul .4s ease-out 1.7s both; }
    .op-grp { transform-box: fill-box; transform-origin: 50% 50%; }
    .op-pick-a { animation: op-muncul .3s ease-out 2.3s both, op-kedut .3s ease-in-out 2.6s 3; }
    .op-pick-b { animation: op-muncul .3s ease-out 2.3s both, op-kedut .3s ease-in-out 2.6s 3; }
    .op-frac { animation: op-muncul .4s ease-out 3.6s both; }
    .op-fr { font-size: 14px; font-weight: 800; fill: #334155; text-anchor: middle; }
    .op-beda { animation: op-muncul .4s ease-out 4.3s both; }
    .op-cap { font-size: 13px; font-weight: 700; fill: #334155; text-anchor: middle; }
    .op-total { animation: op-muncul .4s ease-out 5s both; }
    .op-eq { font-size: 20px; font-weight: 800; text-anchor: middle; }
    .op-eq-a { fill: #EA580C; }
    .op-eq-b { fill: #2563EB; }
    .op-eq-t { fill: #334155; font-size: 22px; font-weight: 800; text-anchor: middle; }
    @keyframes op-muncul {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes op-kedut {
      0%, 100% { transform: scale(1) rotate(0); }
      35% { transform: scale(1.08) rotate(-2deg); }
      65% { transform: scale(1.04) rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce){ [class*="op-"] { animation: none !important; } }
  </style>

  <rect width="360" height="260" fill="#FFFFFF"/>

  <!-- Pita oranye: 3 bagian -->
  <text x="30" y="36" class="op-lbl op-lbl-a">Pita oranye dipotong jadi 3 bagian</text>
  <g>
    <rect class="op-seg" style="animation-delay:0s"   x="30"  y="44" width="100" height="44" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
    <rect class="op-seg" style="animation-delay:.15s" x="130" y="44" width="100" height="44" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
    <rect class="op-seg" style="animation-delay:.3s"  x="230" y="44" width="100" height="44" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  </g>

  <!-- Pita biru: 4 bagian -->
  <g>
    <rect class="op-seg" style="animation-delay:1s"    x="30"  y="100" width="75" height="44" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <rect class="op-seg" style="animation-delay:1.15s" x="105" y="100" width="75" height="44" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <rect class="op-seg" style="animation-delay:1.3s"  x="180" y="100" width="75" height="44" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <rect class="op-seg" style="animation-delay:1.45s" x="255" y="100" width="75" height="44" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  </g>
  <text x="30" y="162" class="op-lbl op-lbl-b">Pita biru dipotong jadi 4 bagian</text>

  <!-- Ambil 1 potong dari masing-masing -->
  <g class="op-grp op-pick-a">
    <rect x="30" y="44" width="100" height="44" fill="#FDBA74" stroke="#EA580C" stroke-width="2"/>
  </g>
  <g class="op-grp op-pick-b">
    <rect x="30" y="100" width="75" height="44" fill="#93C5FD" stroke="#2563EB" stroke-width="2"/>
  </g>

  <!-- 1/3 dan 1/4 -->
  <g class="op-frac">
    <text x="80" y="60" class="op-fr">1</text>
    <line x1="72" y1="65" x2="88" y2="65" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <text x="80" y="81" class="op-fr">3</text>

    <text x="67.5" y="116" class="op-fr">1</text>
    <line x1="59.5" y1="121" x2="75.5" y2="121" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <text x="67.5" y="137" class="op-fr">4</text>
  </g>

  <!-- Potongannya tidak sama besar -->
  <g class="op-beda">
    <line x1="105" y1="44" x2="105" y2="144" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="130" y1="44" x2="130" y2="144" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- Total -->
  <g class="op-beda">
    <rect x="40" y="172" width="280" height="82" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="180" y="192" class="op-cap">Potongannya tidak sama besar!</text>
  </g>
  <g class="op-total">

    <text x="120" y="219" class="op-eq op-eq-a">1</text>
    <line x1="108" y1="225" x2="132" y2="225" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <text x="120" y="245" class="op-eq op-eq-a">3</text>

    <text x="155" y="232" class="op-eq-t">+</text>

    <text x="190" y="219" class="op-eq op-eq-b">1</text>
    <line x1="178" y1="225" x2="202" y2="225" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <text x="190" y="245" class="op-eq op-eq-b">4</text>

    <text x="225" y="232" class="op-eq-t">=</text>
    <text x="255" y="234" class="op-eq-t">?</text>
  </g>
</svg>
