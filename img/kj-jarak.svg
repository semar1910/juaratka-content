<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 214" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.kj-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes kj-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes kj-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes kj-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes kj-tampak { from{opacity:0} to{opacity:1} }
@keyframes kj-hilang { to{opacity:0} }
@keyframes kj-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes kj-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="kj-"] { animation:none !important; } }
</style>
<rect width="360" height="214" fill="#FFFFFF"/>
<line x1="20" y1="70" x2="340" y2="70" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round"/><line x1="22" y1="70" x2="98" y2="70" stroke="#EA580C" stroke-width="10" style="--p:76;stroke-dasharray:76;animation:kj-garis 0.4s linear 0.3s both"/><text class="" x="60.0" y="98" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C;animation:kj-muncul 0.4s ease-out 0.5s both;">35</text><line x1="102" y1="70" x2="178" y2="70" stroke="#FDBA74" stroke-width="10" style="--p:76;stroke-dasharray:76;animation:kj-garis 0.4s linear 0.75s both"/><text class="" x="140.0" y="98" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C;animation:kj-muncul 0.4s ease-out 0.95s both;">35</text><line x1="182" y1="70" x2="258" y2="70" stroke="#EA580C" stroke-width="10" style="--p:76;stroke-dasharray:76;animation:kj-garis 0.4s linear 1.2s both"/><text class="" x="220.0" y="98" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C;animation:kj-muncul 0.4s ease-out 1.4s both;">35</text><line x1="262" y1="70" x2="338" y2="70" stroke="#FDBA74" stroke-width="10" style="--p:76;stroke-dasharray:76;animation:kj-garis 0.4s linear 1.6500000000000001s both"/><text class="" x="300.0" y="98" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C;animation:kj-muncul 0.4s ease-out 1.85s both;">35</text><path d="M20 116 v8 h320 v-8" fill="none" stroke="#334155" stroke-width="2" style="animation:kj-tampak 0.3s ease-out 2.3s both;"/><text class="" x="180" y="146" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#334155;animation:kj-muncul 0.4s ease-out 2.6s both;">4 × 35 = 140 km</text><g class="kj-pop" style="animation:kj-zoom .45s ease-out 3.3s both, kj-kedut .5s ease-in-out 3.8s 1;"><rect x="40" y="162" width="280" height="38" rx="12" fill="#FFF7ED" stroke="#EA580C"/><text class="" x="180" y="187" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#EA580C;">jarak = kecepatan × waktu</text></g>
</svg>