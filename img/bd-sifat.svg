<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bd-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes bd-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes bd-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes bd-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes bd-tampak { from{opacity:0} to{opacity:1} }
@keyframes bd-redup { to{opacity:.12} }
@keyframes bd-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@media (prefers-reduced-motion: reduce){ [class*="bd-"] { animation:none !important; } }
</style>
<rect width="360" height="180" fill="#FFFFFF"/>
<polygon points="16,110 86,110 110,60 40,60" fill="#F8FAFC" stroke="#334155" stroke-width="2"/><path d="M48 106 l5 4 l-5 4" fill="none" stroke="#2563EB" stroke-width="2.2" class="bd-pop" style="animation:bd-zoom .45s ease-out 0.5s both, bd-kedut .5s ease-in-out 1.0s 2;"/><path d="M72 56 l5 4 l-5 4" fill="none" stroke="#2563EB" stroke-width="2.2" class="bd-pop" style="animation:bd-zoom .45s ease-out 0.5s both, bd-kedut .5s ease-in-out 1.0s 2;"/><text class="" x="63" y="136" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#334155;">jajar genjang</text><text class="" x="63" y="154" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#2563EB;animation:bd-muncul 0.4s ease-out 0.9s both;">sisi hadap sejajar</text><polygon points="180,44 216,84 180,124 144,84" fill="#F8FAFC" stroke="#334155" stroke-width="2"/><line x1="202.5" y1="60.0" x2="193.5" y2="68.0" stroke="#EA580C" stroke-width="2.5" class="bd-pop" style="animation:bd-zoom .45s ease-out 1.6s both, bd-kedut .5s ease-in-out 2.1s 1;"/><line x1="202.5" y1="108.0" x2="193.5" y2="100.0" stroke="#EA580C" stroke-width="2.5" class="bd-pop" style="animation:bd-zoom .45s ease-out 1.8s both, bd-kedut .5s ease-in-out 2.3s 1;"/><line x1="157.5" y1="108.0" x2="166.5" y2="100.0" stroke="#EA580C" stroke-width="2.5" class="bd-pop" style="animation:bd-zoom .45s ease-out 2.0s both, bd-kedut .5s ease-in-out 2.5s 1;"/><line x1="157.5" y1="60.0" x2="166.5" y2="68.0" stroke="#EA580C" stroke-width="2.5" class="bd-pop" style="animation:bd-zoom .45s ease-out 2.2s both, bd-kedut .5s ease-in-out 2.7s 1;"/><line x1="180" y1="44" x2="180" y2="124" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4 3" style="animation:bd-tampak 0.3s ease-out 2.6s both;"/><line x1="144" y1="84" x2="216" y2="84" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4 3" style="animation:bd-tampak 0.3s ease-out 2.6s both;"/><text class="" x="180" y="144" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#334155;">belah ketupat</text><text class="" x="180" y="162" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#EA580C;animation:bd-muncul 0.4s ease-out 2.4s both;">4 sisi sama panjang</text><polygon points="296,40 326,70 296,130 266,70" fill="#F8FAFC" stroke="#334155" stroke-width="2"/><line x1="315.2" y1="50.8" x2="306.8" y2="59.2" stroke="#EA580C" stroke-width="2.5" class="bd-pop" style="animation:bd-zoom .45s ease-out 3.2s both, bd-kedut .5s ease-in-out 3.7s 1;"/><line x1="276.8" y1="50.8" x2="285.2" y2="59.2" stroke="#EA580C" stroke-width="2.5" class="bd-pop" style="animation:bd-zoom .45s ease-out 3.2s both, bd-kedut .5s ease-in-out 3.7s 1;"/><line x1="316.4" y1="102.7" x2="305.6" y2="97.3" stroke="#2563EB" stroke-width="2.5" class="bd-pop" style="animation:bd-zoom .45s ease-out 3.8s both, bd-kedut .5s ease-in-out 4.3s 1;"/><line x1="275.6" y1="102.7" x2="286.4" y2="97.3" stroke="#2563EB" stroke-width="2.5" class="bd-pop" style="animation:bd-zoom .45s ease-out 3.8s both, bd-kedut .5s ease-in-out 4.3s 1;"/><text class="" x="296" y="150" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#334155;">layang-layang</text><text class="" x="296" y="168" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#EA580C;animation:bd-muncul 0.4s ease-out 4.2s both;">2 pasang sisi sama</text>
</svg>