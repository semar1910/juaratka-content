<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bd-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes bd-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes bd-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes bd-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes bd-tampak { from{opacity:0} to{opacity:1} }
@keyframes bd-redup { to{opacity:.12} }
@keyframes bd-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@media (prefers-reduced-motion: reduce){ [class*="bd-"] { animation:none !important; } }
</style>
<rect width="360" height="230" fill="#FFFFFF"/>
<polygon points="75,20 285,20 285,140" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" style="animation:bd-redup .6s ease-out 1.8s forwards"/><polygon points="75,20 285,140 75,140" fill="#FED7AA" stroke="#EA580C" stroke-width="2.5"/><line x1="75" y1="20" x2="285" y2="140" stroke="#DC2626" stroke-width="3" stroke-linecap="round" style="--p:242;stroke-dasharray:242;animation:bd-garis 0.7s linear 0.6s both"/><line x1="67" y1="20" x2="67" y2="140" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" class="bd-pop" style="animation:bd-zoom .45s ease-out 2.6s both, bd-kedut .5s ease-in-out 3.1s 2;"/><text class="" x="61" y="85.0" text-anchor="end" style="font-size:13px;font-weight:800;fill:#2563EB;animation:bd-muncul 0.4s ease-out 2.6s both;">t = 4</text><text class="" x="180.0" y="162" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#EA580C;animation:bd-muncul 0.4s ease-out 2.6s both;">alas = 7</text><text class="" x="180" y="190" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#64748B;animation:bd-muncul 0.4s ease-out 3.4s both;">segitiga = setengah persegi panjang</text><text class="" x="180" y="216" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#EA580C;animation:bd-muncul 0.4s ease-out 4s both;">½ × 7 × 4 = 14</text>
</svg>