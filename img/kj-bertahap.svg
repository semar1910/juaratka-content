<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 246" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.kj-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes kj-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes kj-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes kj-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes kj-tampak { from{opacity:0} to{opacity:1} }
@keyframes kj-hilang { to{opacity:0} }
@keyframes kj-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes kj-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="kj-"] { animation:none !important; } }
</style>
<rect width="360" height="246" fill="#FFFFFF"/>
<line x1="30" y1="96" x2="330" y2="96" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/><line x1="30" y1="96" x2="180" y2="96" stroke="#EA580C" stroke-width="10" style="--p:150;stroke-dasharray:150;animation:kj-garis 1s linear 0.4s both"/><line x1="180" y1="96" x2="330" y2="96" stroke="#2563EB" stroke-width="10" style="--p:150;stroke-dasharray:150;animation:kj-garis 1s linear 2.6s both"/><circle cx="30" cy="96" r="8" fill="#fff" stroke="#334155" stroke-width="3"/><text class="" x="22" y="78" text-anchor="start" style="font-size:12px;font-weight:800;fill:#334155;">berangkat</text><circle cx="180" cy="96" r="8" fill="#fff" stroke="#DC2626" stroke-width="3"/><text class="" x="180" y="78" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#DC2626;">singgah</text><circle cx="330" cy="96" r="8" fill="#fff" stroke="#334155" stroke-width="3"/><text class="" x="338" y="78" text-anchor="end" style="font-size:12px;font-weight:800;fill:#334155;">tujuan</text><text class="" x="105.0" y="120" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#EA580C;animation:kj-muncul 0.4s ease-out 0.9s both;">tahap 1: 2 jam</text><text class="" x="255.0" y="120" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#2563EB;animation:kj-muncul 0.4s ease-out 3.1s both;">tahap 2: 1 jam</text><text class="" x="30" y="150" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#334155;">14.20</text><text class="" x="154" y="150" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#EA580C;animation:kj-muncul 0.4s ease-out 1.6s both;">16.20</text><text class="" x="206" y="150" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#DC2626;animation:kj-muncul 0.4s ease-out 2.2s both;">16.50</text><text class="" x="180" y="168" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#DC2626;animation:kj-muncul 0.4s ease-out 2.2s both;">+30 menit singgah</text><text class="kj-pop" x="330" y="150" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#16A34A;animation:kj-zoom .45s ease-out 3.8s both, kj-kedut .5s ease-in-out 4.3s 1;">17.50</text><g style="animation:kj-muncul 0.4s ease-out 4.6s both;"><rect x="20" y="184" width="320" height="50" rx="11" fill="#F8FAFC" stroke="#CBD5E1"/><text class="" x="180" y="204" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#334155;">hitung per tahap, jangan lupa waktu singgah</text><text class="" x="180" y="224" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#EA580C;">sisa jarak = jarak total − jarak tahap 1</text></g>
</svg>