<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.ks-pop { transform-box:fill-box; transform-origin:50% 50%; }
.ks-dig { font-size:28px; font-weight:800; fill:#334155; text-anchor:middle; }
.ks-ket { font-size:13px; font-weight:600; fill:#64748B; text-anchor:middle; }
@keyframes ks-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes ks-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes ks-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes ks-hilang { to{opacity:0} }
@media (prefers-reduced-motion: reduce){ [class*="ks-"] { animation:none !important; } }

.ks-bola { animation: ks-lompat 4.4s ease-in-out .6s both; }
@keyframes ks-lompat {
 0%,12%{transform:translate(0,0)} 18%{transform:translate(39px,-18px)} 24%,37%{transform:translate(78px,34px)}
 43%{transform:translate(117px,16px)} 49%,62%{transform:translate(156px,68px)}
 68%{transform:translate(195px,50px)} 74%,100%{transform:translate(234px,102px)} }
</style>
<rect width="360" height="210" fill="#FFFFFF"/>
<rect x="22" y="50" width="78" height="150" fill="#DBEAFE" stroke="#94A3B8"/><text x="61.0" y="76" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#334155">kg</text><rect x="100" y="84" width="78" height="116" fill="#E0E7FF" stroke="#94A3B8"/><text x="139.0" y="110" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#334155">hg</text><rect x="178" y="118" width="78" height="82" fill="#EDE9FE" stroke="#94A3B8"/><text x="217.0" y="144" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#334155">dag</text><rect x="256" y="152" width="78" height="48" fill="#FCE7F3" stroke="#94A3B8"/><text x="295.0" y="178" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#334155">g</text><g class="ks-pop" style="animation:ks-zoom .45s ease-out 1.7s both, ks-kedut .5s ease-in-out 2.2s 1;"><rect x="80" y="52" width="40" height="22" rx="11" fill="#EA580C"/><text x="100" y="68" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#fff">× 10</text></g><g class="ks-pop" style="animation:ks-zoom .45s ease-out 2.8s both, ks-kedut .5s ease-in-out 3.3s 1;"><rect x="158" y="86" width="40" height="22" rx="11" fill="#EA580C"/><text x="178" y="102" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#fff">× 10</text></g><g class="ks-pop" style="animation:ks-zoom .45s ease-out 3.9s both, ks-kedut .5s ease-in-out 4.4s 1;"><rect x="236" y="120" width="40" height="22" rx="11" fill="#EA580C"/><text x="256" y="136" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#fff">× 10</text></g><circle class="ks-bola" cx="61.0" cy="36" r="11" fill="#2563EB"/><text x="340" y="30" text-anchor="end" style="font-size:12px;font-weight:700;fill:#EA580C;animation:ks-muncul 0.4s ease-out 5s both;">turun 1 anak tangga = × 10</text><text x="340" y="48" text-anchor="end" style="font-size:12px;font-weight:700;fill:#2563EB;animation:ks-muncul 0.4s ease-out 5.6s both;">naik 1 anak tangga = ÷ 10</text>
</svg>