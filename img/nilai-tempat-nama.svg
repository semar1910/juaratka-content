<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.nt-sel { fill:none; stroke:#CBD5E1; stroke-width:1.5; }
.nt-dig { font-size:30px; font-weight:800; fill:#334155; text-anchor:middle; }
.nt-lbl { font-size:10px; font-weight:600; fill:#64748B; text-anchor:middle; }
.nt-ket { font-size:12px; font-weight:600; fill:#64748B; }
.nt-pop { transform-box:fill-box; transform-origin:50% 50%; }
.nt-o { fill:#EA580C; } .nt-b { fill:#2563EB; }
@keyframes nt-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.35) rotate(-6deg)} 65%{transform:scale(1.2) rotate(5deg)} }
@keyframes nt-zoom { 0%{opacity:0;transform:scale(.6)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes nt-muncul { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
@media (prefers-reduced-motion: reduce){ [class*="nt-"] { animation:none !important; opacity:1 !important; } }
.nt-nm { opacity:0; animation:nt-muncul .4s ease-out forwards; font-size:11px; fill:#334155; font-weight:700; }
.nt-n0{animation-delay:2.65s}
.nt-n1{animation-delay:2.20s}
.nt-n2{animation-delay:1.75s}
.nt-n3{animation-delay:1.30s}
.nt-n4{animation-delay:0.85s}
.nt-n5{animation-delay:0.40s}
</style>
<rect width="360" height="190" fill="#FFFFFF"/>
<rect class="nt-sel" x="30" y="40" width="50" height="50"/><rect class="nt-sel" x="80" y="40" width="50" height="50"/><rect class="nt-sel" x="130" y="40" width="50" height="50"/><rect class="nt-sel" x="180" y="40" width="50" height="50"/><rect class="nt-sel" x="230" y="40" width="50" height="50"/><rect class="nt-sel" x="280" y="40" width="50" height="50"/><line x1="180" y1="36" x2="180" y2="94" stroke="#94A3B8" stroke-width="3"/><text class="nt-lbl nt-nm nt-n0" x="55.0" y="110"><tspan x="55.0">ratus</tspan><tspan x="55.0" dy="13">ribuan</tspan></text><text class="nt-lbl nt-nm nt-n0" x="55.0" y="72" style="font-size:18px;fill:#CBD5E1">6</text><text class="nt-lbl nt-nm nt-n1" x="105.0" y="110"><tspan x="105.0">puluh</tspan><tspan x="105.0" dy="13">ribuan</tspan></text><text class="nt-lbl nt-nm nt-n1" x="105.0" y="72" style="font-size:18px;fill:#CBD5E1">5</text><text class="nt-lbl nt-nm nt-n2" x="155.0" y="116">ribuan</text><text class="nt-lbl nt-nm nt-n2" x="155.0" y="72" style="font-size:18px;fill:#CBD5E1">4</text><text class="nt-lbl nt-nm nt-n3" x="205.0" y="116">ratusan</text><text class="nt-lbl nt-nm nt-n3" x="205.0" y="72" style="font-size:18px;fill:#CBD5E1">3</text><text class="nt-lbl nt-nm nt-n4" x="255.0" y="116">puluhan</text><text class="nt-lbl nt-nm nt-n4" x="255.0" y="72" style="font-size:18px;fill:#CBD5E1">2</text><text class="nt-lbl nt-nm nt-n5" x="305.0" y="116">satuan</text><text class="nt-lbl nt-nm nt-n5" x="305.0" y="72" style="font-size:18px;fill:#CBD5E1">1</text><defs><marker id="p" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2563EB"/></marker></defs>
<path d="M322 150 H40" stroke="#2563EB" stroke-width="2" marker-end="url(#p)"/>
<text class="nt-ket" x="330" y="172" text-anchor="end" style="fill:#2563EB">mulai dari kanan</text>
</svg>