<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 216" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.ks-pop { transform-box:fill-box; transform-origin:50% 50%; }
.ks-dig { font-size:28px; font-weight:800; fill:#334155; text-anchor:middle; }
.ks-ket { font-size:13px; font-weight:600; fill:#64748B; text-anchor:middle; }
@keyframes ks-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes ks-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes ks-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes ks-hilang { to{opacity:0} }
@media (prefers-reduced-motion: reduce){ [class*="ks-"] { animation:none !important; } }

.ks-geser { animation: ks-geser 3.6s ease-in-out .6s both; }
@keyframes ks-geser { 0%,15%{transform:translateX(0)} 25%,45%{transform:translateX(-60px)} 55%,75%{transform:translateX(-120px)} 85%,100%{transform:translateX(-180px)} }
</style>
<rect width="360" height="216" fill="#FFFFFF"/>
<rect x="75.0" y="40" width="60" height="60" fill="none" stroke="#CBD5E1" stroke-width="1.5"/><rect x="135.0" y="40" width="60" height="60" fill="none" stroke="#CBD5E1" stroke-width="1.5"/><rect x="195.0" y="40" width="60" height="60" fill="none" stroke="#CBD5E1" stroke-width="1.5"/><rect x="255.0" y="40" width="60" height="60" fill="none" stroke="#CBD5E1" stroke-width="1.5"/><text x="105" y="118" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#94A3B8">ribuan</text><text x="165" y="118" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#94A3B8">ratusan</text><text x="225" y="118" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#94A3B8">puluhan</text><text x="285" y="118" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#94A3B8">satuan</text><text class="ks-dig ks-geser" x="285" y="82" style="font-size:34px;fill:#EA580C">1</text><text class="ks-dig ks-pop" x="285" y="82" style="font-size:34px;fill:#2563EB;animation:ks-zoom .45s ease-out 1.6s both, ks-kedut .5s ease-in-out 2.1s 1;">0</text><text class="ks-dig ks-pop" x="225" y="82" style="font-size:34px;fill:#2563EB;animation:ks-zoom .45s ease-out 2.7s both, ks-kedut .5s ease-in-out 3.2s 1;">0</text><text class="ks-dig ks-pop" x="165" y="82" style="font-size:34px;fill:#2563EB;animation:ks-zoom .45s ease-out 3.7s both, ks-kedut .5s ease-in-out 4.2s 1;">0</text><text x="324" y="80" style="font-size:18px;font-weight:800;fill:#334155;animation:ks-muncul .3s ease-out 0s both, ks-hilang .2s ease-in 1.5s forwards">kg</text><text x="324" y="80" style="font-size:18px;font-weight:800;fill:#334155;animation:ks-muncul .3s ease-out 1.5s both, ks-hilang .2s ease-in 2.6s forwards">hg</text><text x="324" y="80" style="font-size:18px;font-weight:800;fill:#334155;animation:ks-muncul .3s ease-out 2.6s both, ks-hilang .2s ease-in 3.6s forwards">dag</text><text x="324" y="80" style="font-size:18px;font-weight:800;fill:#334155;animation:ks-muncul .3s ease-out 3.6s both">g</text><g style="animation:ks-muncul 0.4s ease-out 4.6s both;"><rect x="30" y="136" width="300" height="42" rx="12" fill="#FFF7ED" stroke="#EA580C"/><text x="180" y="163" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#334155">1 kg = 1.000 g → cukup untuk 600 g!</text></g><text x="180" y="204" class="ks-ket" style="animation:ks-muncul 0.4s ease-out 5.4s both;">turun 3 tangga = geser 3 kotak ke kiri</text>
</svg>