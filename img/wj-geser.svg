<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 212" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.wj-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes wj-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes wj-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes wj-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes wj-tampak { from{opacity:0} to{opacity:1} }
@keyframes wj-hilang { to{opacity:0} }
@keyframes wj-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes wj-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="wj-"] { animation:none !important; } }
.wj-geser { animation: wj-geser 1.4s ease-in-out 1.4s both; }
@keyframes wj-geser { from{transform:translateX(0)} to{transform:translateX(-40.0px)} }
</style>
