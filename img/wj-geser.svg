="24" y="111" text-anchor="start" style="font-size:10px;font-weight:700;fill:#64748B;animation:wj-muncul 0.4s ease-out 2.9s both;">besok</text><text class="" x="53.33333333333333" y="136" text-anchor="middle" style="font-size:11.5px;font-weight:800;fill:#EA580C;animation:wj-muncul 0.4s ease-out 2.9s both;">07.25</text><text class="wj-pop" x="226.66666666666666" y="136" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#EA580C;animation:wj-zoom .45s ease-out 3.1s both, wj-kedut .5s ease-in-out 3.6s 2;">09.35</text><text class="" x="180" y="88" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#EA580C;animation:wj-muncul 0.4s ease-out 0.8s both;">← 30 menit lebih awal</text><text class="" x="180" y="198" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#334155;animation:wj-muncul 0.4s ease-out 3.8s both;">lama perjalanan tetap, jam tiba ikut maju</text>
