<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 214" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sd-pop { transform-box:fill-box; transform-origin:50% 50%; }
@keyframes sd-kedut { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.3) rotate(-6deg)} 65%{transform:scale(1.15) rotate(5deg)} }
@keyframes sd-zoom { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.12)} 100%{opacity:1;transform:scale(1)} }
@keyframes sd-muncul { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes sd-tampak { from{opacity:0} to{opacity:1} }
@keyframes sd-hilang { to{opacity:0} }
@keyframes sd-garis { from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0} }
@keyframes sd-lebar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media (prefers-reduced-motion: reduce){ [class*="sd-"] { animation:none !important; } }
</style>
<rect width="360" height="214" fill="#FFFFFF"/>
<rect x="60" y="20" width="240" height="140" fill="#fff" stroke="#334155" stroke-width="1.5"/><rect x="60" y="20" width="240" height="28" fill="#F1F5F9"/><text class="" x="135.0" y="39" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#334155;">kendaraan</text><text class="" x="255.0" y="39" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#334155;">banyak siswa</text><rect class="sd-pop" x="62" y="50" width="236" height="24" rx="4" fill="#FEF3C7" stroke="#CA8A04" stroke-width="2" style="animation:sd-zoom .45s ease-out 0.6s both, sd-kedut .5s ease-in-out 1.1s 2;"/><line x1="60" y1="48" x2="300" y2="48" stroke="#CBD5E1"/><text class="" x="135.0" y="67" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#EA580C;">jalan kaki</text><text class="" x="255.0" y="67" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;">7</text><line x1="60" y1="76" x2="300" y2="76" stroke="#CBD5E1"/><text class="" x="135.0" y="95" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#2563EB;">sepeda</text><text class="" x="255.0" y="95" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;">5</text><line x1="60" y1="104" x2="300" y2="104" stroke="#CBD5E1"/><text class="" x="135.0" y="123" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#16A34A;">motor</text><text class="" x="255.0" y="123" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;">6</text><line x1="60" y1="132" x2="300" y2="132" stroke="#CBD5E1"/><text class="" x="135.0" y="151" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#7C3AED;">angkot</text><text class="" x="255.0" y="151" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;">2</text><line x1="210" y1="20" x2="210" y2="160" stroke="#CBD5E1"/><text class="" x="180" y="176" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#334155;animation:sd-muncul 0.4s ease-out 1.4s both;">frekuensi terbesar = 7</text><text class="" x="180" y="200" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#A16207;animation:sd-muncul 0.4s ease-out 1.9s both;">paling sering muncul: jalan kaki</text>
</svg>