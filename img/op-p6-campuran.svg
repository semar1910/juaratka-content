<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 232" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .op-big { font-size: 26px; font-weight: 800; fill: #334155; text-anchor: middle; }
    .op-nf { font-size: 15px; font-weight: 800; fill: #334155; text-anchor: middle; }
    .op-n2 { font-size: 18px; font-weight: 800; text-anchor: middle; }
    .op-sym { font-size: 18px; font-weight: 800; fill: #334155; text-anchor: middle; }
    .op-ket { font-size: 11px; font-weight: 600; fill: #64748B; text-anchor: middle; }
    .op-lbl { font-size: 12px; font-weight: 700; text-anchor: middle; }
    .op-c-a { fill: #EA580C; }
    .op-c-b { fill: #2563EB; }
    .op-c-t { fill: #334155; }
    .op-cut { stroke: #EA580C; stroke-width: 1.5; stroke-dasharray: 44; animation: op-garis .25s ease-out both; }
    .op-num { font-size: 13px; font-weight: 800; fill: #334155; text-anchor: middle; animation: op-muncul .3s ease-out both; }
    .op-grp { transform-box: fill-box; transform-origin: 50% 50%; }
    .op-t-utuh { animation: op-muncul .4s ease-out .2s both; }
    .op-t-sepertiga { animation: op-muncul .4s ease-out .6s both; }
    .op-t-enam { animation: op-muncul .3s ease-out 2.9s both, op-kedut .3s ease-in-out 3.2s 3; }
    .op-n7 { animation: op-muncul .3s ease-out 3.6s both; }
    .op-t-satu { animation: op-muncul .3s ease-out 3.7s both, op-kedut .3s ease-in-out 3.9s 3; }
    .op-hasil { animation: op-muncul .4s ease-out 4.9s both; }
    @keyframes op-muncul { from { opacity: 0; } to { opacity: 1; } }
    @keyframes op-garis { from { stroke-dashoffset: 44; } to { stroke-dashoffset: 0; } }
    @keyframes op-kedut {
      0%, 100% { transform: scale(1) rotate(0); }
      35% { transform: scale(1.08) rotate(-2deg); }
      65% { transform: scale(1.04) rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce){ [class*="op-"] { animation: none !important; } }
  </style>

  <rect width="360" height="232" fill="#FFFFFF"/>

  <!-- Bilangan campuran 2 1/3 -->
  <text x="168" y="44" class="op-big">2</text>
  <text x="194" y="33" class="op-nf op-c-b">1</text><line x1="185" y1="38" x2="203" y2="38" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="194" y="53" class="op-nf op-c-b">3</text>
  <text x="180" y="72" class="op-ket">Bilangan campuran</text>

  <!-- 2 pita utuh (oranye) -->
  <rect x="30" y="84" width="96" height="44" fill="#FED7AA" stroke="#EA580C" stroke-width="2"/>
  <rect x="132" y="84" width="96" height="44" fill="#FED7AA" stroke="#EA580C" stroke-width="2"/>
  <!-- pita ke-3: dibagi 3, 1 potong biru -->
  <rect x="234" y="84" width="96" height="44" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <rect x="234" y="84" width="32" height="44" fill="#93C5FD" stroke="#2563EB" stroke-width="2"/>
  <line x1="266" y1="84" x2="266" y2="128" stroke="#93C5FD" stroke-width="2"/>
  <line x1="298" y1="84" x2="298" y2="128" stroke="#93C5FD" stroke-width="2"/>

  <text x="129" y="146" class="op-lbl op-c-a op-t-utuh">2 pita utuh</text>
  <text x="282" y="146" class="op-lbl op-c-b op-t-sepertiga">1 dari 3 potong</text>

  <!-- Garis potong baru -->
  <line class="op-cut" style="animation-delay:1.0s" x1="62" y1="84" x2="62" y2="128"/>
  <line class="op-cut" style="animation-delay:1.15s" x1="94" y1="84" x2="94" y2="128"/>
  <line class="op-cut" style="animation-delay:1.3s" x1="164" y1="84" x2="164" y2="128"/>
  <line class="op-cut" style="animation-delay:1.45s" x1="196" y1="84" x2="196" y2="128"/>

  <!-- Hitung potongan -->
  <text class="op-num" style="animation-delay:2.00s" x="46" y="110">1</text>
  <text class="op-num" style="animation-delay:2.15s" x="78" y="110">2</text>
  <text class="op-num" style="animation-delay:2.30s" x="110" y="110">3</text>
  <text class="op-num" style="animation-delay:2.45s" x="148" y="110">4</text>
  <text class="op-num" style="animation-delay:2.60s" x="180" y="110">5</text>
  <text class="op-num" style="animation-delay:2.75s" x="212" y="110">6</text>
  <text class="op-num op-n7" x="250" y="110">7</text>

  <g class="op-grp op-t-enam"><text x="120" y="172" class="op-lbl op-c-a" style="font-size:13px">2 × 3 = 6 potong</text></g>
  <g class="op-grp op-t-satu"><text x="282" y="172" class="op-lbl op-c-b" style="font-size:13px">+ 1 potong</text></g>

  <!-- 2 1/3 = 7/3 -->
  <g class="op-hasil">
    <rect x="40" y="184" width="280" height="42" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="118" y="212" class="op-n2 op-c-t">2</text>
    <text x="140" y="199" class="op-n2 op-c-b">1</text><line x1="131" y1="204" x2="149" y2="204" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><text x="140" y="221" class="op-n2 op-c-b">3</text>
    <text x="180" y="212" class="op-sym">=</text>
    <text x="222" y="199" class="op-n2 op-c-t">7</text><line x1="213" y1="204" x2="231" y2="204" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><text x="222" y="221" class="op-n2 op-c-t">3</text>
  </g>
</svg>
