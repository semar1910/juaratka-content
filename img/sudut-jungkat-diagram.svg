<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="400" height="290" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Papan jungkat-jungkit dan tiang penyangga membentuk dua sudut berpelurus</title>

  <!-- ================= LAPISAN DASAR: selalu tampil ================= -->
  <g id="dasar">
    <!-- tanah -->
    <line x1="30" y1="250" x2="370" y2="250" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#CBD5E1" stroke-width="3" stroke-linecap="round">
      <line x1="46" y1="250" x2="36" y2="262"/>
      <line x1="86" y1="250" x2="76" y2="262"/>
      <line x1="126" y1="250" x2="116" y2="262"/>
      <line x1="166" y1="250" x2="156" y2="262"/>
      <line x1="206" y1="250" x2="196" y2="262"/>
      <line x1="246" y1="250" x2="236" y2="262"/>
      <line x1="286" y1="250" x2="276" y2="262"/>
      <line x1="326" y1="250" x2="316" y2="262"/>
    </g>

    <!-- tiang penyangga -->
    <line x1="200" y1="150" x2="200" y2="250" stroke="#64748B" stroke-width="9" stroke-linecap="round"/>

    <!-- papan (satu garis lurus melewati titik tumpu) -->
    <line id="papan" x1="85.1" y1="53.6" x2="314.9" y2="246.4"
          stroke="#B45309" stroke-width="11" stroke-linecap="round"/>

    <!-- titik tumpu -->
    <circle cx="200" cy="150" r="6" fill="#1E293B"/>
  </g>

  <!-- ================= TAHAP 1: papan itu SATU garis lurus ================= -->
  <!-- app: set opacity 1 saat langkah 1 dibacakan -->
  <g id="tahap1" opacity="0">
    <line x1="85.1" y1="53.6" x2="314.9" y2="246.4"
          stroke="#FACC15" stroke-width="19" stroke-linecap="round" opacity="0.55"/>
    <text x="200" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#B45309">
      satu garis lurus = 180&#176;
    </text>
  </g>

  <!-- ================= TAHAP 2: sudut yang sudah diketahui ================= -->
  <g id="tahap2" opacity="0">
    <!-- juring 130 derajat, dari arah papan kiri-atas ke arah tiang bawah -->
    <path d="M 200 150 L 165.5 121.1 A 45 45 0 0 0 200 195 Z" fill="#0EA5E9" fill-opacity="0.16"/>
    <path d="M 165.5 121.1 A 45 45 0 0 0 200 195" fill="none" stroke="#0EA5E9" stroke-width="3.5"/>
    <text x="138" y="185" text-anchor="middle" font-size="20" font-weight="700" fill="#0369A1">130&#176;</text>
  </g>

  <!-- ================= TAHAP 3: sudut yang dicari ================= -->
  <g id="tahap3" opacity="0">
    <!-- juring sudut yang ditanya, dari arah tiang bawah ke arah papan kanan-bawah -->
    <path d="M 200 150 L 200 205 A 55 55 0 0 0 242.2 185.4 Z" fill="#E9A21B" fill-opacity="0.18"/>
    <path d="M 200 205 A 55 55 0 0 0 242.2 185.4" fill="none" stroke="#E9A21B" stroke-width="3.5"/>
    <text x="238" y="232" text-anchor="middle" font-size="22" font-weight="700" fill="#B87A0B">?</text>
  </g>
</svg>
