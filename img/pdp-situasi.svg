<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="360" height="220" fill="#FFFFFF"/>
<defs>
<g id="pdp-toko">
<rect x="0" y="108" width="120" height="82" fill="#F8FAFC" stroke="currentColor" stroke-width="2"/>
<rect x="10" y="122" width="26" height="26" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/>
<rect x="84" y="122" width="26" height="26" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/>
<rect x="48" y="140" width="24" height="50" fill="currentColor" opacity=".85"/>
<rect x="0" y="88" width="120" height="20" fill="currentColor"/>
<rect x="30" y="88" width="30" height="20" fill="#FFFFFF" opacity=".35"/>
<rect x="90" y="88" width="30" height="20" fill="#FFFFFF" opacity=".35"/>
</g>
</defs>
<style>
.pdp-t{font-weight:700;fill:#FFFFFF}
.pdp-a{color:#EA580C}
.pdp-b{color:#7C3AED}
.pdp-msk{transform-box:fill-box;transform-origin:50% 50%;animation:pdp-masuk .5s ease-out .3s both}
.pdp-m1{transform-box:fill-box;transform-origin:50% 50%;animation:pdp-muncul .4s ease-out .9s both}
.pdp-m2{transform-box:fill-box;transform-origin:50% 50%;animation:pdp-muncul .4s ease-out 1.5s both}
.pdp-m3{transform-box:fill-box;transform-origin:50% 50%;animation:pdp-muncul .4s ease-out 2s both}
.pdp-q{transform-box:fill-box;transform-origin:50% 50%;animation:pdp-kedut .7s ease-in-out 2.3s 3}
@keyframes pdp-masuk{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes pdp-kedut{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.3) rotate(-6deg)}65%{transform:scale(1.15) rotate(5deg)}}
@keyframes pdp-zoom{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes pdp-muncul{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ [class*="pdp-"] { animation:none !important; } }
</style>
<line x1="10" y1="190" x2="350" y2="190" stroke="#CBD5E1" stroke-width="2"/>
<g class="pdp-msk"><use href="#pdp-toko" class="pdp-a" x="25" y="0"/></g>
<g class="pdp-m1">
<rect x="25" y="24" width="120" height="56" rx="8" fill="#EA580C"/>
<text class="pdp-t" x="33" y="56" font-size="13">DISKON</text>
<text class="pdp-t" x="118" y="46" font-size="14" text-anchor="middle">9</text>
<line x1="106" y1="51" x2="130" y2="51" stroke="#FFFFFF" stroke-width="2"/>
<text class="pdp-t" x="118" y="67" font-size="14" text-anchor="middle">25</text>
</g>
<g class="pdp-m2">
<use href="#pdp-toko" class="pdp-b" x="215" y="0"/>
<rect x="215" y="24" width="120" height="56" rx="8" fill="#7C3AED"/>
<text class="pdp-t" x="223" y="56" font-size="13">DISKON</text>
<text class="pdp-t" x="283" y="57" font-size="16">16%</text>
</g>
<g class="pdp-m3">
<g class="pdp-q">
<circle cx="180" cy="140" r="24" fill="#FEF9C3"/>
<text x="180" y="152" font-size="34" font-weight="700" text-anchor="middle" fill="#F59E0B">?</text>
</g>
</g>
<text class="pdp-m1" x="85" y="209" font-size="12" text-anchor="middle" fill="#64748B">Toko A</text>
<text class="pdp-m2" x="275" y="209" font-size="12" text-anchor="middle" fill="#64748B">Toko B</text>
</svg>
