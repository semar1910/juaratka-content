<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .op-seg { animation: op-muncul .3s ease-out both; }
    .op-ket { font-size: 13px; font-weight: 600; fill: #64748B; text-anchor: middle; animation: op-muncul .4s ease-out 1s both; }
    .op-lbl { font-size: 12px; font-weight: 700; text-anchor: middle; }
    .op-a-t { fill: #EA580C; }
    .op-b-t { fill: #2563EB; }
    .op-grp { transform-box: fill-box; transform-origin: 50% 50%; }
    .op-a { animation: op-muncul .4s ease-out 1.4s both, op-kedut .4s ease-in-out 1.8s 3; }
    .op-b { animation: op-muncul .4s ease-out 3.1s both, op-kedut .4s ease-in-out 3.5s 3; }
    .op-total { animation: op-muncul .4s ease-out 4.9s both; }
    .op-hasil { font-size: 22px; font-weight: 800; fill: #334155; text-anchor: middle; }
    @keyframes op-muncul {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes op-kedut {
      0%, 100% { transform: scale(1) rotate(0); }
      35% { transform: scale(1.1) rotate(-2deg); }
      65% { transform: scale(1.05) rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce){ [class*="op-"] { animation: none !important; } }
  </style>

  <rect width="360" height="230" fill="#FFFFFF"/>

  <text x="180" y="56" class="op-ket">9 potong sama besar</text>

  <!-- Pita: 9 potong sama besar -->
  <g>
    <rect class="op-seg" style="animation-delay:0s"   x="27"  y="66" width="34" height="44" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect class="op-seg" style="animation-delay:.12s" x="61"  y="66" width="34" height="44" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect class="op-seg" style="animation-delay:.24s" x="95"  y="66" width="34" height="44" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect class="op-seg" style="animation-delay:.36s" x="129" y="66" width="34" height="44" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect class="op-seg" style="animation-delay:.48s" x="163" y="66" width="34" height="44" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect class="op-seg" style="animation-delay:.6s"  x="197" y="66" width="34" height="44" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect class="op-seg" style="animation-delay:.72s" x="231" y="66" width="34" height="44" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect class="op-seg" style="animation-delay:.84s" x="265" y="66" width="34" height="44" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect class="op-seg" style="animation-delay:.96s" x="299" y="66" width="34" height="44" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>

  <!-- Papan tulis: 2 potong (oranye) -->
  <g class="op-grp op-a">
    <rect x="27" y="66" width="34" height="44" fill="#FDBA74" stroke="#EA580C" stroke-width="1.5"/>
    <rect x="61" y="66" width="34" height="44" fill="#FDBA74" stroke="#EA580C" stroke-width="1.5"/>
    <line x1="27" y1="121" x2="93" y2="121" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
    <text x="61" y="141" class="op-lbl op-a-t">Papan tulis</text>
    <text x="61" y="157" class="op-lbl op-a-t">2 potong</text>
  </g>

  <!-- Pintu: 4 potong (biru) -->
  <g class="op-grp op-b">
    <rect x="95"  y="66" width="34" height="44" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="129" y="66" width="34" height="44" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="163" y="66" width="34" height="44" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="197" y="66" width="34" height="44" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5"/>
    <line x1="97" y1="121" x2="231" y2="121" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <text x="164" y="141" class="op-lbl op-b-t">Pintu</text>
    <text x="164" y="157" class="op-lbl op-b-t">4 potong</text>
  </g>

  <!-- Total -->
  <g class="op-total">
    <rect x="50" y="172" width="260" height="44" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="180" y="202" class="op-hasil"><tspan class="op-a-t">2</tspan> + <tspan class="op-b-t">4</tspan> = 6 potong</text>
  </g>
</svg>
